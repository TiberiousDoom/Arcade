<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Choke Point</title>
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#0b1418">
<link rel="icon" href="../../shared/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../shared/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="stylesheet" href="../../shared/theme.css">
<script type="module" src="../../shared/pwa.js"></script>
<style>
  /* Choke Point runs electrical blue, on a 780x520 board. */
  :root{
    --accent:#4d7fb3;
    --accent-hot:#6fb7e8;
    --accent-ink:#06121f;
    --board-max:780px;
  }

  /* the controls strip below the board: tower palette + start-wave. Lives in
     #shell (not footer, which is hidden on phones); its height is reserved by
     makeFit's `extra` hook so the board never hides behind it. */
  #controls{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  /* Sized for thumbs, not cursors — these were reported as too small to hit
     reliably on a phone. Keep min-height at or above ~64px. */
  .pick{
    flex:1 1 0;min-width:92px;min-height:72px;
    border:1px solid var(--line);background:#0f2027;color:var(--bone);
    border-radius:5px;padding:10px 11px;cursor:pointer;text-align:left;
    display:flex;flex-direction:column;gap:3px;
  }
  .pick.on{border-color:var(--accent-hot);background:#13293a}
  /* Unaffordable is a *look*, not a disabled button. Palette taps must always
     select, so you can pick what you are saving up for and watch the cost —
     v26 disabled these and then silently moved the selection elsewhere when
     the money ran out, which is the behavior that got reported. */
  .pick.broke{opacity:.45}
  .pick.broke .cost{color:var(--dim)}
  .pick b{font:700 13px/1 'Chivo Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
  .pick .cost{font-size:12px;color:var(--accent-hot)}
  .pick .blurb{font-size:10px;color:var(--dim);line-height:1.3}
  /* The three wave controls share one row, in their own wrapper so they sit
     below the tower palette rather than being flowed in beside it. They used
     to be `flex:1 1 100%` each, which forced every one onto a line of its
     own — stacked full-width buttons ate ~28% of a phone screen, and that
     lost height is what left the board too short to fill the width (which
     showed up as dead space either side of the board). */
  #waveRow{flex:1 1 100%;display:flex;gap:8px}
  #waveRow button{flex:1 1 0;min-width:0;min-height:52px;padding:12px 6px}
  #ffWave, #contWave{background:#1b3038;color:var(--bone);border:1px solid transparent}
  /* An "on" toggle has to be unmistakable at a glance mid-wave. The old state
     was `--accent` on `--accent-ink`, a muted blue that read as "slightly
     different button" rather than "this is switched on" — reported as hard to
     tell. Now it takes the *hot* accent, a matching border and a glow, so the
     lit one is the brightest thing in the row. Same treatment for the tower
     popup's targeting buttons, which had the identical problem. */
  #ffWave.on, #contWave.on{
    background:var(--accent-hot);color:var(--accent-ink);
    border-color:var(--accent-hot);box-shadow:0 0 8px rgba(111,183,232,.55);font-weight:700;
  }
  /* Rush is a verb, not a toggle — what matters there is whether it can be
     pressed at all, so an unavailable one is plainly dead rather than dimly
     similar to a live one. */
  #waveRow button:disabled{opacity:.35;box-shadow:none}
  /* Start and Rush are the decisions; FF and Auto are modes you set once and
     forget. So the two verbs keep full-size targets and the two toggles share
     the footprint one button used to have.
     Scoped under #waveRow deliberately: a bare `#startWave` is *less* specific
     than the `#waveRow button` rule above (id beats id, but id+element beats
     id alone), so it would silently lose and every button would come out the
     same width. */
  #waveRow #startWave, #waveRow #rushWave{flex:2 1 0}
  #waveRow #ffWave, #waveRow #contWave, #waveRow #shopBtn{flex:1 1 0;font-size:16px;letter-spacing:0}

  /* Sits with the two mode toggles rather than on a row of its own — see the
     comment where it is built. Tinted like them so the row reads as two verbs
     and three glyphs. */
  #shopBtn{background:#1b3038;color:var(--bone)}

  /* Phones: the palette drops its blurb and goes to one line per tower. The
     three blurbs cost ~28px of strip height to explain what the cost and the
     color already imply, and that height comes straight off the board under
     `fillWidth`. The help panel still carries the full description. */
  @media (max-width:560px){
    .pick{min-height:56px;padding:8px 9px;flex-direction:row;align-items:baseline;gap:6px}
    .pick .blurb{display:none}
  }

  /* the tap-a-tower popup: targeting / sell */
  #tsel{position:absolute;z-index:6;display:none;flex-direction:column;gap:6px;
    background:rgba(11,20,24,.97);border:1px solid var(--line);border-radius:6px;
    padding:10px;min-width:150px}
  #tsel.on{display:flex}
  #tsel h3{font:700 11px/1 'Chivo Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-hot)}
  #tsel button{padding:12px 14px;font-size:12px}
  #tsel .xp{font-size:10px;color:var(--dim);letter-spacing:.06em;
    display:flex;align-items:center;gap:6px}
  #tsel .xpbar{flex:1 1 auto;height:5px;background:#16303a;border-radius:1px;overflow:hidden}
  #tsel .xpbar i{display:block;height:100%;background:var(--accent)}
  #tsel .xp em{font-style:normal;flex:0 0 auto}
  #tsel .prio{display:flex;gap:4px}
  #tsel .prio button{flex:1 1 0;padding:10px 4px;font-size:10px;letter-spacing:.04em;
    border:1px solid transparent}
  #tsel .prio button.on{
    background:var(--accent-hot);color:var(--accent-ink);
    border-color:var(--accent-hot);box-shadow:0 0 8px rgba(111,183,232,.55);font-weight:700;
  }
  #tsel .sell{background:#2a1a17;color:#e0a89c}
  #tsel .sell:hover{background:#3a241f}
  #tsel .move{background:#16303a;color:var(--bone)}
  #tsel .move:hover{background:#1d3d49}
  #tsel .move:disabled{opacity:.45}

  /* The armory. Covers the stage like Flak Battery's shop, and for the same
     reason: it is a place you stop and think, not an overlay you peek past. */
  #shop{position:absolute;inset:0;display:none;flex-direction:column;z-index:7;
    background:rgba(11,20,24,.96);padding:16px 14px;overflow-y:auto;gap:12px}
  #shop.on{display:flex}
  #shopHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  #shopHead h2{font-family:'Archivo Black',sans-serif;font-size:clamp(15px,3.6vw,19px);text-transform:uppercase;letter-spacing:-.02em}
  #shopComps{font-size:12px;color:var(--accent-hot);font-weight:700;letter-spacing:.08em}
  #shop .note{font-size:10px;color:var(--dim);line-height:1.5}
  /* The armory grid: a track-label column plus one column per class. The
     buttons are the cells, so a row is "what this track costs on each class" —
     which is the comparison the spec/weak pricing is asking you to make. */
  .armTable{display:grid;grid-template-columns:auto repeat(var(--cols),1fr);gap:5px;align-items:stretch}
  .armTable .ch{
    font:700 11px/1 'Chivo Mono',monospace;letter-spacing:.08em;text-transform:uppercase;
    display:flex;align-items:flex-end;justify-content:center;text-align:center;
    padding:0 2px 6px;border-bottom:2px solid;
  }
  .armTable .rh{
    font-size:10px;letter-spacing:.06em;color:var(--bone);
    display:flex;align-items:center;padding-right:6px;
  }
  .armTable .cell{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    min-height:52px;padding:7px 4px;border:1px solid var(--line);border-radius:4px;
    background:#16303a;color:var(--bone);cursor:pointer;
  }
  .armTable .cell:hover:not(:disabled){background:#1d3d49;border-color:var(--accent-hot)}
  /* the class's speciality and its opposite, marked on the cell rather than
     explained in a legend */
  .armTable .cell.spec{border-color:var(--accent)}
  .armTable .cell.weak{border-color:#5c3a33}
  .armTable .cell.broke{opacity:.5;cursor:default}
  .armTable .cell:disabled{cursor:default}
  .armTable .px{font:700 12px/1 'Chivo Mono',monospace;letter-spacing:.04em;color:var(--accent-hot)}
  .armTable .cell.broke .px{color:var(--dim)}
  .armTable .cell:disabled .px{color:var(--dim)}
  /* the five bought levels, so "how far along is this" is a glance not a sum */
  .armTable .pips{display:flex;gap:2px;width:100%;max-width:52px}
  .armTable .pips i{flex:1 1 0;height:4px;background:#0d1c22;border-radius:1px}
  .armTable .pips i.on{background:var(--accent-hot)}
  @media (max-width:400px){
    .armTable{gap:4px}
    .armTable .rh{font-size:9px;padding-right:4px}
    .armTable .cell{min-height:46px;padding:5px 2px}
  }
  #shopClose{align-self:center;margin-top:2px;min-height:48px;padding:12px 28px}

  /* a difficulty not yet earned: visible, so you know what is up there, but
     plainly out of reach */
  .menuSettings label.locked{opacity:.4}
  .menuSettings label em{font-style:normal;font-size:9px;color:var(--dim);letter-spacing:.1em}
</style>

<div id="shell">
  <header>
    <div class="titles">
      <a class="back" href="../../index.html">&larr; Arcade</a>
      <h1>Choke <span>Point</span></h1>
    </div>
    <div class="meta">
      <div>Wave <b id="uiWave">0</b></div>
      <div>Score <b id="uiScore">0</b></div>
      <div>Comps <b id="uiComponents">0</b></div>
      <div>Core <b id="uiIntegrity">20</b></div>
      <div>Best <b id="uiBest">—</b></div>
      <div>Route <b id="uiRoute">1/3</b></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv" width="780" height="520"></canvas>
    <div id="tsel"></div>
    <div id="shop">
      <div id="shopHead">
        <h2>Armory</h2>
        <div id="shopComps">Components 0</div>
      </div>
      <p class="note">Per class, kept between runs.</p>
      <div id="shopClasses"></div>
      <button id="shopClose">Back to the board</button>
    </div>
    <div id="banner">
      <h2>Choke Point</h2>
      <p id="hint">Pick a tower, tap a cell.</p>
      <button id="go">Begin</button>
    </div>
  </div>

  <div id="controls"></div>
</div>

<script type="module">
import * as E from './engine.js';
import { makeFit } from '../../shared/fit.js';
import { makeFx } from '../../shared/fx.js';
import { glowStroke, glowDot, inkDot, extrudeDisc, cube, dim, GLOW_PASSES_CHEAP } from '../../shared/glow.js';
import { best, submit } from '../../shared/scores.js';
import { recordProgress } from '../../shared/unlocks.js';
import { saveRun, loadRun, clearRun } from '../../shared/resume.js';
import { makeAudio } from '../../shared/audio.js';
import { makeMenu } from '../../shared/menu.js';
import { buzz } from '../../shared/prefs.js';

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const TAU = E.TAU;
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const $ = id => document.getElementById(id);
const GAME_ID = 'choke-point';

const gfx = makeFx({ reduce });
const audio = makeAudio();

/* ---------- the armory and the difficulty dial, both kept between runs ----

   Guarded reads and writes throughout: Safari in private mode throws on any
   localStorage access rather than returning null, so an unguarded read here
   would take the whole game down on load. Same pattern as shared/levels.js;
   it stays local because Choke Point is the only game with an armory and
   CLAUDE.md is explicit about not building shared helpers on spec. */
const ARMORY_KEY = 'arcade:choke-point:armory';
/* The key was `…:armoury` until v31 renamed everything to American spelling.
   Read the old one once and carry it forward: the key changes as asked, but a
   player's purchases are the one thing in this game that survive a run, and
   losing them to a spelling change would be indefensible. */
const ARMORY_KEY_OLD = 'arcade:choke-point:armoury';
const DIFF_KEY = 'arcade:choke-point:difficulty';

function readArmory() {
  const fresh = E.newClassUpgrades();
  let raw = null;
  try {
    raw = localStorage.getItem(ARMORY_KEY);
    if (raw === null) {
      // first run since the rename: adopt whatever the old key held
      raw = localStorage.getItem(ARMORY_KEY_OLD);
      if (raw !== null) localStorage.setItem(ARMORY_KEY, raw);
    }
  } catch { return fresh; }
  if (!raw) return fresh;
  try {
    const saved = JSON.parse(raw);
    // Merged into a fresh object rather than trusted wholesale: a save written
    // by an older build knows nothing about a track added since, and a level
    // past the cap would quietly hand out stats no shop could sell.
    for (const type of E.TOWER_KEYS) {
      for (const track of E.CLASS_TRACKS) {
        const v = saved?.[type]?.[track];
        if (Number.isFinite(v)) fresh[type][track] = Math.max(0, Math.min(E.CLASS_MAX, Math.floor(v)));
      }
    }
  } catch { /* corrupt: an empty armory beats a broken game */ }
  return fresh;
}
function writeArmory(a) {
  try { localStorage.setItem(ARMORY_KEY, JSON.stringify(a)); } catch { /* private mode */ }
}
function readDifficulty() {
  try {
    const v = localStorage.getItem(DIFF_KEY);
    // a difficulty stored before it was earned (or before this build gated
    // them) must not be honored, or the gate is one localStorage edit deep
    if (E.DIFFICULTIES[v] && E.difficultyUnlocked(progress, v)) return v;
  } catch { /* fall through */ }
  return E.DEFAULT_DIFFICULTY;
}
function writeDifficulty(d) {
  try { localStorage.setItem(DIFF_KEY, d); } catch { /* private mode */ }
}

/* What the player has beaten: which circuits, on which difficulty. Kept beside
   the armory and read the same defensive way — the engine holds the rules
   (`routeUnlocked`, `difficultyUnlocked`, `recordWin`), this holds the bytes. */
const PROGRESS_KEY = 'arcade:choke-point:progress';

function readProgress() {
  try { return E.sanitizeProgress(JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null')); }
  catch { return E.newProgress(); }
}
function writeProgress(p) {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch { /* private mode */ }
}

const progress = readProgress();

/** The circuit a new run should start on: the furthest one unlocked at this
 *  difficulty, so "play again" continues the campaign rather than replaying a
 *  board already beaten. */
function nextRoute(difficulty) {
  return E.unlockedRoutes(progress, difficulty) - 1;
}

/* short-lived hit beams, drawn by the shell. Purely cosmetic. */
const beams = [];

const fx = {
  kill(x, y, type) { gfx.burst(x, y, E.ENEMY_TYPES[type].col, 12); audio.hit(); },
  leak(x, y) { gfx.hit(.6); audio.breach(); },
  shot(x, y, target, type) {
    if (!reduce) {
      const p = E.enemyPos(world, target);
      beams.push({ x1: x, y1: y, x2: p.x, y2: p.y, col: E.TOWER_TYPES[type].col, life: .08 });
    }
    audio.fire();
  },
  build() { audio.eat(); },
  // a tower levelled: a small burst in its own color, so the moment is
  // visible without a banner interrupting a wave
  level(x, y, tower) {
    gfx.burst(x, y, E.TOWER_TYPES[tower.type].col, 8);
    audio.bonus();
  },
};

/* ---------- layout ---------- */
/* Portrait-only since 2026-07-27: landscape didn't feel right on a real phone.
   Every board uses the tall layout regardless of orientation. The rotation
   machinery below is left intact but inert (applyLayout early-returns because
   the layout never changes) — flip this flag back to false to restore
   landscape without re-deriving anything. */
const PORTRAIT_ONLY = true;
const pickLayout = () =>
  (PORTRAIT_ONLY || matchMedia('(max-aspect-ratio: 4/5)').matches) ? E.LAYOUT_TALL : E.LAYOUT;

const startDifficulty = readDifficulty();
const world = E.createWorld({
  fx, layout: pickLayout(), seed: Date.now() & 0x7fffffff,
  classUpgrades: readArmory(), difficulty: startDifficulty,
  // start on the furthest circuit earned at this difficulty, not on route 1
  routeIndex: nextRoute(startDifficulty),
});

let W = world.L.W, H = world.L.H;
const board = { w: W, h: H };

function adoptLayout() {
  W = world.L.W; H = world.L.H;
  board.w = W; board.h = H;
  cv.width = W; cv.height = H;
  document.documentElement.style.setProperty('--board-max', W + 'px');
}
adoptLayout();

/* ---------- tower palette ---------- */
let selected = 'node';   // currently-picked tower type for building
// assigned further down, but syncPalette can run before then, so it has to
// exist as a binding from the start rather than be a later `const`.
let fitStage = null;

const controls = $('controls');
const pickBtns = {};
for (const key of E.TOWER_KEYS) {
  const T = E.TOWER_TYPES[key];
  const b = document.createElement('button');
  b.className = 'pick';
  b.type = 'button';
  b.innerHTML = `<b style="color:${T.col}">${T.name}</b><span class="cost">${T.cost}</span><span class="blurb">${T.blurb}</span>`;
  b.addEventListener('click', () => { selected = key; syncPalette(); });
  controls.append(b);
  pickBtns[key] = b;
}
// the wave controls get their own row below the tower palette
const waveRow = document.createElement('div');
waveRow.id = 'waveRow';
controls.append(waveRow);

const startBtn = document.createElement('button');
startBtn.id = 'startWave';
startBtn.type = 'button';
startBtn.textContent = 'Start Wave';
startBtn.addEventListener('click', () => { if (world.running) E.startWave(world); syncPalette(); });
waveRow.append(startBtn);

/* Rush: pull the rest of *this* wave forward. Deleted in v26 on the assumption
   that fast-forward covered it — it does not, and the difference is the point.
   Fast-forward speeds up time, so your towers fire proportionally faster and
   the wave is exactly as hard, just shorter. Rush speeds up the enemy alone:
   the same wave arrives sooner, against towers reloading at their normal rate.
   One is a convenience, the other is a gamble taken for the bounty. */
const rushBtn = document.createElement('button');
rushBtn.id = 'rushWave';
rushBtn.type = 'button';
rushBtn.textContent = 'Rush';
rushBtn.addEventListener('click', () => { if (world.running) E.rushWave(world); syncPalette(); });
waveRow.append(rushBtn);

/* Fast-forward: a speed multiplier over the *whole* simulation, cycled by
   tapping. Deliberately a shell concern, not an engine one — the engine is
   already a pure function of `dt`, so running it faster is just handing it
   more time. Nothing about pacing needs to know a multiplier exists. */
const SPEEDS = [1, 2, 4];
let speedIdx = 0;
const ffBtn = document.createElement('button');
ffBtn.id = 'ffWave';
ffBtn.type = 'button';
ffBtn.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  syncPalette();
});
waveRow.append(ffBtn);

/* Continuous: auto-start the next wave the moment the current one clears, for
   players who don't want to tap Start between every wave. A third want again,
   distinct from both Rush and fast-forward. */
let continuous = false;
const contBtn = document.createElement('button');
contBtn.id = 'contWave';
contBtn.type = 'button';
contBtn.setAttribute('aria-label', 'Auto-start next wave');
contBtn.addEventListener('click', () => { continuous = !continuous; syncPalette(); });
waveRow.append(contBtn);

/* The armory. It used to have a full-width row of its own below everything,
   which cost the strip an entire button height — and under `fillWidth` that
   height comes straight off the board. It sits in the wave row now, as a glyph
   at toggle width: the row is already glyph-based for its two modes, and the
   armory is a destination you tap between waves rather than a decision made
   under pressure, so it does not need a verb-sized target. */
const shopBtn = document.createElement('button');
shopBtn.id = 'shopBtn';
shopBtn.type = 'button';
shopBtn.textContent = '⚒';
shopBtn.setAttribute('aria-label', 'Purchase upgrades');
shopBtn.addEventListener('click', () => openShop());
waveRow.append(shopBtn);

function syncPalette() {
  /* Selection is sticky, and unaffordable is a *look* rather than a disabled
     button. v26 got this wrong twice over: it disabled the buttons, so you
     could not pick the thing you were saving up for, and then when the money
     ran out it silently moved the highlight to whatever you *could* afford —
     so a tap you thought you had made had quietly become a different tap. Now
     nothing reassigns the choice but you, and the cost simply reads dim until
     you can pay it. */
  for (const key of E.TOWER_KEYS) {
    const b = pickBtns[key];
    b.classList.toggle('on', key === selected);
    b.classList.toggle('broke', world.components < E.TOWER_TYPES[key].cost);
    b.disabled = false;
  }

  // Disabled, not hidden, so the controls strip never reflows and there is
  // nothing for makeFit to re-fit. startWave works mid-wave (it overlaps the
  // next wave onto the current one), so it's only meaningless when the run
  // isn't live at all.
  const live = world.running && !world.over;
  startBtn.disabled = !live;
  ffBtn.disabled = !live;
  contBtn.disabled = !live;
  // rush only means something while spawns are still queued
  rushBtn.disabled = !live || !world.waveActive || world.spawnQueue.length === 0;
  shopBtn.disabled = world.over;
  // Symbols, not words: these two are modes rather than verbs, and the glyphs
  // are what let them share the space one worded button used to need.
  // Always "N×", including at 1×. The triangle it used to show at rest said
  // "play" — which reads as a thing to press to start, not as the current speed.
  ffBtn.textContent = SPEEDS[speedIdx] + '×';
  ffBtn.setAttribute('aria-label', `Fast forward ${SPEEDS[speedIdx]}x`);
  ffBtn.classList.toggle('on', speedIdx > 0);
  contBtn.textContent = '↻';
  contBtn.classList.toggle('on', continuous);
}

/* ---------- the armory ---------- */

const TRACK_LABEL = { dmg: 'Damage', rate: 'Fire rate', range: 'Range', splash: 'Splash' };

/* A grid: one column per class, one row per track, and the buy button is the
   cell. It was three stacked per-class cards, which meant comparing what a
   track costs across the classes — the one comparison the whole spec/weak
   pricing exists to make you think about — needed scrolling between boxes.
   Side by side, "cheap here, dear there" is just the row you are looking at.

   Each cell carries its price on top and its five pips underneath, so a cell
   answers both questions a player has about a track (what does the next one
   cost, how far along am I) without a legend. */
function renderShop() {
  $('shopComps').textContent = 'Components ' + Math.floor(world.components);
  const host = $('shopClasses');
  host.innerHTML = '';

  const table = document.createElement('div');
  table.className = 'armTable';
  table.style.setProperty('--cols', E.TOWER_KEYS.length);

  // header row: a blank corner, then one heading per class
  table.insertAdjacentHTML('beforeend', '<div class="corner"></div>');
  for (const type of E.TOWER_KEYS) {
    const T = E.TOWER_TYPES[type];
    table.insertAdjacentHTML('beforeend',
      `<div class="ch" style="color:${T.col};border-color:${T.col}">${T.name}</div>`);
  }

  for (const track of E.CLASS_TRACKS) {
    table.insertAdjacentHTML('beforeend', `<div class="rh">${TRACK_LABEL[track]}</div>`);
    for (const type of E.TOWER_KEYS) {
      const T = E.TOWER_TYPES[type];
      const have = world.classUpgrades[type][track];
      const cost = E.classCost(type, track, have);
      const maxed = cost === null;
      const afford = !maxed && world.components >= cost;
      // the class's speciality and its opposite, marked on the cell itself
      const rel = T.spec === track ? ' spec' : T.weak === track ? ' weak' : '';
      const pips = Array.from({ length: E.CLASS_MAX },
        (_, i) => `<i class="${i < have ? 'on' : ''}"></i>`).join('');
      table.insertAdjacentHTML('beforeend',
        `<button class="cell${rel}${afford ? '' : ' broke'}"` +
        ` data-t="${type}" data-k="${track}"${maxed || !afford ? ' disabled' : ''}` +
        ` aria-label="${T.name} ${TRACK_LABEL[track]}, ${maxed ? 'maxed' : cost + ' components'}">` +
        `<span class="px">${maxed ? 'MAX' : cost}</span>` +
        `<span class="pips">${pips}</span>` +
        `</button>`);
    }
  }
  host.append(table);

  for (const b of host.querySelectorAll('button[data-t]')) {
    b.addEventListener('click', () => {
      if (E.buyClassUpgrade(world, b.dataset.t, b.dataset.k)) {
        writeArmory(world.classUpgrades);
        renderShop(); sync();
      }
    });
  }
}

/* The armory pauses the run. It is a place you stop and think, and reading a
   price table while surges walk into your core is not a decision, it is a
   penalty for looking. It also removes the stale-affordability problem at the
   root: components cannot arrive while you are in here. */
let shopOpen = false;
function openShop() { shopOpen = true; $('shop').classList.add('on'); renderShop(); }
function closeShop() { shopOpen = false; $('shop').classList.remove('on'); }
$('shopClose').addEventListener('click', closeShop);

/* ---------- tower popup (targeting / sell) ---------- */
const tsel = $('tsel');
let popupIndex = -1;

function openTowerPopup(i, px, py) {
  popupIndex = i;
  // place near the tap, clamped into the stage
  const rect = cv.getBoundingClientRect();
  tsel.style.left = Math.min(px, rect.width - 160) + 'px';
  tsel.style.top = Math.min(py, rect.height - 110) + 'px';
  tsel.classList.add('on');
  renderPopup();
}

const PRIORITY_LABEL = { first: 'First', last: 'Last', strongest: 'Strongest' };

/* Redraws the popup's contents in place. Changing targeting re-renders rather
   than closing, so a player can try a mode and switch again without re-tapping
   the tower. Only an outside tap (or a sell, which removes the tower) closes it.

   There is no Upgrade button any more: towers level themselves from combat, and
   what money buys is the whole class, in the armory. What is left here is the
   one per-tower decision still worth making — what it shoots at first. */
function renderPopup() {
  const t = world.towers[popupIndex];
  if (!t) { closePopup(); return; }
  const lvl = Math.min(E.MAX_LEVEL, t.level || 1);
  const next = E.xpForNext(lvl);
  tsel.innerHTML =
    `<h3>${E.TOWER_TYPES[t.type].name} · L${lvl}</h3>` +
    /* A bar, not a number. Since v28 cut the XP rate tenfold a tower earns
       fractions per shot, and `Math.floor` sat on 0 through the first dozen
       kills — which read as levelling being broken. A filling bar shows the
       same progress without asking anyone to notice a decimal place. */
    `<div class="xp">${lvl >= E.MAX_LEVEL ? 'Fully trained'
      : `<span class="xpbar"><i style="width:${Math.round(Math.min(1, t.xp / next) * 100)}%"></i></span>` +
        `<em>L${lvl + 1}</em>`}</div>` +
    `<div class="prio">` +
    E.PRIORITIES.map(p =>
      `<button data-p="${p}" class="${(t.priority || 'first') === p ? 'on' : ''}">${PRIORITY_LABEL[p]}</button>`
    ).join('') +
    `</div>` +
    `<button class="move" id="tMove"${world.components < E.moveCost(t) ? ' disabled' : ''}>` +
      `Move · ${E.moveCost(t)}</button>` +
    `<button class="sell" id="tSell">Sell · +${E.sellValue(t)}</button>`;
  for (const b of tsel.querySelectorAll('.prio button')) {
    b.addEventListener('click', () => {
      E.setPriority(world, popupIndex, b.dataset.p);
      renderPopup();
    });
  }
  $('tMove').addEventListener('click', () => { beginMove(popupIndex); });
  $('tSell').addEventListener('click', () => { E.sellTower(world, popupIndex); closePopup(); sync(); });
}
function closePopup() { tsel.classList.remove('on'); popupIndex = -1; }

/* ---------- moving a tower ----------

   A two-tap gesture rather than a modal: tap Move, then tap where it should go.
   While the move is pending the board shows the destinations it will accept, so
   the answer to "why won't it go there" is on screen before the tap, not after.
   Dragging an already-built tower does the same thing in one gesture — see the
   pointer handlers below. */
let moveIndex = -1;             // which tower is looking for a new cell, or -1

function beginMove(i) {
  moveIndex = i;
  closePopup();
  sync();
}
function cancelMove() { moveIndex = -1; sync(); }

/** True if the pending move could legally land on this cell. */
function moveTargetOk(c, r) {
  return moveIndex >= 0 && E.canMove(world, moveIndex, c, r);
}

/* ---------- input ---------- */
function stagePt(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height),
           lx: e.clientX - r.left, ly: e.clientY - r.top };
}

cv.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  e.preventDefault();
  if (!world.running) return;
  if (tsel.classList.contains('on')) { closePopup(); return; }

  const p = stagePt(e);
  const cell = E.cellAt(world.L, p.x, p.y);

  /* A pending move owns the next tap on the board. Anywhere illegal — off the
     grid, on the path, on another tower — cancels rather than silently doing
     nothing, so there is always a way out of the state without a Cancel button.
     Deliberately checked before the build branch: while a move is pending, a
     tap on an empty cell must move the tower there, not build a second one. */
  if (moveIndex >= 0) {
    // moveTower fires the engine's `build` fx hook, which is what makes the
    // sound — nothing extra to play here
    if (cell && moveTargetOk(cell.c, cell.r)) E.moveTower(world, moveIndex, cell.c, cell.r);
    cancelMove();
    return;
  }

  if (!cell) return;

  /* A press on an existing tower is ambiguous until it either moves or lets
     go: a tap opens the popup, a drag relocates the tower. So the popup waits
     for pointerup — opening it here and closing it again on the first drag
     frame made it flash open on every relocation. */
  const existing = world.towers.findIndex(t => t.c === cell.c && t.r === cell.r);
  if (existing >= 0) {
    dragMove = existing;
    dragFrom = { x: e.clientX, y: e.clientY, lx: p.lx, ly: p.ly };
    return;
  }

  // a tap that actually placed something, confirmed in the hand — the
  // board is dense enough that a rejected tap looks much like an accepted one
  if (E.buildTower(world, cell.c, cell.r, selected)) { buzz(); sync(); }
});
for (const ev of ['selectstart', 'contextmenu', 'dragstart']) {
  cv.addEventListener(ev, e => e.preventDefault());
}

/* ---------- drag-and-drop placement ----------
   Tap-a-palette-tower-then-tap-a-cell (above) still works; this adds
   picking a palette tower up and dropping it straight onto a cell in one
   gesture. Pointer events, not the HTML5 drag API — dragstart is
   preventDefault'd above, and touch needs pointer events anyway. */
let dragType = null;

function dragPoint(e) {
  const r = cv.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return null;
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}

for (const key of E.TOWER_KEYS) {
  pickBtns[key].addEventListener('pointerdown', e => {
    if (!world.running) return;
    // Selecting always works, even when you cannot afford it yet — that is how
    // you pick what to save for. Only the *drag* is gated on affording it,
    // since a drag that cannot end in a build is a dead gesture.
    selected = key; syncPalette();
    if (world.components < E.TOWER_TYPES[key].cost) return;
    dragType = key;
    hoverCell = null;
    e.preventDefault();
  });
}
/* Dragging a tower that is already on the board relocates it — the same gesture
   as dragging one out of the palette, so there is nothing new to learn. It arms
   on a travel threshold: below that the press was a tap, and opens the popup. */
let dragMove = -1;              // tower under a press that might become a drag
let dragFrom = null;
const DRAG_ARM = 8;             // px of travel before a press counts as a drag

addEventListener('pointermove', e => {
  if (dragMove >= 0) {
    if (moveIndex < 0) {
      if (Math.hypot(e.clientX - dragFrom.x, e.clientY - dragFrom.y) < DRAG_ARM) return;
      moveIndex = dragMove;     // armed: this is a relocation, not a tap
    }
    const p = dragPoint(e);
    hoverCell = p ? E.cellAt(world.L, p.x, p.y) : null;
    return;
  }
  if (!dragType) return;
  const p = dragPoint(e);
  hoverCell = p ? E.cellAt(world.L, p.x, p.y) : null;
});

addEventListener('pointerup', e => {
  if (dragMove >= 0) {
    const armed = moveIndex === dragMove;
    const i = dragMove, from = dragFrom;
    dragMove = -1; dragFrom = null;
    if (armed) {
      const p = dragPoint(e);
      const cell = p && E.cellAt(world.L, p.x, p.y);
      if (cell && moveTargetOk(cell.c, cell.r)) E.moveTower(world, moveIndex, cell.c, cell.r);
      cancelMove();
      hoverCell = null;
    } else {
      openTowerPopup(i, from.lx, from.ly);   // it was a tap after all
    }
    return;
  }
  if (!dragType) return;
  const p = dragPoint(e);
  const cell = p && E.cellAt(world.L, p.x, p.y);
  if (cell && E.buildTower(world, cell.c, cell.r, dragType)) { buzz(); sync(); }
  dragType = null; hoverCell = null;
});

addEventListener('keydown', e => {
  if (e.code === 'Digit1') selected = 'node';
  else if (e.code === 'Digit2') selected = 'breaker';
  else if (e.code === 'Digit3') selected = 'coil';
  else if (e.code === 'Enter' || e.code === 'Space') {
    e.preventDefault();
    // matches the button: startWave overlaps mid-wave, so it isn't gated on
    // betweenWaves any more
    if (world.running && !world.over) E.startWave(world);
  } else return;
  syncPalette();
});

/* No `extra` needed: #controls is a sibling of #stage inside #shell, and
   makeFit now measures every shell child that isn't the board (plus the flex
   gaps and the body's padding). Passing it here as well would double-count
   the strip and shrink the board by its height twice over.

   `fillWidth` and `body.scrolls` were how v26 answered "the board is too small":
   spend the whole width and let the page scroll when the controls strip no
   longer fits. Reported in v31 as the wrong trade — a game you tap at should not
   move under your thumb, and a board you have to scroll to see all of is worse
   than a slightly smaller one you don't. Back to the default fit, which sizes
   the board to what is actually on screen. */
fitStage = makeFit({ canvas: cv, stage: $('stage'), board });

/* ---------- rotation ---------- */
function applyLayout() {
  const L2 = pickLayout();
  if (L2 === world.L) return;
  const wasRunning = world.running;
  closePopup();
  E.relayout(world, L2);
  adoptLayout();
  fitStage();
  sync();
  if (wasRunning) {
    world.running = false;
    showBanner('Turned', 'Your towers came with it.', 'Resume');
  }
}
addEventListener('resize', applyLayout);
addEventListener('orientationchange', () => setTimeout(applyLayout, 200));

/* Game-specific settings for the menu panel: the difficulty a new run will use,
   and the one control that can undo the armory. Both go through makeMenu's
   `extra` slot, the same hook Feedline uses for its input settings. */
const settingsEl = document.createElement('div');
settingsEl.className = 'menuSettings';
settingsEl.innerHTML =
  `<label>Difficulty</label>` +
  `<div class="choice" id="diffChoice">` +
  E.DIFFICULTY_KEYS.map(k =>
    `<label><input type="radio" name="difficulty" value="${k}"> ${E.DIFFICULTIES[k].name} <em>${E.DIFFICULTIES[k].winWave}</em></label>`
  ).join('') +
  `</div>` +
  `<p class="hintline" id="diffNote"></p>` +
  `<button type="button" id="wipeArmory">Reset armory</button>`;

/* Everything here queries through `settingsEl`, not `document`. This element is
   detached until makeMenu mounts it into the panel, so a `getElementById` at
   this point finds nothing and the whole module dies on the first null. */
const diffNote = settingsEl.querySelector('#diffNote');
const wipeBtn = settingsEl.querySelector('#wipeArmory');

function syncDifficultyUI() {
  for (const r of settingsEl.querySelectorAll('input[name=difficulty]')) {
    r.checked = r.value === world.difficulty;
    // a difficulty you have not earned is disabled rather than hidden: knowing
    // what is up there is half the reason to go and win the one below
    const open = E.difficultyUnlocked(progress, r.value);
    r.disabled = !open;
    r.closest('label').classList.toggle('locked', !open);
  }
  diffNote.textContent = world.wave > 0
    ? 'Applies to your next run.'
    : `Win wave ${E.winWave(world.difficulty)} to take the circuit.`;
}
for (const r of settingsEl.querySelectorAll('input[name=difficulty]')) {
  r.addEventListener('change', () => {
    if (!E.difficultyUnlocked(progress, r.value)) { syncDifficultyUI(); return; }
    writeDifficulty(r.value);
    // safe to apply immediately only before the first wave has started
    if (world.wave === 0 && !world.waveActive) {
      world.difficulty = r.value;
      const D = E.DIFFICULTIES[r.value];
      world.components = D.components; world.integrity = D.integrity;
      // the circuit follows the difficulty: each is unlocked separately, so
      // switching to Medium must drop you back to the routes earned there
      E.resetGame(world, { difficulty: r.value, routeIndex: nextRoute(r.value) });
      sync();
    }
    syncDifficultyUI();
  });
}
wipeBtn.addEventListener('click', () => {
  // Two taps, because it throws away every run's worth of purchases and there
  // is no getting it back.
  if (wipeBtn.dataset.armed !== '1') {
    wipeBtn.dataset.armed = '1';
    wipeBtn.textContent = 'Really reset? Tap again';
    setTimeout(() => { wipeBtn.dataset.armed = ''; wipeBtn.textContent = 'Reset armory'; }, 4000);
    return;
  }
  wipeBtn.dataset.armed = ''; wipeBtn.textContent = 'Reset armory';
  world.classUpgrades = E.newClassUpgrades();
  writeArmory(world.classUpgrades);
  sync();
});

const pause = makeMenu({
  stage: $('stage'),
  host: document.querySelector('header'),
  audio,
  title: 'Choke Point',
  lore: 'They are on the ground now, and they only advance one way. Make that one way expensive.',
  extra: settingsEl,
  rows: [
    ['Build', 'Pick a tower, tap a cell.'],
    ['Wave', 'Start Wave. Kills pay components.'],
    ['Adjust', 'Tap a tower to retarget, move or sell. Drag to move.'],
  ],
  notes: [
    'Anything a Coil slows takes more damage from everything else.',
    'Towers level by fighting. ⚒ upgrades a whole class, and keeps between runs.',
    'Reach the wave in the menu to take the circuit and open the next.',
    'Keyboard: 1/2/3 pick, Enter starts.',
  ],
});
syncDifficultyUI();

/* ---------- banner ---------- */
function showBanner(h, p, btn) {
  $('banner').classList.remove('hide');
  $('banner').querySelector('h2').textContent = h;
  $('hint').innerHTML = p;
  $('go').textContent = btn;
}
function hideBanner() { $('banner').classList.add('hide'); }

$('go').addEventListener('click', () => {
  // a new run picks up whatever difficulty is currently selected; the armory
  // carries over untouched, which is the whole point of it
  contBtnEl.remove();
  // `won` covers the victory banner, where the run is finished but the core
  // never broke — the button there starts the next circuit, not a resume
  if (world.over || world.won) startFreshRun();
  world.running = true;
  gfx.clear();
  hideBanner();
  sync();
});

function startFreshRun() {
  const d = readDifficulty();
  E.resetGame(world, { difficulty: d, routeIndex: nextRoute(d) });
  barrelOut.clear(); readyHold.clear();
  clearRun(GAME_ID);
}

/* ---------- winning ----------

   Taking a circuit is the one moment this game had no way to express: it was
   endless, so the best possible run ended the same way as the worst, with the
   core breached. Now clearing the difficulty's win wave takes the board, banks
   the unlock, and offers both doors — because a player who has just built
   something that survives 50 waves may well want to see how far it goes, and
   there is no reason to make them choose between that and the reward. */
const contBtnEl = document.createElement('button');
contBtnEl.type = 'button';
contBtnEl.id = 'keepGoing';
contBtnEl.textContent = 'Keep going';
contBtnEl.style.cssText = 'margin-left:8px;background:#1b3038;color:var(--bone)';
contBtnEl.addEventListener('click', () => {
  contBtnEl.remove();
  world.running = true;
  hideBanner();
  sync();
});

function onVictory() {
  world.justWon = false;
  world.running = false;
  const opened = E.recordWin(progress, world.difficulty, world.routeIndex);
  writeProgress(progress);
  clearRun(GAME_ID);                 // a won run is not one to come back to
  submit(GAME_ID, world.score, `Won · ${E.DIFFICULTIES[world.difficulty].name}`);
  syncBest();

  const bits = [`Circuit ${world.routeIndex + 1} held at wave ${world.wave}.`];
  if (opened.route) bits.push(`Circuit ${opened.route + 1} open.`);
  if (opened.difficulty) bits.push(`${E.DIFFICULTIES[opened.difficulty].name} open.`);
  showBanner('Circuit Held', bits.join(' '), opened.route ? 'Next circuit' : 'New run');
  $('go').after(contBtnEl);
  syncDifficultyUI();
}

/* ---------- resuming an interrupted run ----------

   A phone closes the app constantly and without warning, and a tower-defense
   run is long enough that losing one hurts. The save is written on the beats
   where the world is quiet and meaningful — between waves, and when the page is
   hidden — rather than every frame, which would be a JSON.stringify of the
   whole board 60 times a second for no benefit. */

let resumeOffered = false;

function saveNow() {
  if (!world.running || world.over || !world.wave) { clearRun(GAME_ID); return; }
  saveRun(GAME_ID, E.snapshot(world), `Wave ${world.wave} · ${world.score}`);
}

// visibilitychange is the one that actually fires when a phone backgrounds an
// app; `beforeunload` is unreliable on mobile and pagehide covers the rest.
addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
addEventListener('pagehide', saveNow);

function offerResume() {
  const stored = loadRun(GAME_ID);
  if (!stored) return false;
  resumeOffered = true;
  showBanner('Resume run?', `<b style="color:var(--accent-hot)">${stored.label}</b>`, 'Continue');
  // a second button, so "start fresh" is one tap rather than a hidden gesture
  const fresh = document.createElement('button');
  fresh.type = 'button';
  fresh.id = 'freshStart';
  fresh.textContent = 'New run';
  fresh.style.cssText = 'margin-left:8px;background:#1b3038;color:var(--bone)';
  fresh.addEventListener('click', () => {
    clearRun(GAME_ID);
    fresh.remove();
    resumeOffered = false;
    showBanner('Choke Point', 'Pick a tower, tap a cell.', 'Begin');
  });
  $('go').after(fresh);

  $('go').addEventListener('click', function once() {
    $('go').removeEventListener('click', once);
    if (!resumeOffered) return;
    resumeOffered = false;
    fresh.remove();
    if (!E.hydrate(world, stored.snap)) {
      // a snapshot this build cannot read is dropped rather than half-applied
      clearRun(GAME_ID);
      E.resetGame(world);
    }
    adoptLayout();
    if (fitStage) fitStage();
    sync();
  }, { capture: true });
  return true;
}

offerResume();

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;

  if (world.running && !world.over && !pause.paused && !shopOpen) {
    const wasActive = world.waveActive;
    /* Fast-forward runs the same simulation more times, rather than handing
       `step` a bigger dt. A 4x dt would push a frame to 133ms, far past the
       sub-step sizes the collision and spawn code assume, and enemies would
       jump rather than move. Repeating a normal-sized step keeps every
       interval the engine sees identical to 1x — only more of them. */
    for (let i = 0; i < SPEEDS[speedIdx] && !world.over; i++) E.step(world, dt);
    const stillSpawning = world.spawnQueue.length > 0;
    // a wave just finished: the board is quiet and the run is worth keeping
    if (wasActive && !world.waveActive && !world.over) {
      saveNow();
      if (continuous && !world.justWon && world.wave < E.winWave(world.difficulty)) E.startWave(world);
    }
    /* Continuous means continuous: the next wave opens as soon as this one has
       finished *spawning*, not once the last straggler is dead. Waiting for the
       board to empty left a lull at the end of every wave — which is exactly
       the tap this toggle exists to remove. `startWave` already overlaps, so
       this is just letting it.

       It stops at the win wave, though. The win asks for a clear board, and
       auto-starting through it would keep feeding the board forever — which is
       precisely how v29 made the campaign unwinnable on Auto. The last wave is
       always allowed to resolve. */
    if (continuous && !stillSpawning && world.waveActive && !world.over && !world.justWon
        && world.wave < E.winWave(world.difficulty)) {
      E.startWave(world);
    }
    // taking the circuit interrupts everything, continuous mode included
    if (world.justWon) onVictory();
    if (world.over) {
      clearRun(GAME_ID);            // a finished run is not one to come back to
      // the difficulty rides along with the score: with an armory that grows
      // between runs, "wave 14" means something different on Easy than on Hard
      const r = submit(GAME_ID, world.score,
        `Wave ${world.wave} · ${E.DIFFICULTIES[world.difficulty].name}`);
      syncBest();
      showBanner('Core Breached',
        r.record ? `New best — <b style="color:var(--accent-hot)">${world.score}</b>, wave ${world.wave}`
                 : `Score <b style="color:var(--accent-hot)">${world.score}</b> · wave ${world.wave} · best ${r.best}`,
        'Play again');
    }
  }

  /* `sync()` is outside the simulation gate on purpose. It paints the HUD and,
     via `syncArmory`, the affordability of every armory row — and the armory is
     open exactly when the simulation is *not* running, since opening it pauses
     the wave. Leaving `sync` inside the gate meant the shop froze the moment it
     opened, so a row you could suddenly afford stayed greyed out until you
     bought something else. That is the "armory doesn't update" report, and the
     pause fix is what would have caused it. It is only DOM writes over engine
     state, so calling it while paused is idempotent. */
  sync();

  gfx.step(dt, 1.5);
  // barrels keep easing in and out even while paused or between waves, so the
  // board settles to a correct resting state rather than freezing mid-slide
  stepTowerArt(dt);
  for (let i = beams.length - 1; i >= 0; i--) { beams[i].life -= dt; if (beams[i].life <= 0) beams.splice(i, 1); }

  draw();
  requestAnimationFrame(frame);
}

/* ---------- ui sync ---------- */
function syncBest() {
  const b = best(GAME_ID);
  $('uiBest').textContent = b ? b.score : '—';
}
function sync() {
  $('uiWave').textContent = world.wave;
  $('uiScore').textContent = world.score;
  $('uiComponents').textContent = Math.floor(world.components);
  $('uiIntegrity').textContent = world.integrity;
  // how far this run got, for the cabinet's unlock gate — recorded live, so a
  // player who closes the tab mid-run still keeps the wave they reached
  recordProgress(GAME_ID, world.wave);
  // naming the route matters on a replay: the board genuinely changed, and
  // without a label that reads as a glitch rather than as a new map. Numbered
  // rather than lettered now that they run easiest to hardest — "3" says
  // where you are on that scale in a way "C" does not.
  $('uiRoute').textContent = (world.routeIndex + 1) + '/' + E.ROUTE_COUNT;
  syncPalette();
  syncPopup();
  syncArmory();
}

/* Re-price the armory in place while it is open.
 *
 * Reported as "the armory doesn't always update when enough components are
 * earned": it only re-rendered on a purchase, so a cell that became affordable
 * while you were looking at it stayed dead until you bought something else.
 * Pausing on open (see `openShop`) removes most of the ways that happens, but
 * not all of them — a sell refunds mid-view, and a resumed run can land here.
 *
 * Patches the disabled/broke state only, never `innerHTML`. `sync` runs every
 * frame, and rebuilding this table that often would swallow the taps aimed at
 * it — the same trap the tower popup documents. */
function syncArmory() {
  if (!shopOpen) return;
  $('shopComps').textContent = 'Components ' + Math.floor(world.components);
  for (const b of $('shopClasses').querySelectorAll('button[data-t]')) {
    const have = world.classUpgrades[b.dataset.t][b.dataset.k];
    const cost = E.classCost(b.dataset.t, b.dataset.k, have);
    const maxed = cost === null;
    const afford = !maxed && world.components >= cost;
    b.disabled = maxed || !afford;
    b.classList.toggle('broke', !afford);
    const px = b.querySelector('.px');
    if (px) px.textContent = maxed ? 'MAX' : String(cost);
  }
}

/* The popup outlives the taps made in it, so the level and XP it shows have to
   keep up as kills come in. Patch the two text nodes rather than re-rendering —
   sync() runs every frame, and rebuilding the DOM that often would eat the
   taps aimed at the buttons inside it. */
function syncPopup() {
  if (popupIndex < 0) return;
  const t = world.towers[popupIndex];
  if (!t) { closePopup(); return; }
  const lvl = Math.min(E.MAX_LEVEL, t.level || 1);
  const h = tsel.querySelector('h3'), xp = tsel.querySelector('.xp');
  if (h) h.textContent = `${E.TOWER_TYPES[t.type].name} · L${lvl}`;
  /* Patch the bar's width, not the container's text: writing textContent here
     would delete the bar markup renderPopup just built and leave the panel
     showing a bare number. */
  if (xp) {
    const fill = xp.querySelector('.xpbar i');
    if (lvl >= E.MAX_LEVEL) { if (fill) xp.textContent = 'Fully trained'; }
    else if (fill) {
      fill.style.width = Math.round(Math.min(1, t.xp / E.xpForNext(lvl)) * 100) + '%';
      const nxt = xp.querySelector('em');
      if (nxt) nxt.textContent = 'L' + (lvl + 1);
    }
  }
  // affordability of the move tracks live, the way the old upgrade button did:
  // a kill landing while the popup is open should light the button up
  const mv = tsel.querySelector('.move');
  if (mv) mv.disabled = world.components < E.moveCost(t);
}

/* ---------- draw ---------- */
const C = () => world.L.CELL;

/* Choke Point gets the glow and the extrusion but NOT the phosphor trails
   the other games use. A tower-defense puts many small moving objects on screen
   whose exact position and type you have to read at a glance — smearing them
   would fight the enemy trait cues directly, and those cues are the whole
   reason a mix of towers is needed. Clean frame, no fade. It also means static
   alphas here are literal, with none of the accumulation Feedline compensates
   for. */
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawGrid();
  drawPath();
  drawCore();
  // where a pending move may land, drawn under the towers so the marks read as
  // being on the board rather than floating over it
  if (moveIndex >= 0) drawMoveTargets();
  for (let i = 0; i < world.towers.length; i++) drawTower(world.towers[i]);
  for (const e of world.enemies) drawEnemy(e);
  drawBeams();
  gfx.draw(ctx);
  if (gfx.flash > 0) { ctx.fillStyle = `rgba(224,80,60,${gfx.flash * .3})`; ctx.fillRect(0, 0, W, H); }
  // range preview for the selected build type, under the pointer cell
  if (hoverCell) drawRangePreview();
  // range ring for whichever tower the popup is currently open on — the tap
  // flow (mobile) has no hover, so this is the only way to see it there
  if (popupIndex >= 0 && world.towers[popupIndex]) drawTowerRange(world.towers[popupIndex]);
  // and for a tower being relocated, so its reach can be judged against the
  // cell it is about to land on rather than after the fact
  if (moveIndex >= 0 && world.towers[moveIndex]) drawTowerRange(world.towers[moveIndex]);
}

/* Every cell a pending move would accept. Shown outright rather than left to be
   discovered by tapping: the rules (not the path, not occupied, and you can
   afford the fee) are cheap to satisfy but not obvious, and a tap that silently
   does nothing reads as the feature being broken. */
function drawMoveTargets() {
  const cell = C();
  const t = world.towers[moveIndex];
  if (!t) return;
  for (let r = 0; r < world.L.ROWS; r++) {
    for (let c = 0; c < world.L.COLS; c++) {
      if (!E.canMove(world, moveIndex, c, r)) continue;
      const x = c * cell, y = r * cell;
      const hot = hoverCell && hoverCell.c === c && hoverCell.r === r;
      ctx.fillStyle = hot ? 'rgba(95,201,164,.22)' : 'rgba(95,201,164,.08)';
      ctx.fillRect(x + 2, y + 2, cell - 4, cell - 4);
      ctx.strokeStyle = hot ? 'rgba(95,201,164,.85)' : 'rgba(95,201,164,.3)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 2.5, y + 2.5, cell - 5, cell - 5);
    }
  }
  // the tower being moved reads as lifted off the board
  const cx = (t.c + .5) * cell, cy = (t.r + .5) * cell;
  ctx.strokeStyle = 'rgba(224,168,156,.8)';
  ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.arc(cx, cy, cell * .40, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
}

function drawTowerRange(t) {
  const cx = (t.c + .5) * C(), cy = (t.r + .5) * C();
  ctx.strokeStyle = 'rgba(111,183,232,.6)';
  ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.arc(cx, cy, E.stats(world, t).range, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
}

function drawGrid() {
  const cell = C();
  ctx.strokeStyle = 'rgba(35,56,63,.5)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let c = 1; c < world.L.COLS; c++) { ctx.moveTo(c * cell + .5, 0); ctx.lineTo(c * cell + .5, H); }
  for (let r = 1; r < world.L.ROWS; r++) { ctx.moveTo(0, r * cell + .5); ctx.lineTo(W, r * cell + .5); }
  ctx.stroke();
  glowStroke(ctx, c => c.rect(1.5, 1.5, W - 3, H - 3), '#2b4d70', 1, GLOW_PASSES_CHEAP, .6);
}

/* The circuit itself: a dark trace with lit edges, so it reads as an etched
   channel the surges run along rather than as a painted stripe. Kept dim on
   purpose — it is the largest thing on the board and must not compete with the
   towers and enemies, which are what you actually look at. */
function drawPath() {
  const p = world.path;
  const trace = (c) => {
    c.moveTo(p[0].x, p[0].y);
    for (let i = 1; i < p.length; i++) c.lineTo(p[i].x, p[i].y);
  };
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // a wide additive band first — this becomes the lit fringe once the channel
  // is painted back over the middle of it. Widened and brightened from the
  // first pass: the borders should read as genuinely glowing, not just tinted.
  glowStroke(ctx, trace, '#4a8fd6', C() * .82, [[1, .32]]);
  /* ...and the channel itself painted NORMALLY on top. It has to be
     source-over: additive compositing cannot darken, so an earlier attempt to
     lay a dark inner stroke additively brightened the channel instead and left
     the path glowing like a lit ribbon — the largest, loudest thing on a board
     where it should be the quietest. Darker than before, so the center reads
     as genuinely black rather than dark blue. */
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = '#050a0d';
  ctx.lineWidth = C() * .6;
  ctx.beginPath(); trace(ctx); ctx.stroke();
  ctx.restore();
  // No dashed center line any more — the glowing borders alone read as a
  // channel, and the dashes fought the "even darker center" the border glow
  // is meant to set up.
}

function drawCore() {
  const e = world.path[world.path.length - 1];
  const pulse = reduce ? .6 : .45 + .35 * Math.abs(Math.sin(performance.now() / 400));
  // the thing you are defending, so it gets to be the hottest point on the board
  glowStroke(ctx, c => c.arc(e.x, e.y, C() * .48, 0, TAU), '#e0503c', 2, undefined, pulse);
  glowDot(ctx, e.x, e.y, C() * .24, '#e0503c');
  glowDot(ctx, e.x, e.y, C() * .10, '#ffd8ce');
}

/* Towers are exactly what `extrude` is for: discrete objects sitting on a dark
   board, where a dark body with a lit rim and a face offset behind reads as a
   solid installation bolted to the grid. (Contrast Feedline's head, where the
   same treatment punched a hole in a glowing tube.) */
/* How far each tower's barrel is deployed, 0..1, keyed by cell. Presentation
   state, so it lives here rather than on the world — the engine has no opinion
   about how long a barrel takes to slide out. */
const barrelOut = new Map();
const BARREL_SPEED = 5.2;          // full extension in a bit under a fifth of a second
/* How long a tower stays deployed after the last frame that had something in
   reach. Without it, a stream of enemies passing the edge of a tower's reach
   pumped the barrel in and out once per gap — reported as the tower "cycling
   between ready and unready when squares are right on its periphery".

   Two mechanisms, because either alone is not enough: this timer covers gaps in
   *time* (a target leaves, another is a second behind), and the engine's
   separate `READY_SLEEP_MARGIN` covers jitter in *space* (one target loitering
   exactly on the threshold). */
const READY_HOLD = 1.2;
const readyHold = new Map();       // cell key -> seconds of deployment left

function stepTowerArt(dt) {
  const live = new Set();
  for (const t of world.towers) {
    const key = t.c + ',' + t.r;
    live.add(key);

    /* Wake on the tight margin, sleep on the loose one: while already deployed
       we ask the easier question, so a target has to leave properly rather than
       merely wobble across one circle. */
    const held = readyHold.get(key) ?? 0;
    const near = E.towerReady(world, t, held > 0 ? E.READY_SLEEP_MARGIN : E.READY_MARGIN);
    const hold = near ? READY_HOLD : Math.max(0, held - dt);
    readyHold.set(key, hold);

    const want = hold > 0 ? 1 : 0;
    const now = barrelOut.get(key) ?? want;      // a tower built mid-fight starts settled
    const d = Math.sign(want - now) * BARREL_SPEED * dt;
    barrelOut.set(key, Math.abs(want - now) <= Math.abs(d) ? want : now + d);

    stepAim(t, key, dt);
  }
  // a sold tower must not leave its barrel behind for the next one built there
  for (const k of [...barrelOut.keys()]) if (!live.has(k)) {
    barrelOut.delete(k); readyHold.delete(k); aimAngle.delete(k);
  }
}

/* Where each tower's barrel is actually pointing. Presentation state, like the
   barrel extension — the engine has an opinion about what a tower *shoots*
   (`t.aim`), not about which way a drawing faces between shots. */
const aimAngle = new Map();
const TRAVERSE = 9;                // radians/sec the barrel can swing

/** The angle a tower should be facing, or null if there is nothing to face.
 *
 *  `t.aim` is only set for an enemy inside *firing* range, but the barrel is
 *  deployed on the looser ready reach plus a hold timer — so there is a real
 *  window where a tower is out and tracking nothing. It used to point straight
 *  up in that window, which is what "the turret doesn't point at the target"
 *  was: the nearest surge is right there and the gun is facing the ceiling.
 *  Now it tracks the closest enemy within the reach that woke it, and if even
 *  that is gone it simply holds its last bearing rather than snapping. */
function desiredAim(t, cx, cy) {
  if (t.aim && world.enemies.includes(t.aim)) {
    const p = E.enemyPos(world, t.aim);
    return Math.atan2(p.y - cy, p.x - cx);
  }
  const reach = E.stats(world, t).range + E.READY_SLEEP_MARGIN;
  let best = null, bd = Infinity;
  for (const e of world.enemies) {
    if (e.hp <= 0) continue;
    const p = E.enemyPos(world, e);
    const d = Math.hypot(p.x - cx, p.y - cy);
    if (d <= reach && d < bd) { bd = d; best = p; }
  }
  return best ? Math.atan2(best.y - cy, best.x - cx) : null;
}

function stepAim(t, key, dt) {
  const cell = C();
  const cx = (t.c + .5) * cell, cy = (t.r + .5) * cell;
  const want = desiredAim(t, cx, cy);
  if (want === null) return;                   // nothing to face: hold station
  const have = aimAngle.get(key);
  if (have === undefined) { aimAngle.set(key, want); return; }
  // swing the short way round, so crossing the -pi/pi seam doesn't spin it
  let d = ((want - have + Math.PI) % TAU + TAU) % TAU - Math.PI;
  const step = TRAVERSE * dt;
  aimAngle.set(key, Math.abs(d) <= step ? want : have + Math.sign(d) * step);
}

function drawTower(t) {
  const cell = C();
  const cx = (t.c + .5) * cell, cy = (t.r + .5) * cell;
  const col = E.TOWER_TYPES[t.type].col;
  const rr = cell * .32;
  const out = barrelOut.get(t.c + ',' + t.r) ?? 0;

  // The body is lifted well above the board color on purpose. At the default
  // near-black it vanished into the background and the tower read as a hollow
  // ring rather than as a solid object bolted to the grid.
  extrudeDisc(ctx, cx, cy, rr, col, {
    depth: Math.max(4, cell * .10), width: 2,
    body: 'rgba(24,44,56,.98)', back: 'rgba(13,26,34,.98)',
  });

  /* Idle, a tower is an empty ring — the extrudeDisc above and nothing else.
     As something comes within reach it fills a solid hub and slides its barrel
     out of it. So a glance at the board says which half of your defense is
     about to be doing the work, and a quiet stretch of route looks quiet
     instead of looking identical to a busy one. */
  if (out > 0.01) {
    /* The hub, emissive like everything else that is meant to read as powered.
       It used to be a flat `ctx.fill()` while the ring went through extrudeDisc
       and the barrel through glowStroke, so a deployed tower had a dead spot at
       its center. `glowDot` plus a small hot core is the same pairing `drawCore`
       uses — the established "this thing is lit" idiom in this file. */
    ctx.globalAlpha = out;
    glowDot(ctx, cx, cy, rr * .34 * out, col);
    if (!reduce) glowDot(ctx, cx, cy, rr * .15 * out, '#ffffff');
    ctx.globalAlpha = 1;

    // the barrel, on the bearing stepTowerArt has been easing toward
    const a = aimAngle.get(t.c + ',' + t.r) ?? -Math.PI / 2;
    // extends *from* the hub, so the movement reads as the barrel sliding out
    const from = rr * .3, to = from + (rr * 1.5 - from) * out;
    glowStroke(ctx, c => {
      c.moveTo(cx + Math.cos(a) * from, cy + Math.sin(a) * from);
      c.lineTo(cx + Math.cos(a) * to, cy + Math.sin(a) * to);
    }, col, 2.6, undefined, out);
  }

  /* Level pips, kept as hard little marks rather than glows — they are counted,
     not admired, and a halo would blur one into the next. Ten of them now, so
     they ring the base instead of sitting in a row: a row of ten at 6px would
     be wider than the cell. Unearned levels are drawn dim rather than omitted,
     so the gauge has a fixed size and you can see how far along it is. */
  const level = Math.min(E.MAX_LEVEL, t.level || 1);
  for (let i = 0; i < E.MAX_LEVEL; i++) {
    // start at the bottom and run clockwise, leaving the top clear for the barrel
    const a = Math.PI * 0.5 + (i / E.MAX_LEVEL) * TAU;
    const px = cx + Math.cos(a) * (rr + 5), py = cy + Math.sin(a) * (rr + 5);
    if (i < level) glowDot(ctx, px, py, 1.9, col);
    else { ctx.fillStyle = 'rgba(230,233,226,.16)'; ctx.beginPath(); ctx.arc(px, py, 1.3, 0, TAU); ctx.fill(); }
  }
}

function drawEnemy(e) {
  const p = E.enemyPos(world, e);
  const T = E.ENEMY_TYPES[e.type];
  const col = T.col;

  // A patch's reach, so "why is that one healing?" is answerable by looking.
  if (T.heals) {
    ctx.strokeStyle = 'rgba(95,201,164,.16)'; ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.arc(p.x, p.y, E.HEAL_RADIUS, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }

  /* Type color always wins, with `slow` laid over it as a translucent frost
     rather than replacing the fill. Replacing it used to repaint a slowed enemy
     in a flat blue that is almost exactly Shell's own color, so "held up" and
     "plated" were indistinguishable — and which of the two you're looking at
     changes what you should build. */
  /* A halo AROUND a full-strength body, never instead of one. Feedline's food
     shipped with a shrunken opaque core wrapped in haze and became genuinely
     hard to find; these are smaller, there are more of them, and they have to
     be told apart, so the solid disc stays exactly the size it was and only
     gains a glow outside it. */
  /* Invaders are cubes; defenders are spheres. That rule is the whole visual
     half of the setting, and it is absolute — no rounded corners, no
     compromise, because a board is only readable at a glance if the shape
     alone tells you which side something is on.
     These march in formation on the ground, so they do not tumble. */
  const s = e.r * 1.9;                       // a square of comparable visual mass
  const half = s / 2;
  const face = (c) => c.rect(p.x - half, p.y - half, s, s);

  /* `cube`, not `extrudeRect`. Both draw a front face and an offset back one,
     but only `cube` strokes the four edges joining them — which, per its own
     note in glow.js, is "what say 'solid', not 'two squares'". Its default
     depth is far deeper too (0.34× the size against extrudeRect's ~0.12), and
     between them that is the whole difference between reading flat and
     reading like a box. Center-origin, unlike extrudeRect's top-left.

     `rot` stays 0: these march in formation on the ground and must not tumble.

     Health is brightness. There is no hp bar any more — a damaged cube simply
     goes dark, which is legible at a glance on a board with thirty of them and
     costs no pixels above each one. */
  const lit = 0.3 + 0.7 * Math.max(0, e.hp / e.maxhp);
  cube(ctx, p.x, p.y, s, dim(col, lit), {
    width: 1.8,
    body: dim('rgba(24,44,56,.98)', lit),
    back: dim('rgba(13,26,34,.98)', lit),
  });
  if (e.slow > 0) {
    ctx.fillStyle = 'rgba(150,220,255,.5)';
    ctx.beginPath(); face(ctx); ctx.fill();
  }

  // a halted deployer is about to spill Swarm — the one moment a Tank is a
  // stationary target, so it has to be obvious it is happening
  if (e.stopFor > 0) {
    glowStroke(ctx, c => c.arc(p.x, p.y, half + 6, 0, TAU), '#ffd9a8', 2,
      GLOW_PASSES_CHEAP, Math.min(1, e.stopFor * 2));
  }

  // being mended, so damage visibly coming back is explained
  if (e.healed > 0) {
    ctx.strokeStyle = `rgba(95,201,164,${Math.min(1, e.healed * 5)})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x - half - 5, p.y - half - 5, s + 10, s + 10);
  }
}

/* The beams are where this style pays off most: a hitscan zap is a line of
   light, which is precisely what an emissive stroke is. A white-hot core inside
   the tower's own color sells it as discharge rather than as a drawn line. */
function drawBeams() {
  for (const b of beams) {
    const fade = Math.min(1, b.life * 12);
    const line = (c) => { c.moveTo(b.x1, b.y1); c.lineTo(b.x2, b.y2); };
    glowStroke(ctx, line, b.col, 2.4, undefined, fade);
    glowStroke(ctx, line, '#ffffff', 0.9, [[1, .85]], fade);
    // a flare where it lands, so a hit registers even when the target survives
    glowDot(ctx, b.x2, b.y2, 3, b.col, fade);
  }
}

let hoverCell = null;
cv.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const p = stagePt(e);
  hoverCell = E.cellAt(world.L, p.x, p.y);
});
cv.addEventListener('pointerleave', () => { hoverCell = null; });

function drawRangePreview() {
  if (!world.running) return;
  const { c, r } = hoverCell;
  const existing = E.towerAt(world, c, r);
  const range = existing ? E.stats(world, existing).range : E.stats(world, { type: selected, level: 1, xp: 0 }).range;
  const cx = (c + .5) * C(), cy = (r + .5) * C();
  const ok = existing || E.canBuild(world, c, r, selected);
  ctx.strokeStyle = ok ? 'rgba(111,183,232,.5)' : 'rgba(224,80,60,.4)';
  ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.arc(cx, cy, range, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
}

syncBest();
sync();
requestAnimationFrame(frame);
</script>
