   there is no room for at 40px.

   Redrawn at v49 from a design canvas, one gun at a time, and the geometry
   below is that canvas's, coordinate for coordinate — so a change should be
   drawn there (or on the bench) first and ported, not nudged here. Each gun
   keeps the mount it had, because the mount is read before the barrel:

     towed   outriggers on screw jacks    cannon, mortar
     bunker  sloped armoured casemate     autocannon
     deck    bolted plate and drum        railgun
     mound   a ball behind a low lip      ion cannon

   The ion's mound lost its back berm in the redraw — the ball sits behind the
   near lip only, which keeps "dug in" and stops it reading as a hill.

   Every defender is a sphere, so every gun pivots on one: a small lit ball at
   the trunnion, and for the ion a big armoured ball that *is* the mount. */

/* The drawing space is 420 wide, ground line at y=357, and was drawn 372 tall.
   The top of that is sky at every elevation the game uses, so the bitmap is
   cropped by PORTRAIT_CROP and the drawing shifted up to match — one
   coordinate space, less dead card. The crop leaves room for the bench's
   elevation slider to reach ~80° without clipping a muzzle. */
const PORTRAIT_W = 420, PORTRAIT_H = 312, PORTRAIT_CROP = 60;
const PORTRAIT_ANGLE = -1.05;

/** How many barrels the *portrait* draws, however many the mount has.
 *
 *  Two. Asked for at v45, and it is a drawing problem rather than a data one:
 *  the portrait is a side elevation, so flanking barrels stack vertically in
 *  it and a third one lands where the eye reads the gun's own silhouette —
 *  three parallel tubes at portrait scale is a bundle, not a gun. The board art
 *  draws every barrel a mount really has (`BARREL_OFFSETS` there is unclamped),
 *  which is where the count matters, because that is where the rounds come out.
 *  The card's text still says "3 barrels", so nothing is hidden — only undrawn.
 *
 *  The second barrel is drawn on the *upper* side of the main one, although
 *  the engine's offset is positive. Below, it would run through the cannon's
 *  recoil cylinder and the mortar's elevating screw; a side elevation has no
 *  "which side" a viewer can check, so the portrait takes the side that is
 *  clear. The board draws the real offsets. */
const PORTRAIT_MAX_BARRELS = 2;

/** Each gun's elevation relative to PORTRAIT_ANGLE. The railgun and the
 *  autocannon are flatter, direct-fire weapons; the mortar is steeper. The
 *  bench's slider moves PORTRAIT_ANGLE, so these keep their offsets from it. */
const PORTRAIT_RISE = { standard: 0, auto: 0.42, rail: 0.35, mortar: -0.38, ion: 0 };

/** The hot colour per gun: muzzles, bores, bolts and cores. A pale tint of the
 *  gun's own colour rather than white, so a lit point still says which gun. */
const GUN_HOT = {
  standard: '#f7e3a1', auto: '#d6f0a8', rail: '#d2ecfb', mortar: '#ffc0a8', ion: '#e3d2ff',
};

/** The handful of drawing verbs the portraits are written in. Each solid part
 *  is a dark fill with a glowing rim, painted in order, so a later part hides
 *  an earlier one's glow the way it would hide the part itself. */
function portraitKit(g, col, hot) {
  const BODY = '#182c38', BACK = '#0d1a22', FAR = '#132430', HOLE = '#050b0d';
  let rot = 0;                              // how far the current frame is turned
  const trace = (c, pts) => {
    pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y));
    c.closePath();
  };
  // arcTo rather than roundRect, which node-canvas (the render tests) lacks
  const rrect = (c, x, y, w, h, r) => {
    if (!r) { c.rect(x, y, w, h); return; }
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r);
    c.closePath();
  };
  const solid = (path, fill, w, a) => {
    g.beginPath(); path(g); g.fillStyle = fill; g.fill();
    glowStroke(g, path, col, w, undefined, a);
  };
  const K = {
    poly: (pts) => solid(c => trace(c, pts), BODY, 2, 1),
    back: (pts) => solid(c => trace(c, pts), BACK, 1.2, 0.35),
    hole: (pts) => solid(c => trace(c, pts), HOLE, 1, 0.6),
    rect: (x, y, w, h, r = 0) => solid(c => rrect(c, x, y, w, h, r), BODY, 2, 1),
    rectBack: (x, y, w, h, r = 0) => solid(c => rrect(c, x, y, w, h, r), BACK, 1.2, 0.35),
    // the far side of a cluster: dimmer fill and rim, so it sits behind
    rectFar: (x, y, w, h, r = 0) => solid(c => rrect(c, x, y, w, h, r), FAR, 1.6, 0.6),
    ell: (cx, cy, rx, ry) => solid(c => c.ellipse(cx, cy, rx, ry, 0, 0, TAU), BODY, 2, 1),
    shape: (path, fill = BODY, w = 2) => solid(path, fill, w, 1),
    line: (x1, y1, x2, y2, w = 1.6, a = 1) =>
      glowStroke(g, c => { c.moveTo(x1, y1); c.lineTo(x2, y2); }, col, w, undefined, a),
    faint: (x1, y1, x2, y2) => K.line(x1, y1, x2, y2, 1.1, 0.55),
    ring: (cx, cy, rx, ry) =>
      glowStroke(g, c => c.ellipse(cx, cy, rx, ry, 0, 0, TAU), col, 1.1, undefined, 0.55),
    /** A wide soft band — a belt, a cable — rather than an edge. */
    band: (path, w, a) => glowStroke(g, path, col, w, [[1.6, 0.1], [1, a]]),
    ink: (x, y, w, h) => { g.fillStyle = HOLE; g.fillRect(x, y, w, h); },
    spark: (x, y, r) => glowDot(g, x, y, r, hot),
    sparkEll: (cx, cy, rx, ry) => {
      g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = hot;
      for (const [m, a] of [[1.8, 0.18], [1, 1]]) {
        g.globalAlpha = a;
        g.beginPath(); g.ellipse(cx, cy, rx * m, ry * (1 + (m - 1) * 0.4), 0, 0, TAU); g.fill();
      }
      g.restore();
    },
    hotLine: (path, w = 1.6, a = 0.75) => glowStroke(g, path, hot, w, undefined, a),
    dashed: (path, w, a, dash) => {
      g.save(); g.globalCompositeOperation = 'lighter'; g.setLineDash(dash);
      g.strokeStyle = hot; g.globalAlpha = a; g.lineWidth = w;
      g.beginPath(); path(g); g.stroke();
      g.restore();
    },
    ground: () => K.line(14, 357, 406, 357, 1.6, 0.45),
    /** A defender's sphere: lit from the upper left, whatever frame it is
     *  drawn in — the highlight is counter-rotated so it never swings round
     *  with the barrel. */
    sphere: (cx, cy, r, w = 2.2) => {
      const grad = g.createRadialGradient(cx - r * 0.26, cy - r * 0.32, 0, cx, cy, r * 1.15);
      grad.addColorStop(0, '#3a5d70'); grad.addColorStop(1, BACK);
      solid(c => c.arc(cx, cy, r, 0, TAU), grad, w, 1);
      K.hotLine(c => c.arc(cx, cy, r * 0.74, 3.40 - rot, 4.49 - rot), r > 20 ? 1.8 : 1.6);
    },
    /** Draw `fn` in a frame at (x, y) turned by `ang` — the barrel's frame. */
    at: (x, y, ang, fn) => {
      g.save(); g.translate(x, y); g.rotate(ang);
      const was = rot; rot += ang; fn(); rot = was;
      g.restore();
    },
    /** A point given in a turned frame, brought back out into this one. */
    from: (x, y, ang, lx, ly) =>
      [x + Math.cos(ang) * lx - Math.sin(ang) * ly, y + Math.sin(ang) * lx + Math.cos(ang) * ly],
    /** A straight member from one point to another, `half` either side. */
    strut: (x0, y0, x1, y1, half) => {
      const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
      const nx = -dy / L * half, ny = dx / L * half;
      K.poly([[x0 + nx, y0 + ny], [x1 + nx, y1 + ny], [x1 - nx, y1 - ny], [x0 - nx, y0 - ny]]);
      return { dx, dy, nx, ny };
    },
  };
  return K;
}

/** The field carriage the cannon and the mortar share: a cross of outriggers

        c.moveTo(-6, -15); c.lineTo(-6, 15);
        c.bezierCurveTo(-26, 15, -26, -15, -6, -15); c.closePath();
      });
      K.poly([[-6, -15], [104, -13.5], [104, 13.5], [-6, 15]]);
      K.line(22, -14.5, 22, 14.5); K.line(58, -14, 58, 14);
      if (twin) { K.rect(10, -38, 10, 24, 1.5); K.rect(48, -37, 8, 23, 1.5); }
      K.rect(100, -17, 12, 34, 2);
      K.sparkEll(112, 0, 2, 10);
    });
    // the screw jack, from the carriage up to the tube's underside
    const [tx, ty] = K.from(132, 304, elev, 52, 15);
    const s = K.strut(158, 322, tx, ty, 3);
    for (const t of [0.33, 0.45, 0.57, 0.69]) {
      const x = 158 + s.dx * t, y = 322 + s.dy * t;
      K.faint(x + s.nx * 1.7, y + s.ny * 1.7, x - s.nx * 1.7, y - s.ny * 1.7);
    }
    const hx = 158 + s.dx * 0.39, hy = 322 + s.dy * 0.39;
    K.line(hx + 2, hy, hx + 8, hy);
    K.shape(c => c.arc(hx + 14, hy, 6, 0, TAU));
    K.spark(tx, ty, 2.4);
    K.sphere(132, 304, 15);
    K.spark(132, 304, 2.6);
  },

  /* A big armoured ball behind a low earth lip, and out of it a stack of
     skirted insulator discs ending in a second, smaller sphere that sparks.
     The ball is the mount: seam band, a window onto the core, a sight pod on
     top. Nothing here is a tube, which is the point — the ion cannon works on
     a different principle, and should look like it. */
  ion(K, elev, twin) {
    K.ground();
    K.at(132, 306, elev, () => {
      if (twin) {
        K.rect(26, -36, 12, 24, 1.5);
        K.rect(38, -33, 100, 6);
        for (let i = 0; i < 9; i++) K.ell(46 + i * 10, -30, 2.6, i % 2 ? 7 : 9);
        K.sphere(146, -30, 12);
        K.spark(146, -30, 3.5);
      }
      K.rect(36, -5, 142, 10);
      for (let i = 0; i < 11; i++) K.ell(44 + i * 12, 0, 3.5, i % 2 ? 11 : 14);
      K.sphere(196, 0, 18);
      K.spark(196, 0, 5);
      K.hotLine(c => {
        c.moveTo(214, -4); c.lineTo(224, 2); c.lineTo(232, -3); c.lineTo(242, 3);
        c.moveTo(210, 12); c.lineTo(218, 18); c.lineTo(222, 14);
      }, 1.6, 1);
    });
    K.sphere(132, 306, 34, 2.4);
    K.at(132, 306, elev, () => {
      K.ring(-4, 0, 9, 33.5);
      K.shape(c => c.arc(-4, 14, 10, 0, TAU), '#050b0d', 1.4);
      K.spark(-4, 14, 5.5);
      K.rect(26, -14, 14, 28, 2);
      K.line(6, -33, 6, -36);
      K.rect(-8, -46, 28, 11, 2);
      K.spark(20, -40.5, 2.4);
    });
    // the near lip, last, so the ball sits behind it rather than on the ground
    K.shape(c => {
      c.moveTo(16, 363); c.bezierCurveTo(44, 358, 64, 334, 104, 330);
      c.lineTo(162, 330); c.bezierCurveTo(202, 334, 224, 358, 252, 363); c.closePath();
    });
    K.faint(60, 352, 72, 346); K.faint(92, 342, 104, 339); K.faint(196, 348, 206, 354);
  },
};

function drawCannonPortrait(g, type, barrels = 1) {
  barrels = Math.min(barrels, PORTRAIT_MAX_BARRELS);
  const t = PORTRAIT_ART[type] ? type : 'standard';
  g.clearRect(0, 0, PORTRAIT_W, PORTRAIT_H);
  g.save();
  g.translate(0, -PORTRAIT_CROP);
  const K = portraitKit(g, E.GUN_TYPES[t].col, GUN_HOT[t]);
  PORTRAIT_ART[t](K, PORTRAIT_ANGLE + PORTRAIT_RISE[t], barrels > 1);
  g.restore();
}

/* Say what the gun does to the board, and name the enemy it answers.

   The lines live on `GUN_TYPES` since v44, so the shop and the briefing page
   quote the same sentence. They were a switch here, and two of them described
   the v24 design for two builds after the behaviour moved: ion used to resist
   hardened hulls and now bypasses shielded plating instead, and the railgun is
   what actually beats a hardened hull, via `railBonus`. */
function gunBlurb(type) {
  const G = E.GUN_TYPES[type];
  return G?.blurb || G?.name || type;
}

function openShop() {
  /* The shop opens on a wave clear *and* on a breach now. Those are very
     different moments — one is a reward, the other is a second chance — so it
     says which, and the button says what leaving it will actually do. Without
     that, losing a life and landing in a shop titled "Refit / Next Wave" reads
     as the game having skipped the wave you just lost. */
  /* "Refit" named two different things — this panel, and the gun-type swap
     inside it. The panel is where you spend scrap on the gun you have; Refit is
     where you change which gun it is. */
  $('shopHead').querySelector('h2').textContent = 'Upgrade';
  $('shopGo').textContent = 'Next Wave';
  /* Always opens on mount 1, never on whatever tab was left showing.

     Remembering the last view sounds helpful and is not: the tab you were on
     when you closed the shop three waves ago is rarely the one you want now,
     and worse, it is *invisible* — you tap Refit and land somewhere without
     having chosen it, on a screen whose whole job is telling you which gun you
     are spending on. A fixed starting point is one you can navigate from. */
  shopTab = OVERVIEW;
  researchScreen = false;
  // firing must not survive into the shop, or the first frame back is a volley
  firing = false; drag = null;
  $('shop').classList.add('on');
  renderShop();
}

/** The shop as the between-runs screen: research is the only thing a finished
 *  run leaves you, so that is what a fresh start opens on. Landing on mount 1's
 *  upgrade tabs after losing everything shows a bare gun and no money. */
function openResearch() {
  $('shopHead').querySelector('h2').textContent = 'Research';
  $('shopGo').textContent = 'Begin';
  shopTab = RESEARCH;
  researchScreen = true;
  firing = false; drag = null;
  $('shop').classList.add('on');
  renderShop();
}
/* Toggles rather than navigates: the button that took you into research is the
   one that takes you back out, so research is never a place you have to find
   your way out of by remembering which tab you came from. */
$('shopResearch').addEventListener('click', () => {
  shopTab = shopTab === RESEARCH ? OVERVIEW : RESEARCH;
  renderShop();
});

$('shopGo').addEventListener('click', () => {
  $('shop').classList.remove('on');
  /* Two screens share this button. Between waves it advances the wave; on the
     research screen a fresh run has not started one yet, and calling nextWave
     there would skip wave 1 before it was ever played. */
  if (!researchScreen) E.nextWave(world);
  researchScreen = false;
  world.running = true;
  started = true;
  firing = false; drag = null;
  sync();
});

/* ---------- perspective ----------

   The board is a column descending toward you: the top of the screen is far
   away, the breach line is at your feet. Nothing in the art said so — a craft
   at the top was drawn exactly like one about to breach, so the board read as
   flat and the descent read as sliding rather than approaching.

   One function does it, and everything that sits *on the ground plane* reads
   depth from it: craft, the road, the tether. Shots and the battery do not —
   they are near-field and yours, and scaling them would make an upgraded round
   look weaker at range, which is a lie about a stat.

   Deliberately gentle. This is a top-down game with a real collision model, and
   `seg.r` is untouched: a craft that draws 12% smaller at the top must still be
   hit by a round that passes through the same pixels. Anything stronger and the
   drawing stops matching the hitbox in a way players feel as unfairness. */
const PERSPECTIVE = 0.22;          // total size falloff from the floor to the top

/** 0 at the horizon (top of board), 1 at the breach line. */
function depthAt(y) {
  const floor = world.L.FLOOR || world.L.H;
  return Math.max(0, Math.min(1, y / floor));
}

/** Draw scale for something standing on the ground at screen height `y`. */
function perspScale(y) {
  return 1 - PERSPECTIVE * (1 - depthAt(y));
}

/* ---------- the swarm shield ----------

   From wave 50 the column arrives inside a cloud of small squares flying
   figure-eights over it (see `stepSwarm` in the engine). They are drawn last,
   over the column, because that is where they are — the whole point of the
   escort is that it is between your rounds and the chain.

   Cubes, small ones. The board's one absolute is that invaders are cubes and
   defenders are spheres, and shape is what keeps a busy board readable — a
   cloud of two dozen motes over a column of forty craft is exactly the moment
   that rule is earning its keep. They are drawn at a fraction of a segment's
   size and in one pale colour of their own, so "escort" and "column" never
   have to be told apart by counting. */
function drawSwarm() {
  const swarm = world.swarm;
  if (!swarm || !swarm.length) return;

  /* Cheap on purpose, and measured: at v45 the escort is up to 104 motes, and
     drawing each one as a full `cube()` — two fills and three glow strokes,
     eight passes in all — cost 10.9ms a frame in the harness, more than the
     entire rest of the board. A mote is five pixels across; the extrusion and
     the joining edges it was paying for are invisible at that size.

     So: one dark fill for the body, one cheap two-pass glow for the outline.
     Still a square, still the escort's own colour, still darkening as it takes
     damage — the three things that carry meaning, which is the same trade
     Choke Point's crowd mode makes and for the same reason. */
  ctx.save();
  for (const m of swarm) {
    if (m.off) continue;
    const size = E.SWARM_R * 2.1 * perspScale(m.y);
    const half = size / 2;
    /* Health as brightness, the language the rest of the board speaks: a mote
       that has taken a round goes dark rather than growing a bar over it. */
    const lit = m.maxhp > 1 ? 0.45 + 0.55 * Math.max(0, m.hp / m.maxhp) : 1;
    const col = m.flash > 0 ? '#ffffff' : dim(E.SWARM_COL, lit);
    ctx.fillStyle = 'rgba(22,26,44,.92)';
    ctx.fillRect(m.x - half, m.y - half, size, size);
    glowStroke(ctx, c => c.rect(m.x - half, m.y - half, size, size),
      col, 1.1, GLOW_PASSES_CHEAP, m.flash > 0 ? 1 : 0.85);
  }
  ctx.restore();
}

/* ---------- segment rendering ---------- */

// a rounded rect path, centerd on origin
function roundRectPath(w, h, r) {
  const x = -w / 2, y = -h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// lighten/darken a hex color by a signed amount
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return `rgb(${r},${g},${b})`;
}

// draw one segment as an oriented, lit plate. `idx` gives each plate a slight
// size cadence so a run of them reads as overlapping armor.
function drawSegment(seg, sp, heading, idx, bodyLeft = 0) {
  const K = E.KIND[seg.kind];
  const dmgT = 1 - seg.hp / seg.maxhp;
  const ang = Math.atan2(heading.y, heading.x);
  const now = performance.now();

  // plate dimensions: longer than the spacing so consecutive plates overlap
  // into a continuous armored body, and clearly longer than wide so each
  // points forward
  /* Square, and square on purpose: the invaders are cubes and the defenders are
     spheres, everywhere, without exception. These were elongated plates, which
     read as a single armored body — but the fiction is a column of individual
     craft, and a chain of cubes says that better as well as matching the other
     games. Kept slightly long so the direction of travel still reads. */
  /* Square, and sized to sit *inside* `SEGMENT_SPACING` (42) so consecutive
     craft don't touch. The previous 2.8×2.4 was wider than the old 30px
     spacing, so a chain fused into one continuous fence and the individual
     craft were invisible — bigger squares only read as bigger if there is a
     gap between them, which is why the engine's spacing went up alongside.
     Draw-size only: `seg.r` is the collision radius and is untouched. */
  /* Scaled by depth: a craft at the top of the board is further away. Draw-size
     only — `seg.r` is the collision radius and is deliberately untouched. */
  const persp = perspScale(sp.y);
  const long = seg.r * 2.7 * persp, wide = seg.r * 2.7 * persp;
  const corner = 0;

  ctx.save();
  ctx.translate(sp.x, sp.y);
  ctx.rotate(ang);

  const base = seg.flash > 0 ? '#ffffff' : K.col;

  /* A dark body with a lit rim, not a gradient-filled plate. Each craft in the
     column reads as a cube with its running lights on, which is what the other
     three games do and what the setting asks for.

     Damage is now the *only* health readout — the hp number that used to sit
     on tough segments is gone — so the dim has to carry it alone and reaches
     much further down than it used to (0.25 at death, not 0.45). It applies
     to the body and the hairline rim too, both of which were previously
     damage-independent and kept a dying craft looking half-lit. */
  const lit = 0.25 + 0.75 * (seg.hp / seg.maxhp);

  /* A second, darker face offset behind the front one, *and* the four edges
     joining the two — this is hand-rolled rather than using the shared
     `cube()` because these are oblong (long ≠ wide) and already inside a
     rotated frame, but the joining edges are exactly what cube() draws and
     what this was missing. Without them two offset rectangles read as two
     rectangles; with them the thing reads as a box. */
  const depth = Math.max(2, wide * 0.28);
  const dx = depth * 0.55, dy = depth;
  const hx = long / 2, hy = wide / 2;

  /* Both faces are lifted well above the board color, exactly as Choke
     Point's towers are: at a near-black fill the body vanished into the
     background and the craft read as a hollow outline rather than a solid
     object. The back face stays darker than the front so the offset reads
     as depth rather than as a second, equal square. */
  ctx.save();
  ctx.translate(dx, dy);
  roundRectPath(long, wide, corner);
  ctx.fillStyle = dim('rgba(13,26,34,.98)', lit);
  ctx.fill();
  ctx.restore();
  glowStroke(ctx, () => { ctx.translate(dx, dy); roundRectPath(long, wide, corner); ctx.translate(-dx, -dy); },
    base, 1, [[4, 0.05], [2, 0.10]], lit);

  // the joining edges: the silhouette corners linked front face to back
  glowStroke(ctx, (c) => {
    for (const [px, py] of [[hx, -hy], [hx, hy], [-hx, hy]]) {
      c.moveTo(px, py); c.lineTo(px + dx, py + dy);
    }
  }, base, 1, [[3, 0.07], [1.2, 0.18]], lit);

  roundRectPath(long, wide, corner);
  ctx.fillStyle = dim('rgba(24,44,56,.98)', lit);
  ctx.fill();

  if (seg.flash > 0) {
    glowStroke(ctx, () => roundRectPath(long, wide, corner), '#ffffff', 2.4,
      GLOW_PASSES_CHEAP, Math.min(1, seg.flash * 8));
  }
  glowStroke(ctx, () => roundRectPath(long, wide, corner), base, 1.8,
    GLOW_PASSES_CHEAP, lit);

  // outer rim, dimmed with everything else
  roundRectPath(long, wide, corner);
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = dim(K.ring, lit);
  ctx.stroke();

  // --- per-type material detail ---
  drawSegmentDetail(seg, K, long, wide, dmgT, now);

  // damage: hairline cracks that deepen as HP drops
  if (dmgT > 0.35 && seg.flash <= 0) {
    ctx.strokeStyle = `rgba(255,180,150,${Math.min(0.7, dmgT)})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-long * 0.15, -wide * 0.3);
    ctx.lineTo(long * 0.05, wide * 0.1);
    ctx.lineTo(-long * 0.1, wide * 0.35);
    ctx.stroke();
  }

  ctx.restore();

  // The head's body-armor, made visible. Without this the mechanic is a
  // mystery: shots land on the head and simply do nothing, with no hint that
  // the body behind it is the reason. The ring tightens and fades as the body
  // is cleared, so "keep chewing and the head opens up" is readable at a glance.
  if (seg.kind === 'head' && bodyLeft > 0) {
    const prot = 1 - E.headDamageFactor(bodyLeft);      // 0 = exposed, →1 = sealed
    const hit = seg.deflect > 0;
    const pulse = reduce ? 0 : Math.sin(performance.now() / 260) * 1.6;
    const rr = seg.r * 1.55 + (1 - prot) * 6 + pulse;
    const col = hit ? '#ffffff' : '#c9a227';
    const lw = hit ? 2.6 : 1 + prot * 1.6;
    const alpha = hit ? 1 : 0.35 + prot * 0.6;
    // four corner brackets, not a full halo — an armor-plating cue on the
    // command ship rather than a target reticle drawn around a "head"
    const half = Math.PI / 5;
    for (const a of [0, Math.PI / 2, Math.PI, Math.PI * 1.5]) {
      glowStroke(ctx, c => c.arc(sp.x, sp.y, rr, a - half, a + half), col, lw, GLOW_PASSES_CHEAP, alpha);
    }
  }

  /* The hp number that used to sit on tough segments is gone. It was a
     readable number on a board where you are aiming, not reading — and with
     the chain now up to 72 craft long it was 72 little numbers competing with
     the thing you actually track. Health is brightness instead (see `lit`
     above), which is the same cue Choke Point's enemies use. */
}

// surface treatment specific to each segment type, drawn in the plate's
// local rotated frame (long axis = x)
function drawSegmentDetail(seg, K, long, wide, dmgT, now) {
  if (seg.kind === 'head') {
    /* A command ship, not a face. The previous version drew a center ridge
       and two pale discs with red pupils near the leading edge — which is a
       nose and two eyes, and read as a head no matter what the fiction said.
       Nothing here is bilaterally paired across the center line any more:
       the structure is a hull spine with an *offset* bridge block and
       stepped deck plating, which reads as a vessel seen from above. */
    const fwd = long * 0.5, half = wide * 0.5;

    // spine down the long axis, stopping short of the bow
    ctx.strokeStyle = shade(K.col, 50);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-fwd * 0.66, 0); ctx.lineTo(fwd * 0.62, 0);
    ctx.stroke();

    // deck plating: ribs across the spine, tapering toward the bow
    ctx.lineWidth = 1;
    ctx.strokeStyle = shade(K.col, 25);
    for (const [x, k] of [[-fwd * 0.42, 0.74], [-fwd * 0.12, 0.60], [fwd * 0.2, 0.42]]) {
      ctx.beginPath();
      ctx.moveTo(x, -half * k); ctx.lineTo(x, half * k);
      ctx.stroke();
    }

    // bridge: a raised block set off-center, so the silhouette is asymmetric
    ctx.fillStyle = shade(K.col, 60);
    roundRectPathAt(-fwd * 0.28, -half * 0.34, long * 0.2, wide * 0.26, 1);
    ctx.fill();

    // a single mast light at the bow — one, deliberately, since two would
    // pair back up into eyes
    ctx.fillStyle = 'rgba(224,80,60,.95)';
    ctx.beginPath(); ctx.arc(fwd * 0.72, 0, 1.9, 0, TAU); ctx.fill();
    return;
  }

  if (K.shield) {
    // a raised plate across the leading face (the +x edge is the front)
    ctx.save();
    ctx.fillStyle = seg.deflect > 0 ? '#ffffff' : shade(K.col, 40);
    roundRectPathAt(long * 0.32, 0, long * 0.34, wide * 0.94, 3);
    ctx.fill();
    ctx.strokeStyle = seg.deflect > 0 ? '#ffffff' : '#bcd8f0';
    ctx.lineWidth = 1.5; ctx.stroke();
    // rivets
    ctx.fillStyle = 'rgba(11,26,34,.9)';
    for (const yy of [-wide * 0.28, wide * 0.28]) {
      ctx.beginPath(); ctx.arc(long * 0.32, yy, 1.2, 0, TAU); ctx.fill();
    }
    ctx.restore();
    return;
  }

  if (seg.kind === 'volatile') {
    // a glowing pressure cell in the middle
    const pulse = 0.55 + 0.45 * Math.sin(now / 150);
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, wide * 0.5);
    g.addColorStop(0, `rgba(255,180,120,${pulse})`);
    g.addColorStop(1, 'rgba(224,80,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, wide * 0.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(255,150,90,${0.4 + pulse * 0.4})`;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, 0, wide * 0.28, 0, TAU); ctx.stroke();
    return;
  }

  if (seg.kind === 'armored') {
    // brushed-steel ribs along the length
    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.lineWidth = 1;
    for (const xx of [-long * 0.22, 0, long * 0.22]) {
      ctx.beginPath();
      ctx.moveTo(xx, -wide * 0.34); ctx.lineTo(xx, wide * 0.34);
      ctx.stroke();
    }
    return;
  }

  if (K.regen && seg.hp < seg.maxhp) {
    const pulse = 0.3 + 0.3 * Math.sin(now / 180);
    ctx.strokeStyle = `rgba(180,120,220,${pulse})`;
    ctx.lineWidth = 2;
    roundRectPath(long + 5, wide + 5, 5);
    ctx.stroke();
    return;
  }

  if (K.railBonus) {
    // a reinforcing lattice over the whole plate, not one face — unlike
    // `shielded`'s directional plate, this reads as "armored all around"
    // rather than "block this side"
    ctx.strokeStyle = 'rgba(150,235,255,.55)';
    ctx.lineWidth = 1;
    for (const xx of [-long * 0.22, 0, long * 0.22]) {
      ctx.beginPath();
      ctx.moveTo(xx, -wide * 0.36); ctx.lineTo(xx, wide * 0.36);
      ctx.stroke();
    }
    for (const yy of [-wide * 0.22, wide * 0.22]) {
      ctx.beginPath();
      ctx.moveTo(-long * 0.34, yy); ctx.lineTo(long * 0.34, yy);
      ctx.stroke();
    }
    return;
  }

  if (K.splits) {
    // hinge seam across the short axis, pulsing
    const pulse = 0.55 + 0.45 * Math.sin(now / 200);
    ctx.strokeStyle = `rgba(255,217,168,${pulse})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -wide * 0.4); ctx.lineTo(0, wide * 0.4);
    ctx.stroke();
    // interlock teeth
    ctx.fillStyle = `rgba(255,217,168,${pulse})`;
    for (const yy of [-wide * 0.2, wide * 0.2]) {
      ctx.beginPath(); ctx.arc(0, yy, 1.6, 0, TAU); ctx.fill();
    }
    return;
  }

  if (K.carries) {
    // a small chevron marking cargo
    ctx.strokeStyle = 'rgba(90,70,30,.7)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-long * 0.12, -wide * 0.18);
    ctx.lineTo(long * 0.12, 0);
    ctx.lineTo(-long * 0.12, wide * 0.18);
    ctx.stroke();
    return;
  }
}

// rounded rect at an offset (for sub-plates like the shield face)
function roundRectPathAt(cx, cy, w, h, r) {
  const x = cx - w / 2, y = cy - h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- render ---------- */
function draw() {
  ctx.clearRect(0, 0, W, H);
  const { path, pathLen, L } = world;

  /* Screen shake: translate *and* rotate everything, restored at the end of
     the frame. Pure translation reads as a glitch — a few tenths of a degree
     is what makes it read as force. The rotation is about the board's centre
     rather than the origin, or the corners would swing far more than the
     middle and the whole board would appear to slide.

     `prefs.shake` scales it: reduced-motion still zeroes it outright, and the
     preference only narrows from there. */
  ctx.save();
  const shakeAmt = reduce ? 0 : world.shake * prefs.shake;
  if (shakeAmt > 0) {
    const m = shakeAmt * 9;
    ctx.translate((Math.random() - .5) * m, (Math.random() - .5) * m);
    ctx.translate(W / 2, H / 2);
    ctx.rotate((Math.random() - .5) * shakeAmt * 0.006);   // ≈0.17° at full shake
    ctx.translate(-W / 2, -H / 2);
  }

  /* The road, drawn leg by leg so it can *taper*: a constant-width band is the
     single loudest thing telling you the board is flat. Each leg is stroked at
     the width its own depth calls for, which is why this is a loop rather than
     one path. */
  /* The road as one filled ribbon that narrows with distance.

     Stroking it was the obvious approach and it failed twice. One stroke per
     leg leaves a step at every corner where two widths meet; subdividing into
     short overlapping strokes fixes the step and introduces a worse artefact,
     because translucent round caps *accumulate alpha* where they overlap and
     the road comes out beaded like a string of pearls. A single fill blends
     once, so it does neither. */
  {
    const half = (y) => 17 * perspScale(y);
    const left = [], right = [];
    for (let i = 1; i < path.length; i++) {
      const a = path[i - 1], b = path[i];
      const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const nx = -(b.y - a.y) / len, ny = (b.x - a.x) / len;   // unit normal
      const steps = Math.max(1, Math.ceil(len / 18));
      for (let k = (i === 1 ? 0 : 1); k <= steps; k++) {
        const t = k / steps;
        const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
        const h = half(y);
        left.push({ x: x + nx * h, y: y + ny * h });
        right.push({ x: x - nx * h, y: y - ny * h });
      }
    }
    // near end brighter than far: atmosphere, on top of the narrowing
    const grad = ctx.createLinearGradient(0, 0, 0, world.L.FLOOR || H);
    grad.addColorStop(0, 'rgba(63,174,143,.055)');
    grad.addColorStop(1, 'rgba(63,174,143,.12)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    left.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
    ctx.closePath();
    ctx.fill();
  }

  ctx.strokeStyle = 'rgba(224,80,60,.5)'; ctx.lineWidth = 1; ctx.setLineDash([7, 7]);
  ctx.beginPath(); ctx.moveTo(0, L.FLOOR); ctx.lineTo(W, L.FLOOR); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(224,80,60,.45)'; ctx.font = '9px "Chivo Mono",monospace';
  ctx.fillText('BREACH LINE', 12, L.FLOOR - 7);

  // A dark tether under the craft, so a chain reads as one linked formation
  // rather than loose tokens. Deliberately narrower than a craft now that
  // they no longer touch: it should look like something they are strung on,
  // not like a band they are embedded in.
  for (const ch of world.chains) {
    if (ch.segs.length < 2) continue;
    // segment by segment, so the tether narrows with the craft it strings
    ctx.strokeStyle = 'rgba(8,15,18,.85)';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    let prev = null;
    for (let i = 0; i < ch.segs.length; i++) {
      const sp = E.segPos(path, pathLen, ch, i);
      if (sp.off) { prev = null; continue; }
      if (prev) {
        ctx.lineWidth = 14 * perspScale((prev.y + sp.y) / 2);
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y); ctx.lineTo(sp.x, sp.y);
        ctx.stroke();
      }
      prev = sp;
    }
  }

  for (const ch of world.chains) {
    for (let i = ch.segs.length - 1; i >= 0; i--) {
      const seg = ch.segs[i], sp = E.segPos(path, pathLen, ch, i);
      if (sp.off) continue;
      const heading = E.segHeading(path, pathLen, ch, i);
      drawSegment(seg, sp, heading, i, ch.segs.length - 1);
    }
    if (ch.recoil > 0 && ch.segs.length) {
      const hp = E.segPos(path, pathLen, ch, 0);
      if (!hp.off) {
        ctx.strokeStyle = 'rgba(201,162,39,.55)'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(hp.x, hp.y, 22 + (reduce ? 0 : Math.sin(performance.now() / 120) * 3), 0, TAU);
        ctx.stroke();
      }
    }
  }

  drawSwarm();

  // thumb rest: the band below the cannon. Marked out so it reads as a place
  // to hold rather than dead space, and kept dim so it never pulls the eye.
  if (world.L.THUMB > 0) {
    const top = H - world.L.THUMB;
    const g = ctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, 'rgba(11,20,24,0)');
    g.addColorStop(1, 'rgba(11,20,24,.55)');
    ctx.fillStyle = g;
    ctx.fillRect(0, top, W, world.L.THUMB);

    ctx.strokeStyle = 'rgba(99,121,127,.22)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(W, top); ctx.stroke();

    ctx.fillStyle = 'rgba(99,121,127,.5)';
    ctx.font = '10px "Chivo Mono",monospace';
    ctx.textAlign = 'center';
    ctx.fillText('HOLD & DRAG HERE', W / 2, top + 26);
    ctx.textAlign = 'left';
  }

  // catch band: the arc above the cannon where a falling pickup is claimed
  if (world.pickups.length) {
    ctx.strokeStyle = 'rgba(201,162,39,.28)';
    ctx.setLineDash([2, 6]); ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(world.cannon.x, world.cannon.y, E.CATCH_BAND, Math.PI, 0);
    ctx.stroke(); ctx.setLineDash([]);
  }

  // falling pickups
  for (const pu of world.pickups) {
    const P = E.POWERUPS[pu.kind];
    const fade = pu.life < 3 ? 0.35 + 0.65 * Math.abs(Math.sin(pu.life * 6)) : 1;
    ctx.globalAlpha = fade;

    ctx.beginPath(); ctx.arc(pu.x, pu.y, pu.r, 0, TAU);
    ctx.fillStyle = '#0f2027'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = P.col; ctx.stroke();

    /* How far open it is. A crate takes several rounds now, and without a
       reading of that the first two hits look like misses — a player would
       reasonably conclude shooting them does nothing. Drawn as ticks around the
       rim rather than a bar, because a bar on a falling disc reads as a health
       bar on an enemy, which is the one thing it must not be mistaken for. */
    const left = pu.hits ?? 1;
    if (left > 1 || (pu.hits ?? 0) > 0) {
      for (let i = 0; i < E.PICKUP_HITS; i++) {
        const a = -Math.PI / 2 + (i - (E.PICKUP_HITS - 1) / 2) * 0.5;
        ctx.beginPath();
        ctx.arc(pu.x, pu.y, pu.r - 3.5, a - 0.16, a + 0.16);
        ctx.lineWidth = 2.4;
        ctx.strokeStyle = i < left ? P.col : 'rgba(230,233,226,.22)';
        ctx.stroke();
      }
    }
    // a hit flashes the rim, so a round that landed is unmistakable
    if (pu.flash > 0) {
      ctx.beginPath(); ctx.arc(pu.x, pu.y, pu.r + 2, 0, TAU);
      ctx.lineWidth = 2; ctx.strokeStyle = `rgba(255,255,255,${Math.min(1, pu.flash * 7)})`;
      ctx.stroke();
    }

    ctx.fillStyle = P.col;
    ctx.font = '700 11px "Chivo Mono",monospace'; ctx.textAlign = 'center';
    ctx.fillText(P.name[0], pu.x, pu.y + 4);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // your ordnance is spherical, like everything on the defenders' side, and
  // it is the brightest thing on the board because it is the thing you aim.
  // Color is baked onto the shot at fire time (engine.js's fireGun) rather
  // than read live off the battery here — a shot fired while cool must stay
  // the color it was fired at, not flip to red mid-flight the instant the
  // streak climbs into Critical after it already launched.
  /* Rounds, batched by colour. Drawn one at a time this was the single most
     expensive thing on the board: at five upgraded guns the screen holds ~80
     rounds, and each cost a fill plus two `glowDot`s of four arcs apiece —
     about 650 individual fills a frame, which is what the reported choppiness
     was. Grouped, it is a handful of draw calls whatever the count. */
  if (world.shots.length) {
    const byCol = new Map();
    for (const p of world.shots) {
      let list = byCol.get(p.col);
      if (!list) byCol.set(p.col, list = []);
      list.push(p);
    }
    for (const [col, list] of byCol) {
      ctx.fillStyle = col;
      ctx.beginPath();
      for (const p of list) { ctx.moveTo(p.x + p.r, p.y); ctx.arc(p.x, p.y, p.r, 0, TAU); }
      ctx.fill();
      glowDots(ctx, list, col);
    }
    // the white cores, one batch for the lot — they share a colour
    glowDots(ctx, world.shots.map(p => ({ x: p.x, y: p.y, r: p.r * .5 })), '#ffffff');
  }
  /* Debris, grouped so the canvas state is written once per group instead of
     twice per bit. Alpha is quantised to eighths to make the grouping possible;
     over a 0.35-0.75s fade on a 3px square that banding is invisible.

     Each bit still gets its own `fillRect` — the rects are *not* merged into one
     path. Same reason `glowDots` keeps per-dot fills: one fill of many
     overlapping translucent shapes blends the overlap once, many fills blend it
     twice, and picking the faster one there would quietly change the picture. */
  if (world.bits.length) {
    const groups = new Map();
    for (const b of world.bits) {
      const a = Math.max(0, Math.min(1, b.life * 2));
      const q = Math.max(1, Math.round(a * 8));
      const key = b.col + '|' + q;
      let g = groups.get(key);
      if (!g) groups.set(key, g = { col: b.col, a: q / 8, list: [] });
      g.list.push(b);
    }
    for (const g of groups.values()) {
      ctx.globalAlpha = g.a;
      ctx.fillStyle = g.col;
      for (const b of g.list) ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- board mounts ----------

     The shop portrait has 420px and can afford a cradle and a ring of bolt
     lugs. This has about 60, is drawn once per emplacement per frame, and sits
     behind the aim line with a column coming down at it. So it is not the
     portrait shrunk: it is the one idea from each portrait that survives at
     this size, and nothing else — ported at v49 from the same design canvas
     as the portraits, at its board-scale sheet's numbers.

     What survives is the mount's outline. Splayed legs, a flat slab, a sloped
     block and a ball behind a lip are four different shapes at a glance, and
     they are the same four the portraits establish — so the shop teaches the
     board. The barrel then gets a few blocks to name the gun type, and every
     gun pivots on a sphere, because defenders are spheres.

     Plain strokes, not glowStroke: six mounts a frame, every frame, and the
     portrait-grade glow is what the card is for.

     `BOARD_MOUNT` mirrors the portrait's mount taxonomy deliberately; the two
     must not drift, or a gun would be towed in the shop and dug in on the
     board. */
  const BOARD_MOUNT = { standard: 'towed', auto: 'bunker', rail: 'deck', mortar: 'towed', ion: 'mound' };

  const MOUNT_BODY = '#1a2f37', MOUNT_BACK = '#0f1b20';
  /** The footprint every mount works within, and what the heat gauge is sized to. */
  const MOUNT_R = 18;

  /** Trunnion heights, deliberately within 4px of each other. Each mount wants
   *  its own — a casemate holds its gun higher than an earthwork does — but at
   *  four different heights a row of six reads as a broken line, not a battery. */
  const mountPivot = (m) => m === 'bunker' ? -13 : m === 'deck' ? -9 : m === 'mound' ? -9 : -11;

  // the board's drawing verbs: dark body, coloured rim, in painter's order
  const bPoly = (pts, lw = 1.6) => {
    ctx.beginPath();
    pts.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py));
    ctx.closePath(); ctx.fill(); ctx.lineWidth = lw; ctx.stroke();
  };
  const bRect = (x, y, w, h, lw = 1.6) => {
    ctx.fillRect(x, y, w, h); ctx.lineWidth = lw; ctx.strokeRect(x, y, w, h);
  };
  const bEll = (cx, cy, rx, ry, lw = 1.6) => {
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU);
    ctx.fill(); ctx.lineWidth = lw; ctx.stroke();
  };
  /** A defender's sphere: gradient-lit from the upper left, rimmed in `col`. */
  const bBall = (cx, cy, r, col, lw = 1.6) => {
    const grad = ctx.createRadialGradient(cx - r * 0.26, cy - r * 0.32, 0, cx, cy, r * 1.15);
    grad.addColorStop(0, '#3a5d70'); grad.addColorStop(1, '#0d1a22');
    ctx.fillStyle = grad; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.lineWidth = lw; ctx.stroke();
    ctx.fillStyle = MOUNT_BODY;
  };
  const bHot = (cx, cy, r, hot) => {
    ctx.fillStyle = hot;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.fillStyle = MOUNT_BODY;
  };

  /** Draw one emplacement's mount at (x, y). Returns a foreground painter for
   *  anything that must occlude the gun, or null. */
  function drawBoardMount(x, y, m, col) {
    ctx.strokeStyle = col; ctx.fillStyle = MOUNT_BODY; ctx.lineCap = 'round';
    if (m === 'towed') {
      /* Skeletal, but built: splayed legs on pads, a pedestal and a dome. Still
         the airiest of the four — you can see through it, which is what says
         "towed" against a casemate you cannot. */
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(x - 31, y + 6); ctx.lineTo(x - 7, y - 3);
      ctx.moveTo(x + 31, y + 6); ctx.lineTo(x + 7, y - 3);
      ctx.stroke();
      bEll(x - 31, y + 6, 6, 2.4, 1.4);
      bEll(x + 31, y + 6, 6, 2.4, 1.4);
      bPoly([[x - 11, y + 2], [x - 8.5, y - 4], [x + 8.5, y - 4], [x + 11, y + 2]], 1.8);
      ctx.beginPath(); ctx.arc(x, y - 4, 8.5, Math.PI, 0); ctx.closePath();
      ctx.fill(); ctx.lineWidth = 1.8; ctx.stroke();
      return null;
    }
    if (m === 'deck') {
      // a flat bolted slab with a drum step: industrial, low, wide
      ctx.fillStyle = MOUNT_BACK;
      bPoly([[x - 24, y + 6], [x - 17, y - 1], [x + 17, y - 1], [x + 24, y + 6]], 1.7);
      ctx.fillStyle = MOUNT_BODY;
      bEll(x, y - 4, 13, 4, 1.5);
      return null;
    }
    if (m === 'bunker') {
      // a sloped casemate: solid, planted, the only straight-sided block here
      bPoly([[x - 18, y + 6], [x - 13, y - 10], [x + 13, y - 10], [x + 18, y + 6]], 1.9);
      ctx.lineWidth = 1.2; ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.moveTo(x - 7, y - 3); ctx.lineTo(x + 1, y - 3); ctx.stroke();
      ctx.globalAlpha = 1;
      return null;
    }
    /* The ion's ball has no mount under it — only the near lip, painted after
       the gun, so the ball sits behind a bank of earth rather than on the
       ground. Same foreground pass the portrait uses. */
    return () => {
      ctx.strokeStyle = col; ctx.fillStyle = MOUNT_BODY;
      ctx.beginPath();
      ctx.moveTo(x - 25, y + 6);
      ctx.bezierCurveTo(x - 18, y + 3, x - 12, y - 1, x - 5, y - 2);
      ctx.lineTo(x + 5, y - 2);
      ctx.bezierCurveTo(x + 12, y - 1, x + 18, y + 3, x + 25, y + 6);
      ctx.closePath(); ctx.fill(); ctx.lineWidth = 1.6; ctx.stroke();
    };
  }

  /** One barrel, in the gun's frame (origin at the pivot, +x along the aim).
   *  `sub` is a flanking barrel: shorter and thinner, as its rounds are.
   *  Lengths scale with the engine's `b.len`, so the picture cannot drift from
   *  where the rounds actually leave. */
  function drawBoardBarrel(type, sub, u, hot) {
    const X = (v) => v * u;                 // along the barrel: engine-scaled
    if (type === 'auto') {
      if (sub) {
        bRect(X(6), -2.2, X(18), 1.8, 1); bRect(X(6), 0.4, X(18), 1.8, 1);
        bRect(X(16), -2.8, 2, 5.6, 1); bRect(0, -3, X(7), 6, 1.2);
      } else {
        bRect(X(6), -4.6, X(23), 2.4, 1.1); bRect(X(6), -1.2, X(24), 2.4, 1.1);
        bRect(X(6), 2.2, X(23), 2.4, 1.1);
        bRect(X(20), -5.4, 3, 10.8, 1.2); bRect(-5, -5.5, 12, 11, 1.4);
      }
    } else if (type === 'rail') {
      if (sub) {
        bRect(X(2), -2.6, X(30), 1.4, 1); bRect(X(2), 1.2, X(30), 1.4, 1);
        bRect(X(12), -3.4, 1.6, 6.8, 1); bHot(X(27), 0, 1.2, hot);
      } else {
        bRect(-8, -4, 10, 8, 1.4);
        bRect(X(2), -4, X(40), 1.8, 1.1); bRect(X(2), 2.2, X(40), 1.8, 1.1);
        bRect(X(13), -5, 2, 10, 1.1); bRect(X(28), -5, 2, 10, 1.1);
        bHot(X(36), 0, 1.6, hot);
      }
    } else if (type === 'mortar') {
      if (sub) {
        bPoly([[X(-2), -3], [X(15), -2.8], [X(15), 2.8], [X(-2), 3]], 1.2);
        bRect(X(13), -3.6, 4, 7.2, 1.2);
      } else {
        bPoly([[X(-4), -5], [X(20), -4.6], [X(20), 4.6], [X(-4), 5]], 1.5);
        bRect(X(18), -5.8, 5, 11.6, 1.4);
      }
    } else if (type === 'ion') {
      // an insulator stack of alternating discs, ending in a small sphere
      const n = sub ? 4 : 6, x0 = 9, step = sub ? 3 : 4;
      bRect(X(6), sub ? -1.2 : -2, X(sub ? 16 : 24), sub ? 2.4 : 4, 1.1);
      for (let i = 0; i < n; i++) {
        const big = i % 2 === 0;
        bEll(X(x0 + i * step), 0, sub ? 0.9 : 1.3, sub ? (big ? 3 : 2.4) : (big ? 5 : 3.8), 1);
      }
      const tx = X(sub ? 26 : 35), tr = sub ? 3.2 : 5;
      bBall(tx, 0, tr, ctx.strokeStyle, 1.3);
      bHot(tx, 0, sub ? 1 : 1.6, hot);
    } else {
      if (sub) {
        bRect(X(4), -2.6, 4, 5.2, 1.1);
        bPoly([[X(6), -2], [X(29), -1.4], [X(29), 1.4], [X(6), 2]], 1.2);
        bRect(X(26), -2.2, 4, 4.4, 1.1);
      } else {
        bRect(-6, -4.8, 14, 9.6, 1.4);
        bPoly([[X(4), -3.2], [X(33), -2.2], [X(33), 2.2], [X(4), 3.2]], 1.4);
        bRect(X(29), -3.4, 7, 6.8, 1.4);
      }
    }
  }

  // draw each gun in the battery, each angled toward the shared aim point
  const b = world.battery;
  const tp = E.aimPoint(world);
  const u = b.len / 34;                     // the designs were drawn at b.len = 34
  for (const g of b.guns) {
    const gang = Math.atan2(tp.y - b.y, tp.x - g.x);
    const G = E.GUN_TYPES[g.type];
    const rim = g.locked > 0 ? '#e0503c' : G.col;
    const m = BOARD_MOUNT[g.type] || 'towed';
    /* Mount first, then the gun, then anything that occludes it. */
    const foreground = drawBoardMount(g.x, b.y, m, rim);
    const py = b.y + mountPivot(m);
    /* The barrel, tinted by gun type; grayed while locked, reddening with heat. */
    const barCol = g.locked > 0 ? '#4a5765' : g.heat > 0.6 ? '#e0774d' : G.col;
    const hot = g.locked > 0 ? '#6b7885' : (GUN_HOT[g.type] || '#f7e3a1');
    ctx.save(); ctx.translate(g.x, py); ctx.rotate(gang);
    ctx.strokeStyle = barCol; ctx.fillStyle = MOUNT_BODY; ctx.lineCap = 'butt';

    /* Extra barrels: smaller, flanking, and *parallel*, at the engine's own
       offsets — the geometry the rounds use — joined to the pivot by a short
       crossbar so they are part of the gun rather than floating beside it. */
    const offs = E.BARREL_OFFSETS[E.barrelsOf(g)] || [];
    if (offs.length) {
      const lo = Math.min(0, ...offs), hi = Math.max(0, ...offs);
      bRect(-1, lo, 2, hi - lo, 1);
      for (const off of offs) {
        ctx.save(); ctx.translate(0, off);
        drawBoardBarrel(g.type, true, u, hot);
        ctx.restore();
      }
    }
    drawBoardBarrel(g.type, false, u, hot);
    ctx.restore();

    // the pivot: a sphere, as every defender is — for the ion, the whole mount
    if (m === 'mound') {
      bBall(g.x, py, 9, barCol);
      bHot(g.x - 1, py + 1, 2.4, hot);
    } else {
      bBall(g.x, py, m === 'bunker' ? 3.6 : m === 'deck' ? 3.4 : 4, barCol);
      bHot(g.x, py, 1.2, hot);
    }

    // the ion's near lip, which occludes the gun rather than sitting behind it
    if (foreground) foreground();

    /* Per-mount heat gauge. Each gun has its own heat and its own Chamber tier
       now, so "which of my guns is about to lock" is a real question and the
       old 30x2.5px pip was too small to answer it. Tracked, so an empty gauge
       still shows where the full one will be. */
    const gw = MOUNT_R * 2 + 8, gx = g.x - gw / 2, gy = b.y + 22;
    ctx.fillStyle = '#0d1c22'; ctx.fillRect(gx, gy, gw, 5);
    ctx.strokeStyle = 'rgba(230,233,226,.14)'; ctx.lineWidth = 1;
    ctx.strokeRect(gx + .5, gy + .5, gw - 1, 4);
    if (g.locked > 0) {
      // locked reads as a full red bar draining back, not as heat
      ctx.fillStyle = '#e0503c';
      ctx.fillRect(gx + 1, gy + 1, (gw - 2) * (g.locked / (E.LOCK_TIME * E.stats(world, g).lock)), 3);
    } else if (g.heat > 0.02) {
      ctx.fillStyle = g.heat > 0.85 ? '#e0503c' : g.heat > 0.6 ? '#e0774d' : '#3fae8f';
      ctx.fillRect(gx + 1, gy + 1, (gw - 2) * g.heat, 3);
    }
  }

  /* Aim guide, from the battery centre through the aim point.

     Brightened from .13 to .30 and given a longer dash. It was drawn faint on
     the theory that a bold line across the board competes with the craft — but
     this is the one piece of UI that answers "where will the round go", it is
     read at a glance in the middle of a fight, and on a phone in daylight .13
     over a dark board is very close to invisible.

     Note `fadeFrame`: static content accumulates to roughly 1/fade times the
     alpha written, and this line is static whenever the player is not turning,
     so the value here is deliberately well below what it looks like in motion. */
  const cx = W / 2;
  ctx.strokeStyle = 'rgba(230,233,226,.30)'; ctx.setLineDash([5, 8]); ctx.lineWidth = 1.4;
  ctx.beginPath();
  let gx = cx, gy = b.y, gdx = Math.cos(b.ang), gdy = Math.sin(b.ang);
  ctx.moveTo(gx, gy);
  for (let seg = 0; seg < 2; seg++) {
    const tx = gdx > 0 ? (W - 6 - gx) / gdx : gdx < 0 ? (6 - gx) / gdx : Infinity;
    const ty = gdy < 0 ? (0 - gy) / gdy : Infinity;
    const t = Math.min(tx, ty, 900);
    gx += gdx * t; gy += gdy * t;
    ctx.lineTo(gx, gy);
    if (t !== tx || gy <= 0) break;
    gdx = -gdx;
  }
  ctx.stroke(); ctx.setLineDash([]);

  // convergence marker at the aim point when more than one gun is mounted
  if (b.guns.length > 1) {
    // the focal point is what convergence now buys, so it is worth seeing
    ctx.strokeStyle = 'rgba(255,217,168,.6)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(tp.x, tp.y, 7, 0, TAU); ctx.stroke();
  }

  /* Intercept markers: where the volley will actually meet the column, travel
     time included. Without them the player is guessing the lead by feel.

     One per distinct round speed (see `predictHits`). A battery firing at one
     speed draws exactly the marker it always did; a mixed one draws where each
     part of its volley lands, joined by a thin line so the *spread* reads as
     one fact about the battery rather than as several unrelated rings. */
  const hits = predictHits();
  if (hits.length) {
    if (hits.length > 1) {
      // the spread, drawn first and faintly, so the markers sit on top of it
      ctx.strokeStyle = 'rgba(230,233,226,.28)';
      ctx.lineWidth = 1; ctx.setLineDash([2, 5]);
      ctx.beginPath();
      hits.forEach((h, i) => i ? ctx.lineTo(h.x, h.y) : ctx.moveTo(h.x, h.y));
      ctx.stroke();
      ctx.setLineDash([]);
    }
    /* The commonest speed keeps the full-size crosshair — with four mounts
       firing one speed and one firing another, the big marker should be where
       most of the volley is going. `predictHits` returns commonest first. */
    hits.forEach((hit, i) => {
      const lead = i === 0;
      const r = lead ? 11 : 7;
      // a blocked marker warns that the round will glance off a plate
      ctx.strokeStyle = hit.blocked ? '#9fc4e8'
        : hits.length > 1 ? hit.col : E.OD_TIERS[world.cannon.od].col;
      ctx.lineWidth = lead ? 1.5 : 1.2;
      ctx.globalAlpha = hit.blocked ? .55 : lead ? .85 : .7;
      if (hit.blocked) ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.arc(hit.x, hit.y, r, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      if (!hit.blocked && lead) {
        ctx.beginPath();
        ctx.moveTo(hit.x - 15, hit.y); ctx.lineTo(hit.x - 7, hit.y);
        ctx.moveTo(hit.x + 7, hit.y); ctx.lineTo(hit.x + 15, hit.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    });
  }

  // muzzle flash on every gun on tap, so a press always reads as registered
  if (tapPulse > 0) {
    const tp2 = E.aimPoint(world);
    for (const g of world.battery.guns) {
      const gang = Math.atan2(tp2.y - world.battery.y, tp2.x - g.x);
      ctx.save(); ctx.translate(g.x, world.battery.y); ctx.rotate(gang);
      ctx.globalAlpha = tapPulse * .8;
      ctx.fillStyle = E.GUN_TYPES[g.type].col;
      ctx.beginPath(); ctx.arc(world.battery.len + 3, 0, 4 + tapPulse * 5, 0, TAU); ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }

  /* Floaters are the damage numbers. They still *exist* on the world when the
     preference is off — the engine owns them and nothing about the simulation
     changes — they just aren't drawn. Keeping the engine unaware is the point:
     no effect here may be load-bearing. */
  ctx.font = '700 13px "Chivo Mono",monospace'; ctx.textAlign = 'center';
  if (prefs.numbers) for (const f of world.floaters) {
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
    ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  ctx.restore();          // closes the shake transform
}

/* ---------- ui ---------- */
const GAME_ID = 'flak-battery';

function syncBest() {
  const b = best(GAME_ID);
  $('uiBest').textContent = b ? b.score : '—';
}

function sync() {
  $('uiWave').textContent = world.wave;
  $('uiScore').textContent = world.score;
  $('uiScrap').textContent = world.scrap;
  // how far this run got, for the cabinet's unlock gate. Recorded live rather
  // than at game over: reaching the wave is the achievement, and a player who
  // closes the tab mid-run has still reached it.
  recordProgress(GAME_ID, world.wave);
  const b = world.battery, T = E.OD_TIERS[b.od];
  const hottest = b.guns.reduce((m, g) => Math.max(m, g.heat), 0);
  const anyLocked = b.guns.some(g => g.locked > 0);
  $('heatFill').style.width = (hottest * 100) + '%';
  $('heatFill').style.background = anyLocked ? '#e0503c' : T.col;
  $('odLabel').textContent = anyLocked ? 'LOCKED' : (b.od ? `${T.name} ×${b.streak}` : '—');
  $('odLabel').style.color = anyLocked ? '#e0503c' : T.col;
  const fx = [];
  for (const k of Object.keys(world.effects)) {
    const P = E.POWERUPS[k];
    // whole seconds: a tenths readout on a 9-second timer changes 60 times a
    // second and is unreadable at the size this sits at
    if (P) fx.push(`<span style="color:${P.col}">${P.name} ${Math.ceil(world.effects[k])}s</span>`);
  }
  if (world.shieldCharges > 0) {
    fx.push(`<span style="color:#e6e9e2">Shield ×${world.shieldCharges}</span>`);
  }
  $('fxbar').innerHTML = fx.join('');

  /* The header's build readout is the *deepest* tier reached on any mount for
     each branch. Upgrades are per-gun now, so there is no one tree to show —
     and a sum or an average would say nothing useful. The high-water mark
     answers the question the strip is actually for: "how far along am I". The
     shop's tabs are where per-mount detail lives. */
  /* One pip column per branch, deepest tier reached on any mount. With nine
     branches this is a lot of marks for a header, so it collapses to a single
     total on narrow screens (see the CSS) — the shop tabs are where per-branch
     detail belongs. */
  $('uiBuild').innerHTML = E.BRANCHES.map(b => {
    const t = world.battery.guns.reduce((m, g) => Math.max(m, g.upgrades[b] || 0), 0);
    const pips = Array.from({ length: E.MAX_TIER }, (_, i) =>
      `<i class="${i < t ? 'on' : ''}"></i>`).join('');
    return `<span title="${E.UPGRADES[b].name} (best mount)">${pips}</span>`;
  }).join('');
}
function showBanner(h, p, btn) {
  $('banner').classList.remove('hide');
  $('banner').querySelector('h2').textContent = h;
  $('hint').textContent = p;
  $('go').textContent = btn;
}
$('go').addEventListener('click', () => {
  $('shop').classList.remove('on');
  // Resuming after a rotation must NOT restart the run — the whole point is
  // that your place was kept. Only a finished or unstarted run resets.
  const restarting = !paused && (world.over || !world.running);
  /* Only after a *loss*, not on the first Begin of a session. The ask was to
     land on research when starting over, and a player who has never played has
     nothing to spend and no reason to be shown a shop first. */
  const afterLoss = !paused && world.over;
  if (paused) paused = false;
  else if (restarting) { E.resetRun(world); overCued = false; }
  $('banner').classList.add('hide');
  firing = false; drag = null;

  /* A fresh run opens on Research before it opens on the board. Research is
     the only thing a finished run leaves you, and the moment you are most
     likely to want to spend it is the moment you just earned some. The Begin
     button on that screen is what actually starts the wave. */
  if (afterLoss) {
    openResearch();
    fitStage(); sync();
    return;
  }

  world.running = true;
  started = true;
  fitStage(); sync();
});

/* True while the shop is showing the research screen of a run that has not
   started yet. `shopGo` means "next wave" on every other screen, and calling
   nextWave here would advance past wave 1 before it was ever played. */
let researchScreen = false;

/* ---------- resuming an interrupted run ----------

   A serpent run is long, and a phone closes the app without warning. Saves are
   written on the quiet beats — when the shop opens between waves, and when the
   page is hidden — rather than every frame. */

let resumeOffered = false;
/* Set once the player has actually begun. Used instead of `world.running`,
   which goes false whenever a banner or the shop is up — and those paused
   states are exactly the ones most worth saving. */
let started = false;

/* Two different questions, and conflating them is what lost people's runs.
 *
 * Reported at v45: start a run, back out, come back, decline nothing — just
 * back out again from the banner offering Continue — and the save was gone.
 * Leaving the page fires this, and "no run started in this page instance" was
 * being read as "there is nothing worth keeping", so the stored run was
 * deleted by the act of looking at it.
 *
 * A run that is *over* is not one to come back to, and clearing that is right.
 * A page where nothing has started yet knows nothing about what is stored and
 * must leave it alone. */
function saveNow() {
  if (world.over) { clearRun(GAME_ID); return; }
  if (!started) return;
  saveRun(GAME_ID, E.snapshot(world), `Wave ${world.wave} · ${world.score}`);
}

// visibilitychange is what actually fires when a phone backgrounds an app;
// beforeunload is unreliable there.
addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
addEventListener('pagehide', saveNow);

(function offerResume() {
  const stored = loadRun(GAME_ID);
  if (!stored) return;
  resumeOffered = true;
  showBanner('Resume run?', `You left off at ${stored.label}.`, 'Continue');

  const fresh = document.createElement('button');
  fresh.type = 'button';
  fresh.textContent = 'New run';
  fresh.style.cssText = 'margin-left:8px;background:#1b3038;color:var(--bone)';
  fresh.addEventListener('click', () => {
    clearRun(GAME_ID);
    fresh.remove();
    resumeOffered = false;
    showBanner('Flak Battery', 'Hold to fire. Drag to aim.', 'Begin');
  });
  $('go').after(fresh);

  // capture, so this runs before the main handler decides to resetRun
  $('go').addEventListener('click', function once() {
    $('go').removeEventListener('click', once, { capture: true });
    if (!resumeOffered) return;
    resumeOffered = false;
    fresh.remove();
    if (E.hydrate(world, stored.snap)) {
      // the run is mid-flight, not unstarted: mark it running so the main
      // handler's "reset an unstarted run" branch does not wipe it
      world.running = true;
    } else {
      clearRun(GAME_ID);
      E.resetRun(world);
      overCued = false;
    }
    clearRun(GAME_ID);
    sync();
  }, { capture: true });
})();

fitStage(); syncBest(); sync();
requestAnimationFrame(frame);
</script>
