<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Flak Battery</title>
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#0b1418">
<link rel="icon" href="../../shared/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../shared/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="stylesheet" href="../../shared/theme.css">
<script type="module" src="../../shared/pwa.js"></script>
<style>
  /* Flak Battery keeps the default brass accent on an 880-wide board, and
     adds the heat gauge, shop, and segment legend that only it has. */
  :root{
    --board-max:880px;
  }

  #uiBuild{display:flex;gap:6px;align-items:center}
  #uiBuild span{display:flex;gap:1px;align-items:center}
  #uiBuild i{width:3px;height:8px;background:#1b3038;display:inline-block}
  #uiBuild i.on{background:var(--scale)}

  #heat{position:absolute;left:12px;bottom:12px;width:min(150px,38vw)}
  #heatLabel{
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    margin-bottom:4px;display:flex;justify-content:space-between;
  }
  #heatLabel em{font-style:normal;color:var(--brass);font-weight:700}
  #heatTrack{height:7px;background:#0d1c22;border:1px solid var(--line);position:relative;overflow:hidden}
  #heatFill{position:absolute;inset:0 auto 0 0;width:0%;background:var(--scale);transition:background .18s linear}
  #heatTicks{position:absolute;inset:0;pointer-events:none}
  #heatTicks i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}


  /* segment legend, shown inside the help panel */
  #helpPanel .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:2px}
  #helpPanel .legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
  #helpPanel .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

  #shop{position:absolute;inset:0;display:none;flex-direction:column;
    background:rgba(11,20,24,.94);padding:18px 16px;overflow-y:auto;gap:12px}
  #shop.on{display:flex}
  #shopHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  #shopHead h2{font-family:'Archivo Black',sans-serif;font-size:clamp(15px,3.6vw,20px);text-transform:uppercase;letter-spacing:-.02em}
  #shopScrap{font-size:12px;color:var(--brass);font-weight:700;letter-spacing:.08em}
  /* Cards scaled back: `minmax(180px)` fitted two per row on a phone and made
     each one tall enough that the shop needed scrolling to compare options.
     At 148px three fit, and the whole tree is visible at once — which is the
     point of a between-waves shop. `.buy`/`.chip` are untouched; they are
     thumb targets and are what set the card's minimum height. */
  #branches,#battery{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:7px}
  .shopSection{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);
    border-bottom:1px solid var(--line);padding-bottom:5px;margin-top:4px}
  .assign{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
  /* Shop controls are thumb targets, not cursor targets. These were all sized
     for a mouse: .buy computed to ~28px tall and .chip was 26px square, both
     well under a comfortable tap. */
  .chip{width:34px;height:34px;border:1px solid var(--line);background:#0f2027;color:var(--dim);
    font:700 12px/1 'Chivo Mono',monospace;cursor:pointer;border-radius:3px}
  .chip.on{background:var(--scale);color:#06201a;border-color:var(--scale)}
  .branch{border:1px solid var(--line);background:#0f2027;padding:9px 10px;display:flex;flex-direction:column;gap:6px;text-align:left}
  .branch h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone);font-weight:700}
  /* no min-height: it reserved two lines for every blurb whether or not the
     text needed them, which padded out every card in the grid */
  .branch p{font-size:10px;color:var(--dim);line-height:1.45}
  .pips{display:flex;gap:3px}
  .pips i{flex:1;height:5px;background:#1b3038;border-radius:1px}
  .pips i.on{background:var(--scale)}
  .buy{width:100%;min-height:42px;padding:12px 10px;font:700 11px/1 'Chivo Mono',monospace;letter-spacing:.12em;
    text-transform:uppercase;border:0;cursor:pointer;background:var(--brass);color:#1a1405;border-radius:3px}
  /* "maxed" and "can't afford yet" are different states and used to look
     identical — the second is temporary, so it keeps a hint of the brass. */
  .buy:disabled{background:#1b3038;color:#4d6068;cursor:default}
  .buy.poor:disabled{background:#2a2416;color:#8a7645;border:1px solid #3d3520}
  #shopGo{align-self:center;margin-top:2px}
</style>

<div id="shell">
  <header>
    <div class="titles">
      <a class="back" href="../../index.html">&larr; Arcade</a>
      <h1>Flak <span>Battery</span></h1>
    </div>
    <div class="meta">
      <div>Wave <b id="uiWave">1</b></div>
      <div>Score <b id="uiScore">0</b></div>
      <div>Scrap <b id="uiScrap">0</b></div>
      <div>Cells <b id="uiLives">3</b></div>
      <div>Best <b id="uiBest">—</b></div>
      <div id="uiBuild" title="Barrel / Chamber / Optics / Munitions"></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv" width="880" height="620"></canvas>
    <div id="heat">
      <div id="heatLabel"><span>Heat</span><em id="odLabel">—</em></div>
      <div id="heatTrack">
        <div id="heatFill"></div>
        <div id="heatTicks"><i style="left:40%"></i><i style="left:65%"></i><i style="left:85%"></i></div>
      </div>
    </div>
    <div id="shop">
      <div id="shopHead">
        <h2>Refit</h2>
        <div id="shopScrap">Scrap 0</div>
      </div>
      <div class="shopSection">Cannon Upgrades</div>
      <div id="branches"></div>
      <div class="shopSection">The Battery</div>
      <div id="battery"></div>
      <button id="shopGo">Next Wave</button>
    </div>
    <div id="fxbar"></div>
    <div id="banner">
      <h2>Flak Battery</h2>
      <p id="hint">Drag to aim, hold to fire.</p>
      <button id="go">Begin</button>
    </div>
  </div>

  <footer>
    <span>Cut mid-chain to force recoil</span>
    <span>Head kills buy the most time</span>
    <span>Overheat locks the barrel</span>
  </footer>
</div>

<script type="module">
import * as E from './engine.js';
import { makeFit } from '../../shared/fit.js';
import { glowStroke, glowDot, dim, GLOW_PASSES_CHEAP } from '../../shared/glow.js';
import { best, submit } from '../../shared/scores.js';
import { recordProgress } from '../../shared/unlocks.js';
import { saveRun, loadRun, clearRun } from '../../shared/resume.js';
import { makeAudio } from '../../shared/audio.js';
import { makeMenu } from '../../shared/menu.js';

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H;
const TAU = E.TAU;
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const $ = id => document.getElementById(id);

const audio = makeAudio();

/* effects live in the shell, not the engine. A kill or bomb bursts, so `burst`
   is a fair proxy for an impact sound; `push` carries the overdrive/overheat
   floaters, which double as the cue for those tones. Firing and breaches have
   no fx hook — the frame loop watches world state for them instead. */
const fx = {
  burst(x, y, col, n = 10) {
    audio.hit();
    if (reduce) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, sp = 40 + Math.random() * 140;
      world.bits.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .35 + Math.random() * .4, col });
    }
  },
  push(txt, x, y, col) {
    world.floaters.push({ txt, x, y, col, life: .9 });
    if (txt === 'OVERHEAT') audio.overheat();
    else if (txt === 'WARM' || txt === 'HOT' || txt === 'CRITICAL') audio.overdrive();
  },
  // one blip per volley, however many barrels loosed — the engine calls this
  shot() { audio.fire(); },
};

/* Portrait phones get a tall board plus an empty band beneath the cannon:
   somewhere to rest and drag a thumb without covering the play area. Landscape
   uses the wide board and the side gutters. Re-picked whenever the phone
   turns — see applyLayout. */
/* Portrait-only since 2026-07-27: landscape didn't feel right on a real phone.
   Every board uses the tall layout regardless of orientation. The rotation
   machinery below is left intact but inert (applyLayout early-returns because
   the layout never changes) — flip this flag back to false to restore
   landscape without re-deriving anything. */
const PORTRAIT_ONLY = true;
const pickLayout = () =>
  (PORTRAIT_ONLY || matchMedia('(max-aspect-ratio: 4/5)').matches) ? E.LAYOUT_TALL : E.LAYOUT;

/* Which input this device aims with decides which correction the engine
   applies: touch gets a wider hit radius, mouse gets a traverse cap. Declared
   here rather than beside the pointer handlers because the world needs it. */
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;

/* Power-up drops are off by default and switchable from the settings menu —
   an experiment in how the game plays without them, so it needs to be
   flippable on a phone without a redeploy. Guarded storage, same shape as
   Feedline's input settings and shared/scores.js. */
const DROPS_KEY = 'arcade:flak-battery:drops';
function readDrops() {
  try { return localStorage.getItem(DROPS_KEY) === '1'; } catch { return false; }
}
function writeDrops(v) { try { localStorage.setItem(DROPS_KEY, v ? '1' : '0'); } catch {} }

const world = E.createWorld({ fx, layout: pickLayout(), assist: isTouch, drops: readDrops() });
E.spawnWave(world);

const board = { w: world.L.W, h: world.L.H };   // makeFit re-reads this

function adoptLayout() {
  W = world.L.W; H = world.L.H;
  board.w = W; board.h = H;
  cv.width = W; cv.height = H;
  document.documentElement.style.setProperty('--board-max', W + 'px');
}
adoptLayout();

/* ---------- input ---------- */
let keys = {}, firing = false;
let paused = false;      // set when a rotation pauses a run in progress

function stagePt(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
/* Mouse aim is absolute, so the cursor sets a *desired* angle and the frame
   loop swings the battery toward it at the turret's traverse rate. Snapping
   straight to the cursor is what made mouse play trivially easy. */
let aimTarget = null;
function aimAt(p) {
  aimTarget = E.clampAim(Math.atan2(p.y - world.cannon.y, p.x - world.cannon.x));
}

/* Touch: the field is one control. Press anywhere to start firing, then drag
   to aim relatively — the angle follows how far you move, not where you are,
   so you can rest a thumb low and never cover the snake.
   Mouse keeps absolute aiming, which is what a cursor is good at. */
let drag = null;

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  if (e.pointerType === 'mouse') { aimAt(stagePt(e)); firing = true; return; }
  drag = { x: e.clientX, t: performance.now() };
  firing = true;
  E.queueShot(world);          // the press itself always produces a shot
  tapPulse = 1;
});

cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { if (firing || !isTouch) aimAt(stagePt(e)); return; }
  if (!drag) return;
  const now = performance.now();
  const dx = e.clientX - drag.x;
  const dt = Math.max((now - drag.t) / 1000, 1e-3);
  world.cannon.ang = E.clampAim(world.cannon.ang + E.aimDelta(dx, dt));
  aimTarget = null;            // a drag takes over; stop chasing an old cursor
  drag.x = e.clientX; drag.t = now;
});

function endPointer(e) {
  if (e.pointerType === 'mouse') { firing = false; return; }
  drag = null; firing = false;
}
addEventListener('pointerup', endPointer);
addEventListener('pointercancel', endPointer);

/* Belt and braces on top of the CSS: a long press must not start a selection
   or open the context menu mid-game. Scoped to the game surface so normal
   page behaviour survives on desktop. */
for (const ev of ['selectstart', 'contextmenu', 'dragstart']) {
  cv.addEventListener(ev, e => e.preventDefault());
}
// a drag that starts on the board can still paint a selection across the
// header, so cancel any selection that begins while a touch is down
document.addEventListener('selectstart', e => { if (drag) e.preventDefault(); });

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); firing = true; }
});
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space') firing = false; });

if (isTouch) document.body.classList.add('touch');

/* The trim buttons are gone — they ate scarce screen for a job the drag now
   does well enough on its own, so there is no furniture below the board and
   `extra` is unnecessary. */
const fitStage = makeFit({ canvas: cv, stage: $('stage'), board });

/* Rotating the phone moves the run onto the other board. Chains are positioned
   by arc-length, so scaling by the ratio of path lengths puts every segment at
   the same fraction of its journey; wave, score, scrap, lives, upgrades and the
   battery all carry over. */
function applyLayout() {
  const L2 = pickLayout();
  if (L2 === world.L) return;
  const wasRunning = world.running;
  E.relayout(world, L2);
  adoptLayout();
  fitStage();
  sync();
  if (wasRunning) {
    world.running = false;
    paused = true;                 // so Resume does not restart the run
    showBanner('Turned', 'Your run is where you left it.', 'Resume');
    $('banner').classList.remove('hide');
  }
}
addEventListener('resize', applyLayout);
addEventListener('orientationchange', () => setTimeout(applyLayout, 200));

// settings panel content for the shared menu's `extra` slot
const settingsEl = document.createElement('div');
settingsEl.className = 'menuSettings';
settingsEl.innerHTML = `
  <h3>Settings</h3>
  <label><input type="checkbox" id="dropsToggle"${world.drops ? ' checked' : ''}> Power-up drops</label>
  <p class="settingNote">Off by default. Applies from the next carrier you destroy.</p>
`;
settingsEl.querySelector('#dropsToggle').addEventListener('change', e => {
  writeDrops(e.target.checked);
  // apply live too, so a player who flips it mid-run sees it from the next
  // carrier kill rather than having to restart to find out
  world.drops = e.target.checked;
});

const pause = makeMenu({
  stage: $('stage'),
  host: document.querySelector('header'),
  audio,
  extra: settingsEl,
  title: 'Flak Battery',
  lore: 'They came down in one unbroken column. This is the last emplacement still firing.',
  rows: [
    ['Aim', 'Press and drag anywhere. Flick to swing across.'],
    ['Fire', 'Hold to keep firing. Too much and the barrel overheats.'],
    ['Overdrive', 'Consecutive hits make you stronger. A miss cools it.'],
  ],
  notes: [
    'Cutting mid-chain shoves the snake backwards.',
    'Plated segments glance shots off the front — hit the flank, or fire the ion cannon, which cuts through from any angle.',
    'The head is armoured by its body: the ring around it thins as you clear behind it. Drop the head and the whole serpent dies with it.',
    'Hardened hulls are just tough — a railgun is the efficient tool against them.',
    'Keyboard: arrows and Space.',
  ],
});

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;

  if (world.running && !pause.paused) {
    const c = world.cannon;
    let kb = 0;
    if (keys.ArrowLeft) kb -= 1;
    if (keys.ArrowRight) kb += 1;
    if (kb) { c.ang = E.clampAim(c.ang + kb * 2.0 * dt); aimTarget = null; }
    // swing toward the cursor at the turret's traverse rate (mouse aiming)
    else if (aimTarget !== null) c.ang = E.slewAim(c.ang, aimTarget, dt);

    if (tapPulse > 0) tapPulse = Math.max(0, tapPulse - dt * 4);

    const livesBefore = world.lives;
    E.step(world, dt, firing);
    // a breach costs a life; the last one ends the run. Sound it either way,
    // read from state since the engine has no breach fx hook.
    if (world.lives < livesBefore) audio[world.over ? 'lose' : 'breach']();

    if (world.over) {
      clearRun(GAME_ID);          // a finished run is not one to come back to
      const r = submit(GAME_ID, world.score, `Wave ${world.wave}`);
      syncBest();
      showBanner('Battery Down',
        r.record ? `New best — ${world.score}, wave ${world.wave}`
                 : `Score ${world.score} · Wave ${world.wave} · best ${r.best}`,
        'Try again');
    }
    else if (world.shopOpen && !$('shop').classList.contains('on')) { saveNow(); openShop(); }
    sync();
  }
  draw();
  requestAnimationFrame(frame);
}

let tapPulse = 0;

/* March a virtual shot forward and report the first segment it would meet,
   advancing the chains at the same time. Cheap, and exact enough to trust. */
function predictHit() {
  const c = world.cannon;
  const S = E.stats(world);
  const step = 1 / 90, maxT = S.predict;
  let x = c.x + Math.cos(c.ang) * c.len;
  let y = c.y + Math.sin(c.ang) * c.len;
  let vx = Math.cos(c.ang) * S.shotSpeed, vy = Math.sin(c.ang) * S.shotSpeed;

  for (let t = 0; t < maxT; t += step) {
    x += vx * step; y += vy * step;
    if (x < 6) { x = 6; vx = -vx; }
    if (x > W - 6) { x = W - 6; vx = -vx; }
    if (y < -20 || y > H + 20) return null;

    for (const ch of world.chains) {
      const s = ch.recoil > 0 ? ch.s - Math.min(ch.recoil, ch.speed * 2.4 * t) : ch.s + ch.speed * t;
      for (let i = 0; i < ch.segs.length; i++) {
        const p = E.atS(world.path, world.pathLen, s - i * ch.spacing);
        if (p.off) continue;
        if (Math.hypot(x - p.x, y - p.y) < ch.segs[i].r + 3.2) {
          // a shot that would glance off the plate is not a hit, so the
          // marker must not promise one. Heading is sampled at the segment's
          // *predicted* position, not its current one.
          const sAt = s - i * ch.spacing;
          const a = E.atS(world.path, world.pathLen, Math.max(0.01, sAt - 4));
          const b = E.atS(world.path, world.pathLen, Math.min(world.pathLen - 0.01, sAt + 4));
          const m = Math.hypot(b.x - a.x, b.y - a.y) || 1;
          const h = { x: (b.x - a.x) / m, y: (b.y - a.y) / m };
          if (E.isDeflected(ch.segs[i], h, vx, vy)) return { x: p.x, y: p.y, blocked: true };
          return { x: p.x, y: p.y };
        }
      }
    }
  }
  return null;
}

/* ---------- shop ---------- */
function renderShop() {
  $('shopScrap').textContent = 'Scrap ' + world.scrap;
  const host = $('branches');
  host.innerHTML = '';

  for (const b of E.BRANCHES) {
    const U = E.UPGRADES[b];
    const tier = world.upgrades[b];
    const cost = E.upgradeCost(world.upgrades, b);
    const maxed = cost === null;
    const afford = E.canAfford(world, b);

    const el = document.createElement('div');
    el.className = 'branch';

    const pips = Array.from({ length: E.MAX_TIER }, (_, i) =>
      `<i class="${i < tier ? 'on' : ''}"></i>`).join('');

    el.innerHTML =
      `<h3>${U.name}</h3>` +
      `<div class="pips">${pips}</div>` +
      `<p>${U.blurb}</p>`;

    const btn = document.createElement('button');
    btn.className = 'buy' + (!maxed && !afford ? ' poor' : '');
    // spell out the shortfall: "Buy · 40" while holding 25 leaves you counting
    btn.textContent = maxed ? 'Maxed'
      : afford ? `Buy · ${cost}`
      : `${cost} · need ${cost - world.scrap} more`;
    btn.disabled = maxed || !afford;
    btn.addEventListener('click', () => {
      if (E.buyUpgrade(world, b)) { renderShop(); sync(); }
    });
    el.appendChild(btn);
    host.appendChild(el);
  }

  renderBattery();
}

function renderBattery() {
  const host = $('battery');
  host.innerHTML = '';

  // add-mount card
  const mCost = E.mountCost(world);
  const mount = document.createElement('div');
  mount.className = 'branch';
  const dots = Array.from({ length: E.MAX_MOUNTS }, (_, i) =>
    `<i class="${i < world.battery.guns.length ? 'on' : ''}"></i>`).join('');
  mount.innerHTML =
    `<h3>Emplacements</h3>` +
    `<div class="pips">${dots}</div>` +
    `<p>Another gun on the line. All fire together toward your aim.</p>`;
  const mBtn = document.createElement('button');
  mBtn.className = 'buy';
  mBtn.textContent = mCost === null ? 'Full' : `Add Gun · ${mCost}`;
  mBtn.disabled = mCost === null || world.scrap < mCost;
  mBtn.addEventListener('click', () => {
    if (E.buyMount(world)) { renderShop(); sync(); }
  });
  mount.appendChild(mBtn);
  host.appendChild(mount);

  // multi-barrel card — a top-tier upgrade, battery-wide: every mount fires
  // this many barrels per volley instead of one, off its own heat/cooldown
  const barCost = E.barrelCost(world);
  const barrel = document.createElement('div');
  barrel.className = 'branch';
  const barDots = Array.from({ length: E.MAX_BARRELS }, (_, i) =>
    `<i class="${i < world.barrels ? 'on' : ''}"></i>`).join('');
  barrel.innerHTML =
    `<h3>Barrels</h3>` +
    `<div class="pips">${barDots}</div>` +
    `<p>Every mount fires this many rounds per volley, sharing its heat.</p>`;
  const barBtn = document.createElement('button');
  barBtn.className = 'buy';
  barBtn.textContent = barCost === null ? 'Maxed' : `Add Barrel · ${barCost}`;
  barBtn.disabled = barCost === null || world.scrap < barCost;
  barBtn.addEventListener('click', () => {
    if (E.buyBarrel(world)) { renderShop(); sync(); }
  });
  barrel.appendChild(barBtn);
  host.appendChild(barrel);

  // gun-type unlock cards
  for (const type of E.GUN_KEYS) {
    if (type === 'standard') continue;
    const G = E.GUN_TYPES[type];
    const unlocked = world.gunUnlocks[type];

    const el = document.createElement('div');
    el.className = 'branch';
    el.innerHTML =
      `<h3 style="color:${G.col}">${G.name}</h3>` +
      `<p>${gunBlurb(type)}</p>`;

    if (!unlocked) {
      const btn = document.createElement('button');
      btn.className = 'buy';
      btn.textContent = `Unlock · ${G.unlock}`;
      btn.disabled = world.scrap < G.unlock;
      btn.addEventListener('click', () => {
        if (E.unlockGun(world, type)) { renderShop(); sync(); }
      });
      el.appendChild(btn);
    } else {
      // once unlocked, show a per-mount assignment row
      const row = document.createElement('div');
      row.className = 'assign';
      world.battery.guns.forEach((g, idx) => {
        const chip = document.createElement('button');
        chip.className = 'chip' + (g.type === type ? ' on' : '');
        chip.textContent = idx + 1;
        chip.title = `Mount ${idx + 1}`;
        chip.addEventListener('click', () => {
          // toggle: assigning the same type again reverts to standard
          E.setGunType(world, idx, g.type === type ? 'standard' : type);
          renderShop(); sync();
        });
        row.appendChild(chip);
      });
      el.appendChild(row);
    }
    host.appendChild(el);
  }
}

function gunBlurb(type) {
  const G = E.GUN_TYPES[type];
  if (type === 'auto') return 'Fires fast, hits light. Good against soft, crowded rows.';
  if (type === 'rail') return 'Slow, punches through several segments at once.';
  if (type === 'mortar') return 'Lobs a heavy round; reaches over the front rank.';
  if (type === 'ion') return 'The only thing that cuts through a hardened hull.';
  return G.name;
}

function openShop() {
  $('shop').classList.add('on');
  renderShop();
}
$('shopGo').addEventListener('click', () => {
  $('shop').classList.remove('on');
  E.nextWave(world);
  firing = false; drag = null;
  sync();
});

/* ---------- segment rendering ---------- */

// a rounded rect path, centred on origin
function roundRectPath(w, h, r) {
  const x = -w / 2, y = -h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// lighten/darken a hex colour by a signed amount
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return `rgb(${r},${g},${b})`;
}

// draw one segment as an oriented, lit plate. `idx` gives each plate a slight
// size cadence so a run of them reads as overlapping armour.
function drawSegment(seg, sp, heading, idx, bodyLeft = 0) {
  const K = E.KIND[seg.kind];
  const dmgT = 1 - seg.hp / seg.maxhp;
  const ang = Math.atan2(heading.y, heading.x);
  const now = performance.now();

  // plate dimensions: longer than the spacing so consecutive plates overlap
  // into a continuous armoured body, and clearly longer than wide so each
  // points forward
  /* Square, and square on purpose: the invaders are cubes and the defenders are
     spheres, everywhere, without exception. These were elongated plates, which
     read as a single armoured body — but the fiction is a column of individual
     craft, and a chain of cubes says that better as well as matching the other
     games. Kept slightly long so the direction of travel still reads. */
  /* Square, and sized to sit *inside* `SEGMENT_SPACING` (42) so consecutive
     craft don't touch. The previous 2.8×2.4 was wider than the old 30px
     spacing, so a chain fused into one continuous fence and the individual
     craft were invisible — bigger squares only read as bigger if there is a
     gap between them, which is why the engine's spacing went up alongside.
     Draw-size only: `seg.r` is the collision radius and is untouched. */
  const long = seg.r * 2.7, wide = seg.r * 2.7;
  const corner = 0;

  ctx.save();
  ctx.translate(sp.x, sp.y);
  ctx.rotate(ang);

  const base = seg.flash > 0 ? '#ffffff' : K.col;

  /* A dark body with a lit rim, not a gradient-filled plate. Each craft in the
     column reads as a cube with its running lights on, which is what the other
     three games do and what the setting asks for.

     Damage is now the *only* health readout — the hp number that used to sit
     on tough segments is gone — so the dim has to carry it alone and reaches
     much further down than it used to (0.25 at death, not 0.45). It applies
     to the body and the hairline rim too, both of which were previously
     damage-independent and kept a dying craft looking half-lit. */
  const lit = 0.25 + 0.75 * (seg.hp / seg.maxhp);

  /* A second, darker face offset behind the front one, *and* the four edges
     joining the two — this is hand-rolled rather than using the shared
     `cube()` because these are oblong (long ≠ wide) and already inside a
     rotated frame, but the joining edges are exactly what cube() draws and
     what this was missing. Without them two offset rectangles read as two
     rectangles; with them the thing reads as a box. */
  const depth = Math.max(2, wide * 0.28);
  const dx = depth * 0.55, dy = depth;
  const hx = long / 2, hy = wide / 2;

  /* Both faces are lifted well above the board colour, exactly as Choke
     Point's towers are: at a near-black fill the body vanished into the
     background and the craft read as a hollow outline rather than a solid
     object. The back face stays darker than the front so the offset reads
     as depth rather than as a second, equal square. */
  ctx.save();
  ctx.translate(dx, dy);
  roundRectPath(long, wide, corner);
  ctx.fillStyle = dim('rgba(13,26,34,.98)', lit);
  ctx.fill();
  ctx.restore();
  glowStroke(ctx, () => { ctx.translate(dx, dy); roundRectPath(long, wide, corner); ctx.translate(-dx, -dy); },
    base, 1, [[4, 0.05], [2, 0.10]], lit);

  // the joining edges: the silhouette corners linked front face to back
  glowStroke(ctx, (c) => {
    for (const [px, py] of [[hx, -hy], [hx, hy], [-hx, hy]]) {
      c.moveTo(px, py); c.lineTo(px + dx, py + dy);
    }
  }, base, 1, [[3, 0.07], [1.2, 0.18]], lit);

  roundRectPath(long, wide, corner);
  ctx.fillStyle = dim('rgba(24,44,56,.98)', lit);
  ctx.fill();

  if (seg.flash > 0) {
    glowStroke(ctx, () => roundRectPath(long, wide, corner), '#ffffff', 2.4,
      GLOW_PASSES_CHEAP, Math.min(1, seg.flash * 8));
  }
  glowStroke(ctx, () => roundRectPath(long, wide, corner), base, 1.8,
    GLOW_PASSES_CHEAP, lit);

  // outer rim, dimmed with everything else
  roundRectPath(long, wide, corner);
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = dim(K.ring, lit);
  ctx.stroke();

  // --- per-type material detail ---
  drawSegmentDetail(seg, K, long, wide, dmgT, now);

  // damage: hairline cracks that deepen as HP drops
  if (dmgT > 0.35 && seg.flash <= 0) {
    ctx.strokeStyle = `rgba(255,180,150,${Math.min(0.7, dmgT)})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-long * 0.15, -wide * 0.3);
    ctx.lineTo(long * 0.05, wide * 0.1);
    ctx.lineTo(-long * 0.1, wide * 0.35);
    ctx.stroke();
  }

  ctx.restore();

  // The head's body-armour, made visible. Without this the mechanic is a
  // mystery: shots land on the head and simply do nothing, with no hint that
  // the body behind it is the reason. The ring tightens and fades as the body
  // is cleared, so "keep chewing and the head opens up" is readable at a glance.
  if (seg.kind === 'head' && bodyLeft > 0) {
    const prot = 1 - E.headDamageFactor(bodyLeft);      // 0 = exposed, →1 = sealed
    const hit = seg.deflect > 0;
    const pulse = reduce ? 0 : Math.sin(performance.now() / 260) * 1.6;
    const rr = seg.r * 1.55 + (1 - prot) * 6 + pulse;
    const col = hit ? '#ffffff' : '#c9a227';
    const lw = hit ? 2.6 : 1 + prot * 1.6;
    const alpha = hit ? 1 : 0.35 + prot * 0.6;
    // four corner brackets, not a full halo — an armour-plating cue on the
    // command ship rather than a target reticle drawn around a "head"
    const half = Math.PI / 5;
    for (const a of [0, Math.PI / 2, Math.PI, Math.PI * 1.5]) {
      glowStroke(ctx, c => c.arc(sp.x, sp.y, rr, a - half, a + half), col, lw, GLOW_PASSES_CHEAP, alpha);
    }
  }

  /* The hp number that used to sit on tough segments is gone. It was a
     readable number on a board where you are aiming, not reading — and with
     the chain now up to 72 craft long it was 72 little numbers competing with
     the thing you actually track. Health is brightness instead (see `lit`
     above), which is the same cue Choke Point's enemies use. */
}

// surface treatment specific to each segment type, drawn in the plate's
// local rotated frame (long axis = x)
function drawSegmentDetail(seg, K, long, wide, dmgT, now) {
  if (seg.kind === 'head') {
    /* A command ship, not a face. The previous version drew a centre ridge
       and two pale discs with red pupils near the leading edge — which is a
       nose and two eyes, and read as a head no matter what the fiction said.
       Nothing here is bilaterally paired across the centre line any more:
       the structure is a hull spine with an *offset* bridge block and
       stepped deck plating, which reads as a vessel seen from above. */
    const fwd = long * 0.5, half = wide * 0.5;

    // spine down the long axis, stopping short of the bow
    ctx.strokeStyle = shade(K.col, 50);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-fwd * 0.66, 0); ctx.lineTo(fwd * 0.62, 0);
    ctx.stroke();

    // deck plating: ribs across the spine, tapering toward the bow
    ctx.lineWidth = 1;
    ctx.strokeStyle = shade(K.col, 25);
    for (const [x, k] of [[-fwd * 0.42, 0.74], [-fwd * 0.12, 0.60], [fwd * 0.2, 0.42]]) {
      ctx.beginPath();
      ctx.moveTo(x, -half * k); ctx.lineTo(x, half * k);
      ctx.stroke();
    }

    // bridge: a raised block set off-centre, so the silhouette is asymmetric
    ctx.fillStyle = shade(K.col, 60);
    roundRectPathAt(-fwd * 0.28, -half * 0.34, long * 0.2, wide * 0.26, 1);
    ctx.fill();

    // a single mast light at the bow — one, deliberately, since two would
    // pair back up into eyes
    ctx.fillStyle = 'rgba(224,80,60,.95)';
    ctx.beginPath(); ctx.arc(fwd * 0.72, 0, 1.9, 0, TAU); ctx.fill();
    return;
  }

  if (K.shield) {
    // a raised plate across the leading face (the +x edge is the front)
    ctx.save();
    ctx.fillStyle = seg.deflect > 0 ? '#ffffff' : shade(K.col, 40);
    roundRectPathAt(long * 0.32, 0, long * 0.34, wide * 0.94, 3);
    ctx.fill();
    ctx.strokeStyle = seg.deflect > 0 ? '#ffffff' : '#bcd8f0';
    ctx.lineWidth = 1.5; ctx.stroke();
    // rivets
    ctx.fillStyle = 'rgba(11,26,34,.9)';
    for (const yy of [-wide * 0.28, wide * 0.28]) {
      ctx.beginPath(); ctx.arc(long * 0.32, yy, 1.2, 0, TAU); ctx.fill();
    }
    ctx.restore();
    return;
  }

  if (seg.kind === 'volatile') {
    // a glowing pressure cell in the middle
    const pulse = 0.55 + 0.45 * Math.sin(now / 150);
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, wide * 0.5);
    g.addColorStop(0, `rgba(255,180,120,${pulse})`);
    g.addColorStop(1, 'rgba(224,80,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, wide * 0.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(255,150,90,${0.4 + pulse * 0.4})`;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, 0, wide * 0.28, 0, TAU); ctx.stroke();
    return;
  }

  if (seg.kind === 'armored') {
    // brushed-steel ribs along the length
    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.lineWidth = 1;
    for (const xx of [-long * 0.22, 0, long * 0.22]) {
      ctx.beginPath();
      ctx.moveTo(xx, -wide * 0.34); ctx.lineTo(xx, wide * 0.34);
      ctx.stroke();
    }
    return;
  }

  if (K.regen && seg.hp < seg.maxhp) {
    const pulse = 0.3 + 0.3 * Math.sin(now / 180);
    ctx.strokeStyle = `rgba(180,120,220,${pulse})`;
    ctx.lineWidth = 2;
    roundRectPath(long + 5, wide + 5, 5);
    ctx.stroke();
    return;
  }

  if (K.railBonus) {
    // a reinforcing lattice over the whole plate, not one face — unlike
    // `shielded`'s directional plate, this reads as "armoured all around"
    // rather than "block this side"
    ctx.strokeStyle = 'rgba(150,235,255,.55)';
    ctx.lineWidth = 1;
    for (const xx of [-long * 0.22, 0, long * 0.22]) {
      ctx.beginPath();
      ctx.moveTo(xx, -wide * 0.36); ctx.lineTo(xx, wide * 0.36);
      ctx.stroke();
    }
    for (const yy of [-wide * 0.22, wide * 0.22]) {
      ctx.beginPath();
      ctx.moveTo(-long * 0.34, yy); ctx.lineTo(long * 0.34, yy);
      ctx.stroke();
    }
    return;
  }

  if (K.splits) {
    // hinge seam across the short axis, pulsing
    const pulse = 0.55 + 0.45 * Math.sin(now / 200);
    ctx.strokeStyle = `rgba(255,217,168,${pulse})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -wide * 0.4); ctx.lineTo(0, wide * 0.4);
    ctx.stroke();
    // interlock teeth
    ctx.fillStyle = `rgba(255,217,168,${pulse})`;
    for (const yy of [-wide * 0.2, wide * 0.2]) {
      ctx.beginPath(); ctx.arc(0, yy, 1.6, 0, TAU); ctx.fill();
    }
    return;
  }

  if (K.carries) {
    // a small chevron marking cargo
    ctx.strokeStyle = 'rgba(90,70,30,.7)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-long * 0.12, -wide * 0.18);
    ctx.lineTo(long * 0.12, 0);
    ctx.lineTo(-long * 0.12, wide * 0.18);
    ctx.stroke();
    return;
  }
}

// rounded rect at an offset (for sub-plates like the shield face)
function roundRectPathAt(cx, cy, w, h, r) {
  const x = cx - w / 2, y = cy - h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- render ---------- */
function draw() {
  ctx.clearRect(0, 0, W, H);
  const { path, pathLen, L } = world;

  // screen shake: translate everything, restored at the end of the frame
  ctx.save();
  if (world.shake > 0 && !reduce) {
    const m = world.shake * 9;
    ctx.translate((Math.random() - .5) * m, (Math.random() - .5) * m);
  }

  // road, widened from 26 alongside the bigger column and battery
  ctx.strokeStyle = 'rgba(63,174,143,.09)';
  ctx.lineWidth = 34; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  path.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.stroke();

  ctx.strokeStyle = 'rgba(224,80,60,.5)'; ctx.lineWidth = 1; ctx.setLineDash([7, 7]);
  ctx.beginPath(); ctx.moveTo(0, L.FLOOR); ctx.lineTo(W, L.FLOOR); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(224,80,60,.45)'; ctx.font = '9px "Chivo Mono",monospace';
  ctx.fillText('BREACH LINE', 12, L.FLOOR - 7);

  // A dark tether under the craft, so a chain reads as one linked formation
  // rather than loose tokens. Deliberately narrower than a craft now that
  // they no longer touch: it should look like something they are strung on,
  // not like a band they are embedded in.
  for (const ch of world.chains) {
    if (ch.segs.length < 2) continue;
    ctx.strokeStyle = 'rgba(8,15,18,.85)';
    ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < ch.segs.length; i++) {
      const sp = E.segPos(path, pathLen, ch, i);
      if (sp.off) { started = false; continue; }
      if (!started) { ctx.moveTo(sp.x, sp.y); started = true; }
      else ctx.lineTo(sp.x, sp.y);
    }
    ctx.stroke();
  }

  for (const ch of world.chains) {
    for (let i = ch.segs.length - 1; i >= 0; i--) {
      const seg = ch.segs[i], sp = E.segPos(path, pathLen, ch, i);
      if (sp.off) continue;
      const heading = E.segHeading(path, pathLen, ch, i);
      drawSegment(seg, sp, heading, i, ch.segs.length - 1);
    }
    if (ch.recoil > 0 && ch.segs.length) {
      const hp = E.segPos(path, pathLen, ch, 0);
      if (!hp.off) {
        ctx.strokeStyle = 'rgba(201,162,39,.55)'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(hp.x, hp.y, 22 + (reduce ? 0 : Math.sin(performance.now() / 120) * 3), 0, TAU);
        ctx.stroke();
      }
    }
  }

  // thumb rest: the band below the cannon. Marked out so it reads as a place
  // to hold rather than dead space, and kept dim so it never pulls the eye.
  if (world.L.THUMB > 0) {
    const top = H - world.L.THUMB;
    const g = ctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, 'rgba(11,20,24,0)');
    g.addColorStop(1, 'rgba(11,20,24,.55)');
    ctx.fillStyle = g;
    ctx.fillRect(0, top, W, world.L.THUMB);

    ctx.strokeStyle = 'rgba(99,121,127,.22)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(W, top); ctx.stroke();

    ctx.fillStyle = 'rgba(99,121,127,.5)';
    ctx.font = '10px "Chivo Mono",monospace';
    ctx.textAlign = 'center';
    ctx.fillText('HOLD & DRAG HERE', W / 2, top + 26);
    ctx.textAlign = 'left';
  }

  // catch band: the arc above the cannon where a falling pickup is claimed
  if (world.pickups.length) {
    ctx.strokeStyle = 'rgba(201,162,39,.28)';
    ctx.setLineDash([2, 6]); ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(world.cannon.x, world.cannon.y, E.CATCH_BAND, Math.PI, 0);
    ctx.stroke(); ctx.setLineDash([]);
  }

  // falling pickups
  for (const pu of world.pickups) {
    const P = E.POWERUPS[pu.kind];
    const fade = pu.life < 3 ? 0.35 + 0.65 * Math.abs(Math.sin(pu.life * 6)) : 1;
    ctx.globalAlpha = fade;

    ctx.beginPath(); ctx.arc(pu.x, pu.y, pu.r, 0, TAU);
    ctx.fillStyle = '#0f2027'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = P.col; ctx.stroke();

    ctx.fillStyle = P.col;
    ctx.font = '700 9px "Chivo Mono",monospace'; ctx.textAlign = 'center';
    ctx.fillText(P.name[0], pu.x, pu.y + 3.2);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // your ordnance is spherical, like everything on the defenders' side, and
  // it is the brightest thing on the board because it is the thing you aim.
  // Colour is baked onto the shot at fire time (engine.js's fireGun) rather
  // than read live off the battery here — a shot fired while cool must stay
  // the colour it was fired at, not flip to red mid-flight the instant the
  // streak climbs into Critical after it already launched.
  for (const p of world.shots) {
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    glowDot(ctx, p.x, p.y, p.r, p.col);
    glowDot(ctx, p.x, p.y, p.r * .5, '#ffffff');
  }
  for (const b of world.bits) {
    ctx.globalAlpha = Math.max(0, Math.min(1, b.life * 2));
    ctx.fillStyle = b.col; ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  // draw each gun in the battery, each angled toward the shared aim point
  const b = world.battery;
  const tp = E.aimPoint(world);
  for (const g of b.guns) {
    const gang = Math.atan2(tp.y - b.y, tp.x - g.x);
    const G = E.GUN_TYPES[g.type];
    ctx.save(); ctx.translate(g.x, b.y); ctx.rotate(gang);
    // barrel, tinted by gun type; greyed while locked, reddening with heat.
    // Scaled up from 10px tall / full b.len — feedback wanted the battery
    // bigger alongside the column and the road.
    ctx.fillStyle = g.locked > 0 ? '#4a5765'
      : g.heat > 0.6 ? '#e0774d' : G.col;
    ctx.fillRect(0, -6.5, b.len * 1.12, 13);
    ctx.fillStyle = '#0b1418'; ctx.fillRect(b.len * 1.12 - 6, -4, 4, 8);
    // railgun reads longer, mortar stubbier
    if (g.type === 'rail') { ctx.fillStyle = G.col; ctx.fillRect(b.len * 1.12, -2.5, 10, 5); }
    ctx.restore();

    // mount base — a darker offset face behind it first, the same
    // dark-body/lit-rim/offset-back depth cue the segments and Choke
    // Point's towers use
    const baseR = 18;
    ctx.beginPath(); ctx.arc(g.x + 3, b.y + 4, baseR, Math.PI, 0);
    ctx.fillStyle = '#0f1b20'; ctx.fill();

    ctx.beginPath(); ctx.arc(g.x, b.y, baseR, Math.PI, 0);
    ctx.fillStyle = '#23383f'; ctx.fill();
    ctx.beginPath(); ctx.arc(g.x, b.y, baseR, Math.PI, 0);
    ctx.strokeStyle = g.locked > 0 ? '#e0503c' : G.col; ctx.lineWidth = 2.4; ctx.stroke();

    // per-gun heat pip under the mount
    if (g.heat > 0.02) {
      ctx.fillStyle = g.heat > 0.85 ? '#e0503c' : '#3fae8f';
      ctx.fillRect(g.x - 15, b.y + 4, 30 * g.heat, 2.5);
    }
  }

  // aim guide runs from the battery centre through the aim point
  const cx = W / 2;
  ctx.strokeStyle = 'rgba(230,233,226,.13)'; ctx.setLineDash([3, 9]); ctx.lineWidth = 1;
  ctx.beginPath();
  let gx = cx, gy = b.y, gdx = Math.cos(b.ang), gdy = Math.sin(b.ang);
  ctx.moveTo(gx, gy);
  for (let seg = 0; seg < 2; seg++) {
    const tx = gdx > 0 ? (W - 6 - gx) / gdx : gdx < 0 ? (6 - gx) / gdx : Infinity;
    const ty = gdy < 0 ? (0 - gy) / gdy : Infinity;
    const t = Math.min(tx, ty, 900);
    gx += gdx * t; gy += gdy * t;
    ctx.lineTo(gx, gy);
    if (t !== tx || gy <= 0) break;
    gdx = -gdx;
  }
  ctx.stroke(); ctx.setLineDash([]);

  // convergence marker at the aim point when more than one gun is mounted
  if (b.guns.length > 1) {
    ctx.strokeStyle = 'rgba(255,217,168,.4)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(tp.x, tp.y, 7, 0, TAU); ctx.stroke();
  }

  // intercept marker: where the shot will actually meet the snake, accounting
  // for travel time. Without this the player is guessing the lead by feel.
  const hit = predictHit();
  if (hit) {
    // a blocked marker warns that the shot will glance off a plate
    ctx.strokeStyle = hit.blocked ? '#9fc4e8' : E.OD_TIERS[world.cannon.od].col;
    ctx.lineWidth = 1.5; ctx.globalAlpha = hit.blocked ? .6 : .85;
    if (hit.blocked) ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.arc(hit.x, hit.y, 11, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    if (!hit.blocked) {
      ctx.beginPath();
      ctx.moveTo(hit.x - 15, hit.y); ctx.lineTo(hit.x - 7, hit.y);
      ctx.moveTo(hit.x + 7, hit.y); ctx.lineTo(hit.x + 15, hit.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // muzzle flash on every gun on tap, so a press always reads as registered
  if (tapPulse > 0) {
    const tp2 = E.aimPoint(world);
    for (const g of world.battery.guns) {
      const gang = Math.atan2(tp2.y - world.battery.y, tp2.x - g.x);
      ctx.save(); ctx.translate(g.x, world.battery.y); ctx.rotate(gang);
      ctx.globalAlpha = tapPulse * .8;
      ctx.fillStyle = E.GUN_TYPES[g.type].col;
      ctx.beginPath(); ctx.arc(world.battery.len + 3, 0, 4 + tapPulse * 5, 0, TAU); ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }

  ctx.font = '700 13px "Chivo Mono",monospace'; ctx.textAlign = 'center';
  for (const f of world.floaters) {
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
    ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  ctx.restore();          // closes the shake transform
}

/* ---------- ui ---------- */
const GAME_ID = 'flak-battery';

function syncBest() {
  const b = best(GAME_ID);
  $('uiBest').textContent = b ? b.score : '—';
}

function sync() {
  $('uiWave').textContent = world.wave;
  $('uiScore').textContent = world.score;
  $('uiScrap').textContent = world.scrap;
  $('uiLives').textContent = world.lives;
  // how far this run got, for the cabinet's unlock gate. Recorded live rather
  // than at game over: reaching the wave is the achievement, and a player who
  // closes the tab mid-run has still reached it.
  recordProgress(GAME_ID, world.wave);
  const b = world.battery, T = E.OD_TIERS[b.od];
  const hottest = b.guns.reduce((m, g) => Math.max(m, g.heat), 0);
  const anyLocked = b.guns.some(g => g.locked > 0);
  $('heatFill').style.width = (hottest * 100) + '%';
  $('heatFill').style.background = anyLocked ? '#e0503c' : T.col;
  $('odLabel').textContent = anyLocked ? 'LOCKED' : (b.od ? `${T.name} ×${b.streak}` : '—');
  $('odLabel').style.color = anyLocked ? '#e0503c' : T.col;
  const fx = [];
  for (const k of Object.keys(world.effects)) {
    const P = E.POWERUPS[k];
    if (P) fx.push(`<span style="color:${P.col}">${P.name} ${world.effects[k].toFixed(1)}s</span>`);
  }
  if (world.shieldCharges > 0) {
    fx.push(`<span style="color:#e6e9e2">Shield ×${world.shieldCharges}</span>`);
  }
  $('fxbar').innerHTML = fx.join('');

  $('uiBuild').innerHTML = E.BRANCHES.map(b => {
    const t = world.upgrades[b];
    const pips = Array.from({ length: E.MAX_TIER }, (_, i) =>
      `<i class="${i < t ? 'on' : ''}"></i>`).join('');
    return `<span title="${E.UPGRADES[b].name}">${pips}</span>`;
  }).join('');
}
function showBanner(h, p, btn) {
  $('banner').classList.remove('hide');
  $('banner').querySelector('h2').textContent = h;
  $('hint').textContent = p;
  $('go').textContent = btn;
}
$('go').addEventListener('click', () => {
  $('shop').classList.remove('on');
  // Resuming after a rotation must NOT restart the run — the whole point is
  // that your place was kept. Only a finished or unstarted run resets.
  if (paused) paused = false;
  else if (world.over || !world.running) E.resetRun(world);
  world.running = true;
  started = true;
  $('banner').classList.add('hide');
  firing = false; drag = null;
  fitStage(); sync();
});

/* ---------- resuming an interrupted run ----------

   A serpent run is long, and a phone closes the app without warning. Saves are
   written on the quiet beats — when the shop opens between waves, and when the
   page is hidden — rather than every frame. */

let resumeOffered = false;
/* Set once the player has actually begun. Used instead of `world.running`,
   which goes false whenever a banner or the shop is up — and those paused
   states are exactly the ones most worth saving. */
let started = false;

function saveNow() {
  if (!started || world.over) { clearRun(GAME_ID); return; }
  saveRun(GAME_ID, E.snapshot(world), `Wave ${world.wave} · ${world.score}`);
}

// visibilitychange is what actually fires when a phone backgrounds an app;
// beforeunload is unreliable there.
addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
addEventListener('pagehide', saveNow);

(function offerResume() {
  const stored = loadRun(GAME_ID);
  if (!stored) return;
  resumeOffered = true;
  showBanner('Resume run?', `You left off at ${stored.label}.`, 'Continue');

  const fresh = document.createElement('button');
  fresh.type = 'button';
  fresh.textContent = 'New run';
  fresh.style.cssText = 'margin-left:8px;background:#1b3038;color:var(--bone)';
  fresh.addEventListener('click', () => {
    clearRun(GAME_ID);
    fresh.remove();
    resumeOffered = false;
    showBanner('Flak Battery', 'Hold to fire. Drag to aim.', 'Begin');
  });
  $('go').after(fresh);

  // capture, so this runs before the main handler decides to resetRun
  $('go').addEventListener('click', function once() {
    $('go').removeEventListener('click', once, { capture: true });
    if (!resumeOffered) return;
    resumeOffered = false;
    fresh.remove();
    if (E.hydrate(world, stored.snap)) {
      // the run is mid-flight, not unstarted: mark it running so the main
      // handler's "reset an unstarted run" branch does not wipe it
      world.running = true;
    } else {
      clearRun(GAME_ID);
      E.resetRun(world);
    }
    clearRun(GAME_ID);
    sync();
  }, { capture: true });
})();

fitStage(); syncBest(); sync();
requestAnimationFrame(frame);
</script>
