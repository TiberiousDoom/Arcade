<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Flak Battery</title>
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#0b1418">
<link rel="icon" href="../../shared/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../shared/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="stylesheet" href="../../shared/theme.css">
<script type="module" src="../../shared/pwa.js"></script>
<style>
  /* Flak Battery keeps the default brass accent on an 880-wide board, and
     adds the heat gauge, shop, and segment legend that only it has. */
  :root{
    --board-max:880px;
  }


  #uiBuild{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  #uiBuild span{display:flex;gap:1px;align-items:center}
  #uiBuild i{width:3px;height:8px;background:#1b3038;display:inline-block}
  #uiBuild i.on{background:var(--scale)}
  /* Nine branches is 45 marks. On a phone that is noise in a header that
     already carries six readouts, so it goes — the shop is where the tree is
     read, and this strip was only ever a glance. */
  @media (max-width:560px){ #uiBuild{display:none} }

  /* Active power-ups. This had *no CSS at all*: a bare div inside #stage, so it
     sat in normal flow below the canvas, added unmeasured height to the stage,
     and collided with the heat gauge (which is anchored to the stage's bottom,
     and so moved down with it). Its entries ran together too — several bare
     spans with no separation reading as one string.

     Anchored bottom-right now, out of flow entirely, opposite the heat gauge
     and stacked upward so a second effect grows away from the board's edge
     rather than into the first. */
  #fxbar{
    position:absolute;right:10px;bottom:12px;z-index:3;pointer-events:none;
    display:flex;flex-direction:column-reverse;align-items:flex-end;gap:4px;
    max-width:42%;
  }
  #fxbar span{
    font:700 10px/1 'Chivo Mono',monospace;letter-spacing:.08em;text-transform:uppercase;
    background:rgba(11,20,24,.82);border:1px solid currentColor;border-radius:3px;
    padding:4px 6px;white-space:nowrap;
  }

  #heat{position:absolute;left:12px;bottom:12px;width:min(150px,38vw)}
  #heatLabel{
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    margin-bottom:4px;display:flex;justify-content:space-between;
  }
  #heatLabel em{font-style:normal;color:var(--brass);font-weight:700}
  #heatTrack{height:7px;background:#0d1c22;border:1px solid var(--line);position:relative;overflow:hidden}
  #heatFill{position:absolute;inset:0 auto 0 0;width:0%;background:var(--scale);transition:background .18s linear}
  #heatTicks{position:absolute;inset:0;pointer-events:none}
  #heatTicks i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}


  /* segment legend, shown inside the help panel */
  #helpPanel .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:2px}
  #helpPanel .legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
  #helpPanel .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

  #shop{position:absolute;inset:0;display:none;flex-direction:column;
    background:rgba(11,20,24,.94);padding:18px 16px;overflow-y:auto;gap:12px}
  #shop.on{display:flex}
  /* Title and the two verbs on one line. They were three stacked bands — a
     title row, a rule, then a full-width Next Wave — which cost the top of the
     panel about a third of its height before a single upgrade was visible. */
  #shopHead{display:flex;align-items:center;gap:8px}
  #shopHead h2{font-family:'Archivo Black',sans-serif;font-size:clamp(15px,3.6vw,20px);
    text-transform:uppercase;letter-spacing:-.02em;flex:1 1 auto;min-width:0}
  /* Narrow, but still thumb-sized: the width comes off the padding and the
     letter-spacing, never off the 44px touch target. */
  #shopHead button{
    flex:0 0 auto;width:auto;margin:0;min-height:44px;padding:10px 12px;
    font-size:10px;letter-spacing:.08em;
  }
  #shopResearch{background:#16303a;color:#7fb6cf;border:1px solid var(--line)}
  #shopResearch.on{background:#7fb6cf;color:#06121f;border-color:#7fb6cf}
  @media (hover: hover) { #shopResearch:hover{background:#1d3d49} }
  @media (max-width:380px){
    /* below this the title starves the two buttons; give it the whole line */
    #shopHead{flex-wrap:wrap}
    #shopHead h2{flex:1 0 100%}
    #shopHead button{flex:1 1 0}
  }
  /* Cards scaled back: `minmax(180px)` fitted two per row on a phone and made
     each one tall enough that the shop needed scrolling to compare options.
     At 148px three fit, and the whole tree is visible at once — which is the
     point of a between-waves shop. `.buy`/`.chip` are untouched; they are
     thumb targets and are what set the card's minimum height. */
  /* The research screen is a grid of cards; the upgrade screen is a column of
     sections. It used to be one rule for both, and the upgrade side paid for
     it: the grouped sections (Ammunition, Thermal) span the full width, while
     the ungrouped Optics row and the barrels and refit blocks dropped into
     two-up cells beside each other — three sections that look nothing like the
     two above them and are squeezed into half the width while doing it. */
  #battery{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:7px}
  #branches{display:flex;flex-direction:column;gap:7px}
  /* Everything in the column is a full-width section, so the grid-spanning
     rules the group cards carry are simply inert here rather than wrong. */
  #branches > *{width:100%}
  /* …except the emplacement overview, which goes back to a grid (v45). The
     column was right for the *upgrade* screen — those are sections you read
     down — and wrong for the All view, which is six cards you compare against
     each other. Two across at MAX_MOUNTS 6 is the 2x3 it was. */
  #branches.overview{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
  #branches.overview > *{width:auto}
  @media (min-width:620px){
    /* three across once there is room, so a full battery is one glance */
    #branches.overview{grid-template-columns:repeat(3,1fr)}
  }
  /* A branch is a row, not a card: name and pips left, price right, nothing
     else. Nine cards each carrying a heading, a pip strip, a blurb paragraph
     and a full-width button was most of a screen of furniture for nine numbers.
     Qualified with `.branch` so this wins on specificity rather than on source
     order — `.branch` sets `flex-direction:column` and is declared after. */
  .branch.buyRow{flex-direction:row;align-items:center;justify-content:space-between;gap:8px;
    padding:6px 8px;min-height:58px;box-sizing:border-box}
  .branch.buyRow .rowHead{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 auto}
  .branch.buyRow h3{font-size:10px;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .branch.buyRow .pips{width:100%}
  /* Still a thumb target — the row got shorter, the tap area did not. */
  /* A fixed width, not a minimum. The button used to size to its own text, so
     the longest state in a list ("142 · −80") set the column for every row and
     the branch names beside them were ellipsised to fit. Fixed, the text column
     is the same on every row and nothing moves when a price changes. */
  .branch.buyRow .buy{width:76px;flex:0 0 76px;min-height:44px;padding:10px 6px;font-size:10px;
    display:flex;align-items:center;justify-content:center}
  /* current → next for the tier on offer, under the name and pips. Small and
     dim: it answers "is this worth 142 scrap" on the one glance you give it
     between waves, and must not turn the dense row back into a card. */
  .branch.buyRow .preview{display:flex;flex-wrap:wrap;gap:2px 10px}
  .preview .delta{font:600 9px/1.4 'Chivo Mono',monospace;color:var(--dim);letter-spacing:.04em;white-space:nowrap}
  .preview .delta i{font-style:normal;color:#5d7681}
  .preview .delta b{color:var(--brass);font-weight:700}
  .shopSection{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);
    border-bottom:1px solid var(--line);padding-bottom:5px;margin-top:4px}
  .assign{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}

  /* One tab per emplacement, plus the battery. Upgrades are per-gun, so the
     tabs are the only thing in the shop that says *which* gun you are
     spending on — they need to be unmissable and thumb-sized. Each carries
     its mount's own color, so "which of these is my railgun" is a glance. */
  /* Sticky, so moving between mounts stays possible while scrolled down a long
     tree — nine branches plus barrels and refit is taller than the panel. */
  /* The whole bar is what sticks — tabs on top, Next Wave beneath them, one
     background, one `top`. Sticky is on the wrapper rather than on each so the
     two cannot overlap. */
  #shopBar{position:sticky;top:-16px;z-index:2;background:rgba(11,20,24,.97);
    padding:6px 0 8px;display:flex;flex-direction:column;gap:6px}
  /* The thermal card: one heading over the rows that share the heat gauge. */
  .branchGroup{
    border:1px solid var(--line);border-radius:5px;
    padding:7px 8px 3px;margin-bottom:6px;
    grid-column:1/-1;
  }
  .branchGroup .groupName{
    margin:0 0 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);font-weight:700;
  }
  .branchGroup .buyRow{margin-bottom:4px}
  .branchGroup .buyRow:last-child{margin-bottom:0}
  /* The Refit card holds two blocks that are not buy rows — the barrel purchase
     and the type swap — so they need the same rhythm as the rows above them
     rather than the card padding they were designed against when they sat on
     their own. */
  .branchGroup .barrels,
  .branchGroup .retro{margin-bottom:4px;border:0;background:transparent;padding:4px 0 0}
  .branchGroup .barrels:last-child,
  .branchGroup .retro:last-child{margin-bottom:0}
  .openingSoon{
    margin:8px 2px 0;font-size:11px;color:var(--dim);text-align:center;
  }
  #shopRule{
    margin:0 0 8px;font-size:12px;line-height:1.45;color:var(--dim);
    border-left:2px solid var(--accent);padding-left:8px;
  }
  #shopTabs{display:flex;gap:5px;flex-wrap:wrap}
  #shopTabs:empty{display:none}
  #shopTabs.hidden{display:none}
  .tab{flex:1 1 0;min-width:62px;min-height:46px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;cursor:pointer;border-radius:3px;
    border:1px solid var(--line);background:#0f2027;color:var(--dim);padding:5px 4px}
  .tab b{font:700 13px/1 'Chivo Mono',monospace;color:var(--tab,var(--bone))}
  .tab span{font-size:8px;letter-spacing:.1em;text-transform:uppercase}
  .tab.on{border-color:var(--tab,var(--brass));background:#16303a;color:var(--bone)}
  /* The add-emplacement slot. Dashed, and narrower than a real tab: it is the
     empty space where the next gun goes, not a gun. Kept in the strip rather
     than hidden when unaffordable, so the price is always answerable and the
     strip never reflows out from under a thumb. */
  .tab.add{flex:0 1 54px;min-width:44px;border-style:dashed;color:var(--dim)}
  .tab.add b{color:var(--brass);font-size:17px;line-height:1}
  .tab.add:disabled{opacity:.4;cursor:default}
  @media (hover: hover) { .tab.add:not(:disabled):hover{border-color:var(--brass);background:#13272f} }

  /* The portrait spans the whole grid: it is the identity of the tab, not one
     card among four. */
  /* Art and numbers as one card. The columns are fixed fractions rather than
     content-sized, so every gun type gives the same layout however long its
     name or blurb is — a card that reflows per gun reads as a different card. */
  .gunCard{
    grid-column:1/-1;display:grid;grid-template-columns:44% 1fr;gap:10px;
    border:1px solid var(--line);background:#0b1a20;border-radius:5px;
    padding:8px;margin-bottom:8px;align-items:start;
  }
  .gunCard .portrait{grid-column:auto;border:0;background:none;padding:0;margin:0}
  .gunCard .statBlock{grid-column:auto;min-width:0}
  @media (max-width:340px){
    /* below this the two columns starve each other; stack rather than squeeze */
    .gunCard{grid-template-columns:1fr}
  }
  .portrait{grid-column:1/-1;border:1px solid var(--line);background:#0b1a20;
    border-radius:3px;padding:6px;display:flex;flex-direction:column;gap:4px}
  .portrait canvas{width:100%;height:auto;display:block}
  .portrait .caption{display:flex;flex-direction:column;gap:2px;padding:0 4px 2px}
  .portrait .caption b{font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .portrait .caption span{font-size:10px;color:var(--dim);line-height:1.45}
  .retro{grid-column:1/-1}

  /* Shop controls are thumb targets, not cursor targets. These were all sized
     for a mouse: .buy computed to ~28px tall and .chip was 26px square, both
     well under a comfortable tap. */
  .chip{min-height:34px;padding:8px 10px;border:1px solid var(--line);background:#0f2027;color:var(--dim);
    font:700 10px/1 'Chivo Mono',monospace;letter-spacing:.08em;text-transform:uppercase;
    cursor:pointer;border-radius:3px}
  .chip.on{background:var(--scale);color:#06201a;border-color:var(--scale)}
  .chip:disabled{opacity:.5;cursor:default}
  .chip.on:disabled{opacity:1}
  .branch{border:1px solid var(--line);background:#0f2027;padding:9px 10px;display:flex;flex-direction:column;gap:6px;text-align:left}
  .branch h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone);font-weight:700}
  /* no min-height: it reserved two lines for every blurb whether or not the
     text needed them, which padded out every card in the grid */
  .branch p{font-size:10px;color:var(--dim);line-height:1.45}
  .pips{display:flex;gap:3px}
  .pips i{flex:1;height:5px;background:#1b3038;border-radius:1px}
  .pips i.on{background:var(--scale)}
  .buy{width:100%;min-height:48px;padding:12px 10px;font:700 11px/1 'Chivo Mono',monospace;letter-spacing:.12em;
    text-transform:uppercase;border:0;cursor:pointer;background:var(--brass);color:#1a1405;border-radius:3px}
  /* "maxed" and "can't afford yet" are different states and used to look
     identical — the second is temporary, so it keeps a hint of the brass. */
  .buy:disabled{background:#1b3038;color:#4d6068;cursor:default}
  .buy.poor:disabled{background:#2a2416;color:#8a7645;border:1px solid #3d3520}
  /* A third state, and the reason it needs a look of its own: "maxed" and
     "locked behind research" are both disabled buttons, but one is the end of
     the road and the other is a signpost to the Research tab. Tinted toward
     the research color so the answer is where to go, not that you are done. */
  .buy.gated:disabled{background:#1a2b33;color:#7fb6cf;border:1px solid #2c4d5c}
  /* Research points are a different currency from scrap and must never be
     mistaken for it, so anything priced in RP is tinted rather than brass. */
  .buy.rp{background:#7fb6cf;color:#08181f}
  .buy.rp.poor:disabled{background:#17272e;color:#5d8a9d;border:1px solid #274049}
  /* a tier past what research has opened: visibly a slot, not merely unbought */
  .pips i.locked{background:#121e24;box-shadow:inset 0 0 0 1px #24363f}
  /* the research balance, at the top of the Research tab */
  .rpHead{grid-column:1/-1;display:flex;flex-direction:column;gap:3px;
    border:1px solid #2c4d5c;border-radius:3px;padding:8px 10px;background:#0d1e25}
  .rpHead b{font:700 15px/1 'Chivo Mono',monospace;color:#7fb6cf;letter-spacing:.1em}
  /* Sized like the menu's own buttons — it sits among them and is reached with
     a thumb, so it is a row rather than a line of link text. */
  .briefLink{
    display:flex;align-items:center;min-height:48px;padding:10px 14px;
    border:1px solid var(--line);border-radius:var(--btn-radius);background:#12222a;
    font:600 11px/1.3 'Chivo Mono',monospace;letter-spacing:.08em;text-transform:uppercase;
    color:var(--bone);text-decoration:none;
  }
  @media (hover: hover) { .briefLink:hover{background:#18303a;border-color:var(--dim)} }
  /* A rung of the research ladder that is not open yet. Dim but legible, and
     still card-shaped: it is telling you what the next fifty waves are for, so
     it must not read as a rendering accident. */
  .branch.locked{opacity:.5;border-style:dashed}
  .branch.wide{grid-column:1/-1}
  .lockNote{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#7fb6cf}
  .rpHead span{font-size:10px;color:var(--dim);line-height:1.45}
  /* The emplacement overview: one card per mount, the shop's opening view. */
  .empCard{
    grid-column:span 1;display:flex;flex-direction:column;gap:4px;
    border:1px solid var(--line);border-left:3px solid var(--tab,var(--line));
    background:#0b1a20;border-radius:3px;padding:6px;cursor:pointer;text-align:left;
  }
  @media (hover: hover) { .empCard:hover{background:#10242c;border-color:var(--tab,var(--brass))} }
  .empCard canvas{width:100%;height:auto;display:block}
  .empMeta{display:flex;flex-direction:column;gap:2px;padding:0 2px 2px}
  .empMeta b{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .empMeta span{font-size:9px;color:var(--dim);letter-spacing:.04em}
  /* How far this emplacement is built out — tiers bought over tiers available.
     It was live gun heat until v36, which is a real number about a gun that is
     not currently firing: it sat wherever the heat happened to be when the shop
     opened, so it read as a progress bar that moved at random and meant
     nothing here. Depth is what the card is actually about. */
  .empMeta .xpline{height:3px;background:#1b3038;border-radius:1px;overflow:hidden;margin-top:2px}
  .empMeta .xpline i{display:block;height:100%;background:var(--accent);transition:width .2s ease-out}
  .addCard{align-items:center;justify-content:center;border-style:dashed;
    border-left-style:dashed;min-height:110px;color:var(--dim)}
  .addCard b{font-size:22px;color:var(--brass);line-height:1}
  .addCard .cost{color:var(--brass)}
  .addCard:disabled{opacity:.4;cursor:default}

  /* a gun type's permanent marks, on its research card */
  .markRow{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--dim);
    letter-spacing:.1em;text-transform:uppercase}
  .markRow .pips{flex:1 1 auto;display:flex;gap:2px}
  .markRow .pips i{flex:1 1 0;height:4px;background:#1b3038;border-radius:1px}
  .markRow .pips i.on{background:#7fb6cf}
  .fitted{font-size:9px;color:var(--dim);letter-spacing:.06em}

  /* The resolved stat block on a mount's own tab. Two columns, fixed — it used
     to be an auto-fit grid of alternating dt/dd, so the column count floated
     with the panel width and a label could end up in one column with its value
     in the next. Each pair is now one cell with the label above the number. */
  .statBlock{grid-column:1/-1}
  .statBlock dl{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:2px}
  .statBlock .stat{display:flex;flex-direction:column;gap:1px;
    border-left:2px solid transparent;padding-left:6px}
  .statBlock dt{font-size:9px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
  .statBlock dd{font:700 12px/1.3 'Chivo Mono',monospace;color:var(--bone);margin:0}
  /* Buying an upgrade flashes the stat it moved. Nine numbers in a block and
     one of them ticking over is invisible otherwise. Same `.hit`-class-on-a-
     timer shape the lives strip used, and the same explicit reduced-motion
     opt-out: theme.css kills `transition` globally but not `animation`. */
  .statBlock .stat.bought{border-left-color:var(--brass);animation:statflash .9s ease-out 1}
  .statBlock .stat.bought dd{color:var(--brass)}
  @keyframes statflash{0%{background:rgba(201,162,39,.34)}100%{background:transparent}}
  @media (prefers-reduced-motion:reduce){.statBlock .stat.bought{animation:none}}

  /* Full width in the sticky bar: it is the one control that is always
     available and always the same answer, so it should never need hunting for. */
  /* width comes from #shopHead now — it is one of two buttons on the title
     line rather than a full-width band of its own */
</style>

<div id="shell">
  <header>
    <div class="titles">
      <a class="back" href="../../index.html">&larr; Arcade</a>
      <h1>Flak <span>Battery</span></h1>
    </div>
    <div class="meta">
      <div>Wave <b id="uiWave">1</b></div>
      <div>Score <b id="uiScore">0</b></div>
      <div>Scrap <b id="uiScrap">0</b></div>
      <div>Best <b id="uiBest">—</b></div>
      <div id="uiBuild"></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv" width="880" height="620"></canvas>
    <div id="heat">
      <div id="heatLabel"><span>Heat</span><em id="odLabel">—</em></div>
      <div id="heatTrack">
        <div id="heatFill"></div>
        <div id="heatTicks"><i style="left:40%"></i><i style="left:65%"></i><i style="left:85%"></i></div>
      </div>
    </div>
    <div id="shop">
      <!-- Title, the two verbs and the tabs share ONE sticky bar. Two
           `position:sticky` siblings both pinned to the same top overlap each
           other, and Next Wave used to be the last child of the scrolling
           panel — so leaving the shop meant scrolling past nine branch cards
           to find the button.
           The scrap readout that used to sit up here is gone: the HUD above
           the board already states it, and stating it twice on one screen made
           the header taller for a number that had not moved. -->
      <div id="shopBar">
        <div id="shopHead">
          <h2>Upgrade</h2>
          <button id="shopResearch">Research</button>
          <button id="shopGo">Next Wave</button>
        </div>
        <div id="shopTabs"></div>
      </div>
      <p id="shopRule">Spend scrap on this gun. Tiers last the run &mdash; one breach ends it.</p>
      <div id="branches"></div>
      <div id="battery"></div>
    </div>
    <div id="fxbar"></div>
    <div id="banner">
      <h2>Flak Battery</h2>
      <p id="hint">Drag to aim, hold to fire.</p>
      <button id="go">Begin</button>
    </div>
  </div>

  <footer>
    <span>Cut mid-chain to force recoil</span>
    <span>Head kills buy the most time</span>
    <span>Overheat locks the barrel</span>
  </footer>
</div>

<script type="module">
import * as E from './engine.js';
import { makeFit } from '../../shared/fit.js';
import { glowStroke, glowDot, glowDots, dim, inkDot, extrudeRect, extrudeDisc, GLOW_PASSES_CHEAP, DOT_PASSES_CHEAP } from '../../shared/glow.js';
import { best, submit } from '../../shared/scores.js';
import { recordProgress } from '../../shared/unlocks.js';
import { saveRun, loadRun, clearRun } from '../../shared/resume.js';
import { makeAudio } from '../../shared/audio.js';
import { makeMenu } from '../../shared/menu.js';
import { prefs, buzz } from '../../shared/prefs.js';

import { guardTaps } from '../../shared/tap.js';

/* A press slid off a button is a cancel, on every button in this shell.
   Touch gives the pointer implicit capture, so without this the click lands
   wherever the press began however far the finger went — see shared/tap.js. */
guardTaps();

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H;
const TAU = E.TAU;
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const $ = id => document.getElementById(id);

const audio = makeAudio();

/* effects live in the shell, not the engine. A kill or bomb bursts, so `burst`
   is a fair proxy for an impact sound; `push` carries the overdrive/overheat
   floaters, which double as the cue for those tones. Firing and breaches have
   no fx hook — the frame loop watches world state for them instead. */
/* Debris is capped. Nothing bounded it before, and the death path can spawn in
   bulk: a chain decapitation bursts once per segment, a bomb kills everything
   in its radius in one synchronous loop. Measured peak was 181 alive in normal
   wave-20 fighting and far more on those two events. Oldest-first eviction, so
   what gets dropped is the debris already fading out. */
const MAX_BITS = 260;

/* One hit sound per frame, not per kill. `audio.hit()` builds five Web Audio
   nodes (an oscillator + gain, and a buffer source + biquad + gain), and
   decapitating a 40-segment chain called it 40 times in one frame — 200 nodes
   constructed on the main thread, for a sound that is one thud either way. */
let hitPending = false;

const fx = {
  burst(x, y, col, n = 10) {
    hitPending = true;
    if (reduce) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, sp = 40 + Math.random() * 140;
      world.bits.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .35 + Math.random() * .4, col });
    }
    if (world.bits.length > MAX_BITS) world.bits.splice(0, world.bits.length - MAX_BITS);
  },
  push(txt, x, y, col) {
    world.floaters.push({ txt, x, y, col, life: .9 });
    if (txt === 'OVERHEAT') audio.overheat();
    else if (txt === 'WARM' || txt === 'HOT' || txt === 'CRITICAL') audio.overdrive();
  },
  // one blip per volley, however many barrels loosed — the engine calls this
  shot() { audio.fire(); },
};

/* Portrait phones get a tall board plus an empty band beneath the cannon:
   somewhere to rest and drag a thumb without covering the play area. Landscape
   uses the wide board and the side gutters. Re-picked whenever the phone
   turns — see applyLayout. */
/* Portrait-only since 2026-07-27: landscape didn't feel right on a real phone.
   Every board uses the tall layout regardless of orientation. The rotation
   machinery below is left intact but inert (applyLayout early-returns because
   the layout never changes) — flip this flag back to false to restore
   landscape without re-deriving anything. */
const PORTRAIT_ONLY = true;
const pickLayout = () =>
  (PORTRAIT_ONLY || matchMedia('(max-aspect-ratio: 4/5)').matches) ? E.LAYOUT_TALL : E.LAYOUT;

/* Which input this device aims with decides which correction the engine
   applies: touch gets a wider hit radius, mouse gets a traverse cap. Declared
   here rather than beside the pointer handlers because the world needs it. */
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;

/* Power-up drops are off by default and switchable from the settings menu —
   an experiment in how the game plays without them, so it needs to be
   flippable on a phone without a redeploy. Guarded storage, same shape as
   Feedline's input settings and shared/scores.js. */
const DROPS_KEY = 'arcade:flak-battery:drops';
function readDrops() {
  // on unless explicitly turned off — they are a good part of the game, and
  // defaulting them off hid them behind a switch nobody had reason to find
  try { return localStorage.getItem(DROPS_KEY) !== '0'; } catch { return true; }
}
function writeDrops(v) { try { localStorage.setItem(DROPS_KEY, v ? '1' : '0'); } catch {} }

/* ---------- research: the progression that outlives a run ----------

   Same division of labour as Choke Point's armory: the engine holds the
   research on the world so it stays the only thing that decides what is
   buyable, and the *shell* is what loads and saves it. The key is local rather
   than in `shared/` because Flak Battery is the only game with a research tree;
   promote it if a second one ever wants the same shape.

   Reads go through the engine's `sanitizeResearch`, so a hand-edited or
   half-written value degrades to an empty tree rather than handing out tiers no
   shop could sell. */
const RESEARCH_KEY = 'arcade:flak-battery:research';
function readResearch() {
  try { return E.sanitizeResearch(JSON.parse(localStorage.getItem(RESEARCH_KEY) || 'null')); }
  catch { return E.newResearch(); }
}
function writeResearch(r) {
  try { localStorage.setItem(RESEARCH_KEY, JSON.stringify(r)); } catch {}
}

const world = E.createWorld({
  fx, layout: pickLayout(), assist: isTouch, drops: readDrops(), research: readResearch(),
});
E.spawnWave(world);

const board = { w: world.L.W, h: world.L.H };   // makeFit re-reads this

function adoptLayout() {
  W = world.L.W; H = world.L.H;
  board.w = W; board.h = H;
  cv.width = W; cv.height = H;
  document.documentElement.style.setProperty('--board-max', W + 'px');
}
adoptLayout();

/* ---------- input ---------- */
let keys = {}, firing = false;
/* One loss cue per run. The breach sound used to be derived from the life count
   dropping; with lives gone there is no counter to watch, so this latches on
   `world.over` instead and clears when a run restarts. */
let overCued = false;
let paused = false;      // set when a rotation pauses a run in progress

function stagePt(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
/* Mouse aim is absolute, so the cursor sets a *desired* angle and the frame
   loop swings the battery toward it at the turret's traverse rate. Snapping
   straight to the cursor is what made mouse play trivially easy. */
let aimTarget = null;
function aimAt(p) {
  aimTarget = E.clampAim(Math.atan2(p.y - world.cannon.y, p.x - world.cannon.x));
}

/* Touch aiming, in two modes split by the breach line.

   BELOW the line — the band holding the battery and the thumb rest — is the
   original relative drag: the angle follows how far you move, not where you
   are, so you can hold low and never cover the board.

   ABOVE the line, on the playfield itself, the guns simply point where your
   finger is. If you have already reached into the play area then your hand is
   over the board regardless, and at that point relative dragging is strictly
   worse than saying "there". The traverse cap still applies (it goes through
   `aimTarget`, the same path mouse aiming uses), so the battery swings rather
   than snapping — you cannot teleport aim by tapping across the screen.

   The line is `FLOOR`, which is the same line a craft breaches at, so the rule
   is one a player can see rather than an invisible band. */
let drag = null;

const abovePlay = (p) => p.y < world.L.FLOOR;

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  if (e.pointerType === 'mouse') { aimAt(stagePt(e)); firing = true; return; }

  const p = stagePt(e);
  firing = true;
  E.queueShot(world);          // the press itself always produces a shot
  tapPulse = 1;
  if (abovePlay(p)) { aimAt(p); drag = null; }   // point-at aiming
  else { drag = { x: e.clientX, t: performance.now() }; aimTarget = null; }
});

cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { if (firing || !isTouch) aimAt(stagePt(e)); return; }
  if (!firing) return;
  const p = stagePt(e);
  // crossing the line mid-gesture switches modes, which is what you would
  // expect from a rule stated as "above the line" rather than "if you started
  // above it" — and it lets a thumb drag up into the field to fine-aim
  if (abovePlay(p)) { aimAt(p); drag = null; return; }
  if (!drag) { drag = { x: e.clientX, t: performance.now() }; aimTarget = null; return; }
  const now = performance.now();
  const dx = e.clientX - drag.x;
  const dt = Math.max((now - drag.t) / 1000, 1e-3);
  world.cannon.ang = E.clampAim(world.cannon.ang + E.aimDelta(dx, dt));
  aimTarget = null;            // a drag takes over; stop chasing an old cursor
  drag.x = e.clientX; drag.t = now;
});

function endPointer(e) {
  if (e.pointerType === 'mouse') { firing = false; return; }
  drag = null; firing = false;
}
addEventListener('pointerup', endPointer);
addEventListener('pointercancel', endPointer);

/* Belt and braces on top of the CSS: a long press must not start a selection
   or open the context menu mid-game. Scoped to the game surface so normal
   page behavior survives on desktop. */
for (const ev of ['selectstart', 'contextmenu', 'dragstart']) {
  cv.addEventListener(ev, e => e.preventDefault());
}
// a drag that starts on the board can still paint a selection across the
// header, so cancel any selection that begins while a touch is down
document.addEventListener('selectstart', e => { if (drag) e.preventDefault(); });

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); firing = true; }
});
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space') firing = false; });

if (isTouch) document.body.classList.add('touch');

/* The trim buttons are gone — they ate scarce screen for a job the drag now
   does well enough on its own, so there is no furniture below the board and
   `extra` is unnecessary. */
const fitStage = makeFit({ canvas: cv, stage: $('stage'), board });

/* Rotating the phone moves the run onto the other board. Chains are positioned
   by arc-length, so scaling by the ratio of path lengths puts every segment at
   the same fraction of its journey; wave, score, scrap, upgrades and the
   battery all carry over. */
function applyLayout() {
  const L2 = pickLayout();
  if (L2 === world.L) return;
  const wasRunning = world.running;
  E.relayout(world, L2);
  adoptLayout();
  fitStage();
  sync();
  if (wasRunning) {
    world.running = false;
    paused = true;                 // so Resume does not restart the run
    showBanner('Turned', 'Your run is where you left it.', 'Resume');
    $('banner').classList.remove('hide');
  }
}
addEventListener('resize', applyLayout);
addEventListener('orientationchange', () => setTimeout(applyLayout, 200));

// settings panel content for the shared menu's `extra` slot
const settingsEl = document.createElement('div');
settingsEl.className = 'menuSettings';
settingsEl.innerHTML = `
  <h3>Settings</h3>
  <!-- A page rather than another panel: it is a thing you read once and come
       back to, not a control. \`pagehide\` saves the run on the way out, so
       leaving to read it and coming back offers Continue like any other
       interruption. -->
  <a class="briefLink" href="./briefing.html">Briefing &mdash; guns and power-ups &rarr;</a>
  <label><input type="checkbox" id="dropsToggle"${world.drops ? ' checked' : ''}> Power-up drops</label>
  <p class="settingNote">On by default. Applies from the next carrier destroyed.</p>
  <p class="settingNote" id="rpNote"></p>
  <button type="button" id="wipeResearch">Reset research</button>
`;
/* Queried through `settingsEl`, not `document`: this element is detached until
   makeMenu mounts it, so a getElementById here finds nothing. Same trap Choke
   Point's settings panel documents. */
settingsEl.querySelector('#dropsToggle').addEventListener('change', e => {
  writeDrops(e.target.checked);
  // apply live too, so a player who flips it mid-run sees it from the next
  // carrier kill rather than having to restart to find out
  world.drops = e.target.checked;
});

const rpNote = settingsEl.querySelector('#rpNote');
const wipeResearch = settingsEl.querySelector('#wipeResearch');
function syncResearchNote() {
  const known = Object.values(world.research.guns).filter(Boolean).length;
  const depth = E.BRANCHES.reduce((a, b) => a + world.research.depth[b], 0);
  rpNote.textContent = `${world.research.points} RP · ${known} guns · ${depth} tiers.`;
}
syncResearchNote();

wipeResearch.addEventListener('click', () => {
  // Two taps, because it throws away every run's worth of research and there is
  // no getting it back. Copied from Choke Point's armory reset, deliberately —
  // the two controls destroy the same kind of thing and should behave alike.
  if (wipeResearch.dataset.armed !== '1') {
    wipeResearch.dataset.armed = '1';
    wipeResearch.textContent = 'Really reset? Tap again';
    setTimeout(() => {
      wipeResearch.dataset.armed = ''; wipeResearch.textContent = 'Reset research';
    }, 4000);
    return;
  }
  wipeResearch.dataset.armed = ''; wipeResearch.textContent = 'Reset research';
  world.research = E.newResearch();
  world.gunUnlocks = { auto: false, rail: false, mortar: false, ion: false };
  writeResearch(world.research);
  syncResearchNote();
  sync();
});

const pause = makeMenu({
  stage: $('stage'),
  host: document.querySelector('header'),
  audio,
  extra: settingsEl,
  title: 'Flak Battery',
  lore: 'They came down in one unbroken column. This is the last emplacement still firing.',
  rows: [
    ['Aim', 'Press and drag. Flick to swing across.'],
    ['Fire', 'Hold. Too much overheats.'],
    ['Overdrive', 'Consecutive hits build it. A miss cools it.'],
  ],
  notes: [
    'Cutting mid-column shoves the formation back.',
    'Plated craft glance shots off the front — hit the flank, or fire ion.',
    'The command ship is shielded by its escort. Drop it and the column goes.',
    'Deep runs arrive with a swarm escort flying over the column. Rounds that meet it are spent on it.',
    'Scrap is spent this run. Research points are kept, and buy guns and deep tiers.',
    'Keyboard: arrows and Space.',
  ],
});

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;

  if (world.running && !pause.paused) {
    const c = world.cannon;
    let kb = 0;
    if (keys.ArrowLeft) kb -= 1;
    if (keys.ArrowRight) kb += 1;
    if (kb) { c.ang = E.clampAim(c.ang + kb * 2.0 * dt); aimTarget = null; }
    // swing toward the cursor at the turret's traverse rate (mouse aiming)
    else if (aimTarget !== null) c.ang = E.slewAim(c.ang, aimTarget, dt);

    if (tapPulse > 0) tapPulse = Math.max(0, tapPulse - dt * 4);

    E.step(world, dt, firing);
    // however many kills this frame produced, that is one thud
    if (hitPending) { hitPending = false; audio.hit(); }
    // a breach ends the run outright now, so there is one cue, not two
    if (world.over && !overCued) { overCued = true; audio.lose(); }

    if (world.over) {
      clearRun(GAME_ID);          // a finished run is not one to come back to
      const r = submit(GAME_ID, world.score, `Wave ${world.wave}`);
syncBest();
      /* The run's research is banked here, at the end, and written straight to
         storage. Paying at the end rather than per wave is what stops a good
         opening being farmed by restarting; `awardResearch` is idempotent, so
         a re-render of this screen cannot pay twice. */
      const rp = E.awardResearch(world);
      writeResearch(world.research);
      const banked = rp > 0 ? ` · +${rp} research` : '';
      showBanner('Battery Down',
        (r.record ? `New best — ${world.score}, wave ${world.wave}`
                  : `Score ${world.score} · Wave ${world.wave} · best ${r.best}`) + banked,
        'Try again');
    }
    else if (world.shopOpen && !$('shop').classList.contains('on')) { saveNow(); openShop(); }
    sync();
  }
  draw();
  requestAnimationFrame(frame);
}

let tapPulse = 0;

/* Where the battery's rounds will actually meet the column.
 *
 *  One marker was right while every mount fired at the same speed, and became
 *  a lie the moment they did not: it marched the *fastest* gun's round, so a
 *  battery holding a Railgun (x1.7) and a Mortar (x0.75) was shown one
 *  intercept that only one mount would ever honour. Reported at v45 as the
 *  crosshair being confusing with mixed velocities — it was not confusing, it
 *  was wrong for most of the guns.
 *
 *  So it reports one intercept per distinct round speed, and the shell draws
 *  the spread. A uniform battery therefore looks exactly as it always did (one
 *  marker), and a mixed one is told the truth: your volley arrives in a spread,
 *  and here is where each part of it lands.
 *
 *  Marched by *distance* rather than by time, which is what makes several
 *  speeds affordable: every round flies the same ray from the same muzzle, so
 *  the geometry is walked once and each speed simply reaches a given point at
 *  its own time `d / speed`. Walking it once per speed would multiply the whole
 *  march; this multiplies only the segment test. */
const AIM_STEP = 7;              // px between samples along the ray
const AIM_MAX_GROUPS = 3;        // distinct speeds worth drawing at once

/** The distinct round speeds on the battery, commonest first, with a colour.
 *  Speeds are bucketed: two mounts a few px/s apart are one marker, not two
 *  markers a pixel apart pretending to be information. */
function aimGroups() {
  const by = new Map();
  for (const g of world.battery.guns) {
    /* The gun type's own multiplier belongs in here, and leaving it out is what
       made the whole marker wrong on a mixed battery: `stats()` returns what
       the *branches* bought, and `fireGun` multiplies that by `gunStats().spd`
       before the round ever moves. Read without it, a Mortar (x0.75) and a
       Railgun (x1.7) both reported 520 and collapsed into one group — one
       marker again, for three guns that arrive at three different times. */
    const sp = E.stats(world, g).shotSpeed * E.gunStats(world, g.type).spd;
    const key = Math.round(sp / 25);
    const got = by.get(key);
    if (got) { got.n++; if (got.type !== g.type) { got.type = null; got.arc = false; } }
    else by.set(key, { speed: sp, n: 1, type: g.type, arc: !!E.GUN_TYPES[g.type].arc });
  }
  return [...by.values()]
    .sort((a, b) => b.n - a.n || b.speed - a.speed)
    .slice(0, AIM_MAX_GROUPS)
    .map(x => ({ ...x, col: x.type ? E.GUN_TYPES[x.type].col : '#e6e9e2' }));
}

function predictHits() {
  const c = world.cannon;
  const groups = aimGroups();
  if (!groups.length) return [];
  const pending = groups.map(g => ({ ...g, hit: null, done: false }));
  const fastest = Math.max(...groups.map(g => g.speed));
  const maxD = fastest * E.AIM_LEAD;

  let x = c.x + Math.cos(c.ang) * c.len;
  let y = c.y + Math.sin(c.ang) * c.len;
  let dx = Math.cos(c.ang), dy = Math.sin(c.ang);

  for (let d = 0; d < maxD; d += AIM_STEP) {
    x += dx * AIM_STEP; y += dy * AIM_STEP;
    if (x < 6) { x = 6; dx = -dx; }
    if (x > W - 6) { x = W - 6; dx = -dx; }
    if (y < -20 || y > H + 20) break;

    for (const p of pending) {
      if (p.done) continue;
      /* A lobbed round is over the column until it arms, so a mortar's marker
         must not promise a hit inside `MORTAR_ARM` — that band is precisely
         what the gun cannot touch, and it is the reason to own one. */
      if (p.arc && d < E.MORTAR_ARM) continue;
      const t = d / p.speed;
      if (t > E.AIM_LEAD) { p.done = true; continue; }

      for (const ch of world.chains) {
        /* `E.RECOIL_RATE`, not a copy of it: this was a hardcoded 2.4 left
           behind when the engine's rate changed to 1.3, so the marker
           mispredicted against any chain being pushed back — which is every
           chain you are actively cutting into. */
        const s = ch.recoil > 0
          ? ch.s - Math.min(ch.recoil, ch.speed * E.RECOIL_RATE * t)
          : ch.s + ch.speed * t;
        for (let i = 0; i < ch.segs.length; i++) {
          const q = E.atS(world.path, world.pathLen, s - i * ch.spacing);
          if (q.off) continue;
          if (Math.hypot(x - q.x, y - q.y) < ch.segs[i].r + 3.2) {
            // a round that would glance off the plate is not a hit, so the
            // marker must not promise one. Heading is sampled at the segment's
            // *predicted* position, not its current one.
            const sAt = s - i * ch.spacing;
            const a2 = E.atS(world.path, world.pathLen, Math.max(0.01, sAt - 4));
            const b2 = E.atS(world.path, world.pathLen, Math.min(world.pathLen - 0.01, sAt + 4));
            const m = Math.hypot(b2.x - a2.x, b2.y - a2.y) || 1;
            const h = { x: (b2.x - a2.x) / m, y: (b2.y - a2.y) / m };
            const blocked = E.isDeflected(ch.segs[i], h, dx * p.speed, dy * p.speed);
            p.hit = { x: q.x, y: q.y, blocked, col: p.col, n: p.n };
            p.done = true;
            break;
          }
        }
        if (p.done) break;
      }
    }
    if (pending.every(p => p.done)) break;
  }
  return pending.filter(p => p.hit).map(p => p.hit);
}

/* ---------- shop ----------

   Tabbed, one tab per emplacement plus a battery-wide one. Upgrades are
   per-gun since v27, so a single flat list would have had no way to say
   *which* gun it was spending on — and with five mounts and four branches
   there is far too much to show at once anyway. Each mount's tab carries its
   own portrait, its own four branches, and its own retrofit row. */
/** Which view the shop is showing.
 *  `OVERVIEW` — a card per emplacement, and where the shop opens.
 *  `RESEARCH` — the between-runs screen.
 *  0..n-1     — one mount's own tree. */
const OVERVIEW = -2, RESEARCH = -1;
let shopTab = OVERVIEW;

/* `bought` is the branch just purchased, if any. The whole `#branches` subtree
   is rebuilt on every buy, so the stat row to flash does not exist until after
   the rebuild — it has to be found and marked here, at the end, rather than
   touched before. */
function renderShop(bought) {
  /* The board gets "Drag to aim, hold to fire"; the shop had no equivalent, and
     neither rule the whole economy hangs on was stated anywhere. Shown only to
     a player who has never finished a run, and gone for good after that. */
  $('shopRule').style.display = E.experience(world) <= 2 ? '' : 'none';
  // a mount can be sold out from under the tab by a reset
  if (shopTab >= world.battery.guns.length) shopTab = OVERVIEW;

  renderTabs();
  const host = $('branches');
  host.innerHTML = '';

  // the overview is a grid of cards to compare; every other view is a column of
  // sections to read down
  host.classList.toggle('overview', shopTab === OVERVIEW);
  if (shopTab === OVERVIEW) { $('battery').style.display = 'none'; renderOverview(host); return; }
  if (shopTab === RESEARCH) { $('battery').style.display = ''; renderBattery(); return; }
  $('battery').style.display = 'none';

  const gun = world.battery.guns[shopTab];
  const G = E.GUN_TYPES[gun.type];

  /* One card: the gun's portrait beside its resolved numbers.

     They were two stacked blocks, which put a picture between the player and
     the only thing on the screen that answers "is this mount any good". Side by
     side, the drawing labels the numbers and the numbers explain the drawing,
     and the pair costs about the height the portrait alone used to. The gun is
     drawn raised (see PORTRAIT_ANGLE) so it fits a tall narrow column rather
     than the wide letterbox it needed lying flat. */
  const card = document.createElement('div');
  card.className = 'gunCard';
  const port = document.createElement('div');
  port.className = 'portrait';
  const pc = document.createElement('canvas');
  pc.width = PORTRAIT_W; pc.height = PORTRAIT_H;
  port.appendChild(pc);
  const cap = document.createElement('div');
  cap.className = 'caption';
  cap.innerHTML = `<b style="color:${G.col}">${G.name}</b><span>${gunBlurb(gun.type)}</span>`;
  port.appendChild(cap);
  card.appendChild(port);
  card.appendChild(renderGunStats(gun));
  host.appendChild(card);
  drawCannonPortrait(pc.getContext('2d'), gun.type, E.barrelsOf(gun));

  /* This mount's branches — only the ones the branch ramp has opened, and
     with the thermal three inside a single card (see THERMAL). */
  const open = E.openBranches(world);
  const groupHosts = new Map();
  for (const b of open) {
    const U = E.UPGRADES[b];
    const tier = gun.upgrades[b];
    const cap = E.tierCap(world, b);
    const cost = E.upgradeCost(gun.upgrades, b, cap);
    // "maxed" now covers two different walls, and they must not read alike:
    // out of tiers altogether, or out of *researched* tiers. Telling the player
    // "Maxed" when the answer is "go and research it" is the worse failure.
    const maxed = cost === null;
    const gated = maxed && tier < E.MAX_TIER;
    const afford = E.canAfford(world, shopTab, b);

    /* One dense row per branch: name and pips on the left, the price button on
       the right. It was a card — heading, pip strip, a blurb paragraph and a
       full-width button — nine of which is a wall of text between waves, and
       the blurb is the part you only need the first time. It moves to `title`,
       so it is still reachable and no longer in the way. */
    const el = document.createElement('div');
    el.className = 'branch buyRow';
    el.title = U.blurb;

    // pips past the researched cap are drawn as locked rather than merely
    // unbought, so how far this branch can currently go is visible at a glance
    const pips = Array.from({ length: E.MAX_TIER }, (_, i) =>
      `<i class="${i < tier ? 'on' : i >= cap ? 'locked' : ''}"></i>`).join('');

    /* What the next tier actually buys, as current → next. The pips say how
       *deep* the branch is; they never said what a tier is worth, so deciding
       between nine branches meant buying one to find out. Read straight off
       `UPGRADES[b].tiers` — the same numbers `stats()` folds — so it cannot
       drift from what the purchase does, and every key in the tier object is
       shown, which is what covers Munitions moving two. */
    const next = { ...gun.upgrades, [b]: tier + 1 };
    const keys = [...(PREVIEW_DERIVED[b] || []), ...Object.keys(U.tiers[tier])];
    const preview = (!maxed && U.tiers[tier + 1])
      ? keys.map(k =>
          `<span class="delta"><i>${statLabel(k)}</i> ${statDisplay(gun, k)} → <b>${statDisplay(gun, k, next)}</b></span>`).join('')
      : '';

    el.innerHTML = `<div class="rowHead"><h3>${U.name}</h3><div class="pips">${pips}</div>` +
      (preview ? `<div class="preview">${preview}</div>` : '') + `</div>`;

    const btn = document.createElement('button');
    btn.className = 'buy' + (gated ? ' gated' : (!maxed && !afford ? ' poor' : ''));
    /* The price, and nothing else.
    
       It used to append the shortfall ("142 · −80"), which was well meant and
       cost more than it gave: the button is sized to its text, so the widest
       state of every row set the column width, squeezing the branch name and
       its preview into an ellipsis. The scrap you hold is already on screen at
       the top of the panel, permanently, and "can't afford" is carried by the
       disabled styling. */
    btn.textContent = gated ? 'Research' : maxed ? 'Max' : `${cost}`;
    btn.disabled = maxed || !afford;
    el.appendChild(btn);
    if (!gated) {
      btn.addEventListener('click', () => {
        if (E.buyUpgrade(world, shopTab, b)) { buzz(15); renderShop(b); sync(); }
      });
    }

    /* The thermal branches go inside one card rather than beside the others.
       All three move the same gauge, and as three of nine sibling rows they
       read as three unrelated bets — one of which you buy, see nothing happen,
       and conclude the shop is decorative. Grouped, heat is one system with
       three knobs. **UI only**: `stats()` folds over BRANCHES and a test pins
       one-stat-per-branch, so merging them in the engine would cost real
       structure to fix a presentation problem. */
    /* Grouped branches go inside one card, built the first time one of its
       members is reached and reused after. Ungrouped ones sit on their own, so
       a group of one never becomes a heading with a single row under it. */
    const grp = groupOf(b);
    if (grp) {
      let rows = groupHosts.get(grp.name);
      if (!rows) {
        const card = document.createElement('div');
        card.className = 'branchGroup';
        card.innerHTML = `<h3 class="groupName">${grp.name}</h3>`;
        rows = document.createElement('div');
        rows.className = 'groupRows';
        card.appendChild(rows);
        host.appendChild(card);
        groupHosts.set(grp.name, rows);
      }
      rows.appendChild(el);
    } else {
      host.appendChild(el);
    }
  }

  /* What the next wave opens, named before it arrives, so a new branch reads
     as something earned rather than as a row that silently appeared. */
  const soon = nextBranchOpening();
  if (soon) {
    const note = document.createElement('p');
    note.className = 'openingSoon';
    note.textContent = soon;
    host.appendChild(note);
  }

  /* Barrels and the type swap join Optics inside the Refit card, rather than
     trailing after the tree as two loose blocks. All three answer "what is this
     mount", which is a different question from "what does its round do". */
  const refit = groupHosts.get('Refit');
  if (refit) {
    refit.appendChild(renderBarrels(gun));
    refit.appendChild(renderRetrofit(gun));
  } else {
    // Optics is not open yet, so the card does not exist — the two still have
    // to go somewhere, and the tail of the tree is where they used to live
    host.appendChild(renderBarrels(gun));
    host.appendChild(renderRetrofit(gun));
  }

  if (bought) flashStat(host, bought);
}

/** Is there any research to look at? True once a run has ended — that is the
 *  event that pays RP and the moment the system starts existing — or if
 *  anything has already been earned or bought.
 *
 *  Finishing a run is checked *first and separately* from the points balance:
 *  points hit zero again every time they are spent, and a tab that vanished
 *  when a player bought something with it would be far worse than one that
 *  showed up early. */
function hasResearch() {
  const r = world.research;
  if (!r) return false;
  if ((r.best ?? 1) > 1) return true;
  if (r.points > 0) return true;
  if (Object.values(r.guns || {}).some(Boolean)) return true;
  if (Object.values(r.depth || {}).some(v => v > 0)) return true;
  return Object.values(r.marks || {}).some(v => v > 0);
}

/* How the branches are grouped in the shop.

   Editorial, not derived — the grouping is a claim about what a player thinks
   of as one system, which is not something the tables know. Eight rows in a
   flat list is a wall; three headings is a menu.

   **Ammunition** is what the round is and does: how hard it hits, how big it
   is, how fast it flies, and what it does after first contact.
   **Thermal** is the heat gauge, whose three branches are otherwise the most
   confusable rows in the shop — all three move one bar, in near-identical
   language, at near-identical prices.
   Optics is deliberately left ungrouped: it is the only branch about *range*,
   and a group of one is a heading with nothing to organize. */
const BRANCH_GROUPS = [
  { name: 'Ammunition', of: ['calibre', 'velocity', 'munitions'] },
  { name: 'Thermal',    of: ['cooling', 'breech', 'interlock'] },
  /* Refit is what the gun *is*, rather than what it fires: how far it shoots,
     how many barrels it shoots from, and which gun it is at all. Optics used to
     stand alone here on the grounds that a group of one is a heading with
     nothing to organise — which was true while it was alone, and stopped being
     true the moment barrels and the type swap joined it (v45). Those two are
     built by their own renderers rather than from `UPGRADES`, so the group is
     assembled by hand below; this entry is what puts Optics inside it. */
  { name: 'Refit',      of: ['optics'] },
];

/** The group a branch belongs to, or null if it stands alone. */
const groupOf = (b) => BRANCH_GROUPS.find(g => g.of.includes(b)) || null;

/** "Velocity opens at wave 5" for the next branch still to come, or null once
 *  the tree is fully met. Reads BRANCH_UNLOCK so it cannot drift from the gate. */
function nextBranchOpening() {
  const at = E.experience(world);
  const pending = E.BRANCHES
    .filter(b => E.BRANCH_UNLOCK[b] > at)
    .sort((a, b) => E.BRANCH_UNLOCK[a] - E.BRANCH_UNLOCK[b]);
  if (!pending.length) return null;
  const wave = E.BRANCH_UNLOCK[pending[0]];
  const names = pending.filter(b => E.BRANCH_UNLOCK[b] === wave)
    .map(b => E.UPGRADES[b].name);
  const list = names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names.at(-1) : names[0];
  return `${list} ${names.length > 1 ? 'open' : 'opens'} at wave ${wave}.`;
}

/* Labels for the raw stat keys in `UPGRADES[b].tiers`, kept word-for-word in
   step with the Stats block's rows so a preview and the stat it moves read as
   the same thing. An unmapped key falls back to itself rather than vanishing —
   a branch added without a label should look untidy, not silently show nothing. */
const STAT_LABELS = {
  dmg: 'Damage', dps: 'DPS', shotR: 'Round size', shotSpeed: 'Round speed', reach: 'Reach',
  pierce: 'Pierce', bounces: 'Bounces', heatPerShot: 'Heat/shot', cool: 'Cooling',
  lock: 'Lockout', converge: 'Convergence',
};

/* Stats a branch moves that are not in its own tier table. Damage is derived
   from Calibre and Velocity now (`roundDamage`), so those two rows have to
   preview the DPS they buy — otherwise the shop offers "3.8 → 4.2 round size"
   for 117 scrap and never mentions the reason anyone would pay it. Listed
   first, because it is the reason. */
const PREVIEW_DERIVED = { calibre: ['dps'], velocity: ['dps'] };
const statLabel = k => STAT_LABELS[k] || k;

/** Tier values are a mix of multipliers, absolutes and counts, so print what
 *  is there: whole numbers stay whole, everything else keeps the two decimals
 *  that distinguish adjacent tiers (1.18 vs 1.38) without inventing precision. */
const fmtStat = v => (Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/, ''));

/** Mark the stat a purchase just moved, on the freshly rebuilt block. */
function flashStat(host, branch) {
  // `~=` rather than `=`: a row can name more than one branch, since DPS is
  // moved by both Calibre and Velocity
  for (const el of host.querySelectorAll(`.statBlock .stat[data-stat~="${branch}"]`)) {
    el.classList.add('bought');
  }
}

/** This mount's barrel count. Per-emplacement since v28 — it used to be a
 *  battery-wide card on the Battery tab, which was the last thing on a gun that
 *  was not bought on the gun's own tab. */
function renderBarrels(gun) {
  const have = E.barrelsOf(gun);
  const cost = E.barrelCost(world, shopTab);
  const afford = cost !== null && world.scrap >= cost;
  const el = document.createElement('div');
  el.className = 'branch barrels';
  const dots = Array.from({ length: E.MAX_BARRELS }, (_, i) =>
    `<i class="${i < have ? 'on' : ''}"></i>`).join('');
  el.innerHTML =
    `<h3>Barrels</h3>` +
    `<div class="pips">${dots}</div>` +
    `<p>Rounds per volley, off this mount's heat.</p>`;
  const btn = document.createElement('button');
  btn.className = 'buy' + (cost !== null && !afford ? ' poor' : '');
  btn.textContent = cost === null ? 'Maxed'
    : afford ? `Add Barrel · ${cost}`
    : `${cost}`;
  btn.disabled = cost === null || !afford;
  btn.addEventListener('click', () => {
    if (E.buyBarrel(world, shopTab)) { renderShop(); sync(); }
  });
  el.appendChild(btn);
  return el;
}

function renderTabs() {
  const host = $('shopTabs');
  host.innerHTML = '';

  /* The **gun** tabs only exist while you are looking at a gun.

     On the overview they were a second copy of the cards directly below them —
     the cards *are* the picker, and offering both meant two controls doing one
     job. In a mount's detail view they are how you move between mounts without
     going back out, so there they stay, pinned at the top.

     Research is not a gun, and stays reachable from either view. So does adding
     an emplacement, which the overview offers as a card instead of a tab. */
  const detail = shopTab !== OVERVIEW;

  if (detail) {
    const ov = document.createElement('button');
    ov.className = 'tab';
    ov.innerHTML = `<b>&#9707;</b><span>All</span>`;
    ov.addEventListener('click', () => { shopTab = OVERVIEW; renderShop(); });
    host.appendChild(ov);

    world.battery.guns.forEach((g, i) => {
      const b = document.createElement('button');
      b.className = 'tab' + (i === shopTab ? ' on' : '');
      b.style.setProperty('--tab', E.GUN_TYPES[g.type].col);
      b.innerHTML = `<b>${i + 1}</b><span>${E.GUN_TYPES[g.type].name}</span>`;
      b.addEventListener('click', () => { shopTab = i; renderShop(); });
      host.appendChild(b);
    });

    /* The add-mount slot: a dashed "+" where the next emplacement will appear.
       The price rides on the tab itself, so saving up for a mount does not mean
       going elsewhere to check the number. */
    const mCost = E.mountCost(world);
    const full = mCost === null;
    const add = document.createElement('button');
    add.className = 'tab add';
    add.innerHTML = `<b>+</b><span>${full ? 'Full' : mCost}</span>`;
    add.disabled = full || world.scrap < mCost;
    add.setAttribute('aria-label',
      full ? 'All emplacements built' : `Add an emplacement for ${mCost} scrap`);
    add.addEventListener('click', () => {
      if (E.buyMount(world)) {
        // land on the gun you just bought — it is bare, and its own tab is
        // where every decision about it lives
        shopTab = world.battery.guns.length - 1;
        renderShop();
        sync();
      }
    });
    host.appendChild(add);
  }

  /* Research is *not* a tab any more — it is a verb on the title line, beside
     Next Wave (v44). It was never a sibling of the mount tabs in the first
     place: those pick which gun you are spending scrap on, and research is a
     different currency buying different things. Putting it up top also gives
     the header something to do besides restate the scrap the HUD already
     shows. `syncResearchButton` owns whether it is offered at all. */
  syncResearchButton();
}

/** Show or hide the Research verb, and keep it in step with what it opens.
 *
 *  It appears once there is any research to look at. On run 1 there are 0 RP
 *  and no way to earn one — `awardResearch` pays at game over — so offering it
 *  from the first shop is a second currency on screen before the first is
 *  understood. */
function syncResearchButton() {
  const btn = $('shopResearch');
  const show = hasResearch();
  btn.style.display = show ? '' : 'none';
  if (!show) {
    if (shopTab === RESEARCH) shopTab = OVERVIEW;   // never strand a hidden view
    return;
  }
  const on = shopTab === RESEARCH;
  btn.classList.toggle('on', on);
  btn.textContent = on ? 'Battery' : 'Research';
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
}

/* One card per emplacement, all of them at once.

   The tabs alone made you pick a mount before you could see it, which is the
   wrong way round when the question is "which of these needs the money". A card
   carries the gun, its barrels, and how deep its tree is, so the comparison is
   on one screen; tapping one opens that mount's tree. */
function renderOverview(host) {
  world.battery.guns.forEach((gun, i) => {
    const G = E.GUN_TYPES[gun.type];
    const el = document.createElement('button');
    el.className = 'empCard';
    el.style.setProperty('--tab', G.col);

    /* The portrait draws in a fixed 420x190 space, so the canvas has to *be*
       420x190 — it was 260x110, which drew the art at full size into a smaller
       bitmap and showed the top-left corner of each gun. CSS scales it down to
       the card; the backing store keeps the drawing's own coordinates. */
    const pc = document.createElement('canvas');
    pc.width = PORTRAIT_W; pc.height = PORTRAIT_H;
    el.appendChild(pc);

    /* Counted over the branches actually open, not all nine — the ramp means a
       new player's ceiling really is lower, and "0/45" for someone who can
       reach 15 reads as a progress bar that will not move. */
    const opened = E.openBranches(world);
    const depth = opened.reduce((a, b) => a + (gun.upgrades[b] || 0), 0);
    const most = opened.length * E.MAX_TIER;
    const cap = document.createElement('div');
    cap.className = 'empMeta';
    cap.innerHTML =
      `<b style="color:${G.col}">${i + 1} · ${G.name}</b>` +
      `<span>${E.barrelsOf(gun)} barrel${E.barrelsOf(gun) > 1 ? 's' : ''} · ${depth}/${most} tiers</span>` +
      `<span class="xpline" title="${depth} of ${most} tiers bought"><i style="width:${most ? Math.round(depth / most * 100) : 0}%"></i></span>`;
    el.appendChild(cap);

    el.addEventListener('click', () => { shopTab = i; renderShop(); });
    host.appendChild(el);
    drawCannonPortrait(pc.getContext('2d'), gun.type, E.barrelsOf(gun));
  });

  // and the way to add another, in the same grid rather than off in the tabs
  const mCost = E.mountCost(world);
  if (mCost !== null) {
    const add = document.createElement('button');
    add.className = 'empCard addCard';
    add.innerHTML = `<b>+</b><span>Add emplacement</span><span class="cost">${mCost} scrap</span>`;
    add.disabled = world.scrap < mCost;
    add.addEventListener('click', () => {
      if (E.buyMount(world)) { shopTab = world.battery.guns.length - 1; renderShop(); sync(); }
    });
    host.appendChild(add);
  }
}

/* What this emplacement actually is, in numbers.

   Every one of these already existed and none of them were visible: a player
   buying Damage tier 4 had no way to see what it bought, and no way to compare
   two mounts except by remembering what they had spent. Resolved through
   `stats` and `gunStats`, so what is shown is exactly what fires. */
/** What the shop *shows* for one stat on one gun, with a given upgrade tree.
 *
 *  The single source for both the Stats block and the branch previews, which
 *  is the whole point of it. They used to be computed in two places: the block
 *  resolved the gun (`stats × gunStats × marks`), while a preview printed the
 *  raw numbers out of `UPGRADES[b].tiers`. On a standard cannon with no marks
 *  those happen to agree, so it looked right — and the moment a gun type or a
 *  mark was researched they diverged, which is the reported "upgrade preview
 *  doesn't match after researching cannon": the block said Damage 2.4 while
 *  the row under it offered 1.0 → 1.3.
 *
 *  Anything added to the rows below has to be added here too, or a preview for
 *  that stat will silently print an unmultiplied number again. */
function statDisplay(gun, key, ups = gun.upgrades) {
  const S = E.stats(world, { ...gun, upgrades: ups });
  const G = E.gunStats(world, gun.type);
  const T = E.OD_TIERS[0];                    // base tier, so the numbers are comparable
  const n = E.barrelsOf(gun);
  switch (key) {
    case 'dmg': return (T.dmg * S.dmg * G.dmg).toFixed(1);
    /* What the mount actually puts downrange, per second of firing: the round's
       damage, every barrel that fires with it, over the reload. Flanking
       barrels count at `SUB_BARREL_DMG`, which is what they really deal —
       counting them as whole barrels would advertise a number the gun cannot
       produce. Heat is deliberately *not* in here: how long you can keep firing
       is what the three thermal rows below are for, and folding a duty cycle
       into this would make one number answer two questions badly. */
    case 'dps': {
      const per = T.dmg * S.dmg * G.dmg * (1 + (n - 1) * E.SUB_BARREL_DMG);
      return (per / (T.rate * G.rate)).toFixed(1);
    }
    case 'pierce': return String(T.pierce + S.pierce + G.pierce);
    case 'shotR': return S.shotR.toFixed(1);
    case 'shotSpeed': return String(Math.round(S.shotSpeed));
    case 'reach': return '×' + S.reach.toFixed(2);
    case 'bounces': return String(S.bounces);
    case 'heatPerShot': return (S.heatPerShot * n).toFixed(2);
    case 'cool': return '×' + S.cool.toFixed(2);
    case 'lock': return '×' + S.lock.toFixed(2);
    default: return S[key] === undefined ? '—' : fmtStat(S[key]);
  }
}

function renderGunStats(gun) {
  const S = E.stats(world, gun);
  const G = E.gunStats(world, gun.type);
  const T = E.OD_TIERS[0];                    // base tier, so the numbers are comparable
  const n = E.barrelsOf(gun);

  /* Third element is which branches move this number, space separated, so
     buying an upgrade can flash the stat it bought. Without it there is no way
     to tell which of ten rows just changed — the number ticks over silently in
     a block of ten, which is the whole complaint. `null` for the rows no branch
     owns, and two names for DPS, which is exactly the point of it: damage is a
     result of Calibre and Velocity now, not a thing you buy. */
  const rows = [
    ['DPS', statDisplay(gun, 'dps'), 'calibre velocity'],
    ['Damage/round', statDisplay(gun, 'dmg') + (n > 1 ? ` ×${n}` : ''), 'calibre velocity'],
    ['Round size', statDisplay(gun, 'shotR'), 'calibre'],
    ['Reload', (T.rate * G.rate).toFixed(2) + 's', null],
    ['Round speed', statDisplay(gun, 'shotSpeed'), 'velocity'],
    ['Reach', statDisplay(gun, 'reach'), 'optics'],
    ['Pierce', statDisplay(gun, 'pierce'), 'munitions'],
    ['Bounces', statDisplay(gun, 'bounces'), 'munitions'],
    ['Heat/shot', statDisplay(gun, 'heatPerShot'), 'breech'],
    ['Cooling', statDisplay(gun, 'cool'), 'cooling'],
    ['Lockout', statDisplay(gun, 'lock'), 'interlock'],
  ];

  const el = document.createElement('div');
  el.className = 'branch statBlock';
  el.innerHTML = `<h3>Stats</h3>` +
    `<dl>${rows.map(([k, v, b]) =>
      `<div class="stat"${b ? ` data-stat="${b}"` : ''}><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
  return el;
}

/** The retrofit row for one mount: swap it to any researched type, for a fee.
 *  Research itself is bought once on the Battery tab; this is the per-mount
 *  conversion, so kitting five guns out costs five retrofits. */
function renderRetrofit(gun) {
  const el = document.createElement('div');
  el.className = 'branch retro';
  el.innerHTML = `<h3>Refit</h3><p>Researched types only.</p>`;
  const row = document.createElement('div');
  row.className = 'assign';
  for (const type of E.GUN_KEYS) {
    const G = E.GUN_TYPES[type];
    const owned = type === 'standard' || world.gunUnlocks[type];
    const cost = E.retrofitCost(world, shopTab, type);
    const chip = document.createElement('button');
    chip.className = 'chip' + (gun.type === type ? ' on' : '');
    chip.textContent = gun.type === type ? G.name
      : !owned ? `${G.name} ·  locked`
      : `${G.name} · ${cost}`;
    chip.disabled = gun.type === type || !owned || world.scrap < cost;
    chip.style.borderColor = G.col;
    chip.addEventListener('click', () => {
      if (E.setGunType(world, shopTab, type)) { renderShop(); sync(); }
    });
    row.appendChild(chip);
  }
  el.appendChild(row);
  return el;
}

/* The Battery tab is research only now. Both of the cards that used to sit
   here have moved to where they belong: the add-mount card became the "+" tab
   in the tab strip (buying a mount is a thing you do *to the strip*, so it
   reads better as part of it), and barrels went onto each mount's own tab when
   they became per-emplacement. */
/** A card that is not open yet: what it is, and the wave that opens it.
 *
 *  Shown rather than hidden, deliberately. A locked rung tells a player what
 *  the next fifty waves are *for*, which is the whole reason the ladder exists;
 *  hiding them would make research look finished long before it is. */
function lockedCard(title, wave, note) {
  const el = document.createElement('div');
  el.className = 'branch locked';
  el.innerHTML =
    `<h3>${title}</h3>` +
    (note ? `<p>${note}</p>` : '') +
    `<p class="lockNote">Opens at wave ${wave}.</p>`;
  const btn = document.createElement('button');
  btn.className = 'buy rp gated';
  btn.textContent = `Wave ${wave}`;
  btn.disabled = true;
  el.appendChild(btn);
  return el;
}

/** One gun type's research card: learn it, or mark it if it is already known.
 *  `standard` is the special case — never learned, always markable. */
function gunResearchCard(type) {
  const G = E.GUN_TYPES[type];
  const known = type === 'standard' || world.research.guns[type];
  const cost = E.gunResearchCost(world, type);

  const el = document.createElement('div');
  el.className = 'branch';
  el.innerHTML =
    `<h3 style="color:${G.col}">${G.name}</h3>` +
    `<p>${type === 'standard' ? 'The gun every run starts with.' : gunBlurb(type)}</p>`;

  const btn = document.createElement('button');
  btn.className = 'buy rp';

  if (!known) {
    const afford = world.research.points >= cost;
    btn.className += afford ? '' : ' poor';
    btn.textContent = afford ? `Research · ${cost} RP` : `${cost} RP`;
    btn.disabled = !afford;
    btn.addEventListener('click', () => { buyResearch(() => E.researchGun(world, type)); });
    el.appendChild(btn);
    return el;
  }

  /* A learned type is *fitted* from the mount's own tab, not from here — the
     chips that used to live here were the only place the shop said which mount
     it meant, and with per-emplacement upgrades that job belongs to the tabs.
     What it gets instead is **marks**: a permanent raise to the type's base
     line, on every mount that carries it and in every run after, so research
     past the last unlock has somewhere to go. */
  const on = world.battery.guns.filter(g => g.type === type).length;
  const mCost = E.markCost(world, type);
  const have = world.research.marks[type] || 0;
  const pips = Array.from({ length: E.MAX_MARK }, (_, i) =>
    `<i class="${i < have ? 'on' : ''}"></i>`).join('');
  el.insertAdjacentHTML('beforeend',
    `<div class="markRow"><span>Mark ${have}</span><span class="pips">${pips}</span></div>` +
    `<p class="fitted">${on ? `Fitted on ${on}` : 'Not fitted'}</p>`);
  if (mCost === null) {
    btn.textContent = 'Research Completed';
    btn.disabled = true;
  } else {
    const afford = world.research.points >= mCost;
    btn.className += afford ? '' : ' poor';
    btn.textContent = afford ? `Mark ${have + 1} · ${mCost} RP` : `${mCost} RP`;
    btn.disabled = !afford;
    btn.addEventListener('click', () => { buyResearch(() => E.researchMark(world, type)); });
  }
  el.appendChild(btn);
  return el;
}

/** Convergence: fire control for the whole battery, not a per-gun tier.
 *
 *  It was one of the nine scrap branches, which never made sense — the guns
 *  share a single focal point, so the engine read the *best* convergence on the
 *  battery and every other mount's purchase did nothing. One permanent track,
 *  bought once, applying to every emplacement including ones built later. */
function convergeCard() {
  const level = E.convergeLevel(world);
  const cost = E.convergeCost(world);
  const el = document.createElement('div');
  el.className = 'branch';
  const pips = Array.from({ length: E.CONV_MAX }, (_, i) =>
    `<i class="${i < level ? 'on' : ''}"></i>`).join('');
  el.innerHTML =
    `<h3>Convergence</h3>` +
    `<div class="pips">${pips}</div>` +
    `<p>How far in the battery's fire will follow a command ship. ` +
    `${level ? `Now closes to ${Math.round(E.focusFloor(world))}px` : 'Fire holds its fan at all ranges'}.</p>`;

  const btn = document.createElement('button');
  btn.className = 'buy rp';
  if (cost === null) {
    btn.textContent = 'Research Completed';
    btn.disabled = true;
  } else {
    const afford = world.research.points >= cost;
    btn.className += afford ? '' : ' poor';
    btn.textContent = `${cost} RP`;
    btn.disabled = !afford;
    btn.addEventListener('click', () => { buyResearch(() => E.researchConverge(world)); });
  }
  el.appendChild(btn);
  return el;
}

/** Branch depth: tiers 4 and 5, opened one branch at a time. Eight cards, so
 *  they arrive as one rung of the ladder rather than eight. */
function depthCards(host) {
  for (const b of E.BRANCHES) {
    const U = E.UPGRADES[b];
    const cost = E.depthCost(world, b);
    const cap = E.tierCap(world, b);

    const el = document.createElement('div');
    el.className = 'branch';
    const pips = Array.from({ length: E.MAX_TIER }, (_, i) =>
      `<i class="${i < cap ? 'on' : 'locked'}"></i>`).join('');
    el.innerHTML =
      `<h3>${U.name} depth</h3>` +
      `<div class="pips">${pips}</div>` +
      `<p>Tiers past ${E.FREE_TIER}, on every emplacement.</p>`;

    const btn = document.createElement('button');
    btn.className = 'buy rp';
    if (cost === null) {
      btn.textContent = 'Research Completed';
      btn.disabled = true;
    } else {
      const afford = world.research.points >= cost;
      btn.className += afford ? '' : ' poor';
      btn.textContent = afford ? `Open tier ${cap + 1} · ${cost} RP` : `${cost} RP`;
      btn.disabled = !afford;
      btn.addEventListener('click', () => { buyResearch(() => E.researchDepth(world, b)); });
    }
    el.appendChild(btn);
    host.appendChild(el);
  }
}

/* The research screen, in ladder order.
 *
 *  Since v44 research is a rung every ten waves (`RESEARCH_UNLOCK`), so the
 *  screen is ordered by *when a category opens* rather than by what kind of
 *  thing it is — which makes the list itself the progression: everything above
 *  where you are is spendable, everything below names the wave that opens it.
 *  It opens on the standard cannon, the gun you already own, because a first
 *  rung you already understand is what explains what research is. */
function renderBattery() {
  const host = $('battery');
  host.innerHTML = '';

  /* Research points, stated first and large. This is a different currency from
     the scrap in the shop header, and the two must never be confused for one
     another — so it gets its own line, its own color, and says outright where
     more comes from. */
  const next = E.nextResearchUnlock(world);
  const head = document.createElement('div');
  head.className = 'rpHead';
  head.innerHTML =
    `<b>${world.research.points} RP</b>` +
    `<span>Earned for the wave a run reaches, and kept.` +
    (next ? ` Next unlock at wave ${next.wave}; best so far ${E.experience(world)}.` : '') +
    `</span>`;
  host.appendChild(head);

  if (!E.researchOpen(world)) {
    const el = document.createElement('div');
    el.className = 'branch locked wide';
    el.innerHTML =
      `<h3>Research opens at wave ${E.RESEARCH_WAVE}</h3>` +
      `<p>Points bank in the meantime — every run pays for the wave it reached, ` +
      `and nothing is lost by earning them early.</p>` +
      `<p class="lockNote">Best wave so far: ${E.experience(world)}.</p>`;
    host.appendChild(el);
    return;
  }

  const rungs = Object.entries(E.RESEARCH_UNLOCK).sort((a, b) => a[1] - b[1]);
  for (const [key, wave] of rungs) {
    if (!E.researchUnlocked(world, key)) {
      const title = key === 'depth' ? 'Branch depth'
        : key === 'converge' ? 'Convergence'
        : E.GUN_TYPES[key]?.name || key;
      const note = key === 'depth' ? `Tiers past ${E.FREE_TIER}, on every branch.`
        : key === 'converge' ? "Fire control for the whole battery."
        : E.GUN_TYPES[key] ? gunBlurb(key) : '';
      host.appendChild(lockedCard(title, wave, note));
      continue;
    }
    if (key === 'depth') depthCards(host);
    else if (key === 'converge') host.appendChild(convergeCard());
    else host.appendChild(gunResearchCard(key));
  }
}

/** Run a research purchase and persist it immediately. Written on every
 *  purchase rather than at the end of the run: research is permanent by
 *  definition, and a phone killed mid-run must not lose points already spent. */
function buyResearch(buy) {
  if (!buy()) return;
  writeResearch(world.research);
  syncResearchNote();
  renderShop();
  sync();
}

/* ---------- cannon portraits ----------

   A large side-on drawing of one gun type, for its tab in the shop. Same
   vector/CRT vocabulary as the board — glowStroke for lit edges, a dark body
   fill so each part reads as solid rather than as an outline, and an offset
   back face for depth. Deliberately *not* a second art style: the portrait
   should look like the thing on the board, drawn bigger and with the detail
