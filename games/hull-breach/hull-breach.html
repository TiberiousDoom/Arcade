<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hull Breach</title>
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#0b1418">
<link rel="icon" href="../../shared/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../shared/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="stylesheet" href="../../shared/theme.css">
<script type="module" src="../../shared/pwa.js"></script>
<style>
  /* Hull Breach keeps the default brass accent, on an 800x600 board. */
  :root{ --board-max:800px }

  /* Refit shop, opened on a level clear — same shape as Flak Battery's,
     minus the battery/gun-assignment section this game has no equivalent of. */
  #shop{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;
    background:rgba(11,20,24,.94);padding:18px 16px;overflow-y:auto;gap:12px}
  #shop.on{display:flex}
  #shopHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  #shopHead h2{font-family:'Archivo Black',sans-serif;font-size:clamp(15px,3.6vw,20px);text-transform:uppercase;letter-spacing:-.02em}
  #shopSalvage{font-size:12px;color:var(--brass);font-weight:700;letter-spacing:.08em}
  #branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
  .branch{border:1px solid var(--line);background:#0f2027;padding:12px 13px;display:flex;flex-direction:column;gap:8px;text-align:left}
  .branch h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone);font-weight:700}
  .branch p{font-size:11px;color:var(--dim);line-height:1.5;min-height:2.6em}
  .pips{display:flex;gap:3px}
  .pips i{flex:1;height:5px;background:#1b3038;border-radius:1px}
  .pips i.on{background:var(--scale)}
  .buy{width:100%;min-height:42px;padding:12px 10px;font:700 11px/1 'Chivo Mono',monospace;letter-spacing:.12em;
    text-transform:uppercase;border:0;cursor:pointer;background:var(--brass);color:#1a1405;border-radius:3px}
  .buy:disabled{background:#1b3038;color:#4d6068;cursor:default}
  .buy.poor:disabled{background:#2a2416;color:#8a7645;border:1px solid #3d3520}
  #shopGo{align-self:center;margin-top:2px}

  /* Level-select overlay — a growing grid of every level reached so far.
     No fixed cap: levels generate forever, so the grid just grows with you.
     z-index above #banner and #shop (both implicitly 0/2, DOM order only
     otherwise) and above #menuPanel (6) too — reachable from the menu mid-run
     (onLevels), it must never end up rendered underneath either. */
  #levelSelect{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;
    background:rgba(11,20,24,.96);padding:18px 16px;overflow-y:auto;gap:12px}
  #levelSelect.on{display:flex}
  #levelSelectHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  #levelSelectHead h2{font-family:'Archivo Black',sans-serif;font-size:clamp(15px,3.6vw,20px);text-transform:uppercase;letter-spacing:-.02em}
  #levelGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
  .levelTile{min-height:52px;font:700 15px/1 'Chivo Mono',monospace;border:1px solid var(--line);
    background:#0f2027;color:var(--bone);cursor:pointer;border-radius:3px}
  .levelTile:hover{border-color:var(--brass)}
  #levelSelectClose{align-self:center;margin-top:2px;background:#1b3038;color:var(--bone)}
</style>

<div id="shell">
  <header>
    <div class="titles">
      <a class="back" href="../../index.html">&larr; Arcade</a>
      <h1>Hull <span>Breach</span></h1>
    </div>
    <div class="meta">
      <div>Level <b id="uiLevel">1</b></div>
      <div>Score <b id="uiScore">0</b></div>
      <div>Salvage <b id="uiSalvage">0</b></div>
      <div>Balls <b id="uiLives">3</b></div>
      <div>Best <b id="uiBest">—</b></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv" width="800" height="600"></canvas>
    <div id="shop">
      <div id="shopHead">
        <h2>Refit</h2>
        <div id="shopSalvage">Salvage 0</div>
      </div>
      <div id="branches"></div>
      <button id="shopGo">Next Level</button>
    </div>
    <div id="levelSelect">
      <div id="levelSelectHead"><h2>Levels</h2></div>
      <div id="levelGrid"></div>
      <button id="levelSelectClose" type="button">Back</button>
    </div>
    <div id="banner">
      <h2>Hull Breach</h2>
      <p id="hint">Slide to steer, tap to serve.</p>
      <button id="go">Begin</button>
      <button id="levelsBtn" type="button" style="margin-left:8px;background:#1b3038;color:var(--bone)">Levels</button>
    </div>
  </div>

  <footer>
    <span>Hit the edges of the paddle to steer</span>
    <span>Back rows take more hits</span>
    <span>Catch the capsules bricks drop</span>
    <span>Clear the board to advance</span>
  </footer>
</div>

<script type="module">
import * as E from './engine.js';
import { makeFit } from '../../shared/fit.js';
import { makeFx } from '../../shared/fx.js';
import { glowStroke, glowDot, extrudeRect, GLOW_PASSES_CHEAP } from '../../shared/glow.js';
import { best, submit } from '../../shared/scores.js';
import { saveRun, loadRun, clearRun } from '../../shared/resume.js';
import { makeAudio } from '../../shared/audio.js';
import { makeMenu } from '../../shared/menu.js';
import { maxLevel, recordLevel } from '../../shared/levels.js';

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const TAU = E.TAU;
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const $ = id => document.getElementById(id);

const gfx = makeFx({ reduce });
const audio = makeAudio();

/* the engine never sees these — cosmetic particles, plus sound */
const fx = {
  brick(x, y, row) {
    gfx.burst(x, y, BRICK_COL[Math.min(row, BRICK_COL.length - 1)] || '#e6e9e2');
    audio.brick(row);
  },
  bounce() { audio.bounce(); },
  lose() { gfx.hit(.5); audio.lose(); },
  // a caught capsule: burst in its own colour, and reuse the pickup blip
  power(kind) {
    const p = world.paddle;
    gfx.burst(p.x, world.L.PADDLE_Y, E.POWERUPS[kind].col, 14);
    if (kind === 'life') audio.bonus(); else audio.eat();
  },
};

/* Portrait phones get the narrower, taller board with a thumb rest below the
   floor line; landscape gets the wide one and rests thumbs in the side
   gutters instead. Re-picked whenever the phone turns — see applyLayout. */
/* Portrait-only since 2026-07-27: landscape didn't feel right on a real phone.
   Every board uses the tall layout regardless of orientation. The rotation
   machinery below is left intact but inert (applyLayout early-returns because
   the layout never changes) — flip this flag back to false to restore
   landscape without re-deriving anything. */
const PORTRAIT_ONLY = true;
const pickLayout = () =>
  (PORTRAIT_ONLY || matchMedia('(max-aspect-ratio: 4/5)').matches) ? E.LAYOUT_TALL : E.LAYOUT;

const world = E.createWorld({ fx, layout: pickLayout() });

let W = world.L.W, H = world.L.H;
const board = { w: W, h: H };          // makeFit re-reads this on every fit

function adoptLayout() {
  W = world.L.W; H = world.L.H;
  board.w = W; board.h = H;
  cv.width = W; cv.height = H;
  document.documentElement.style.setProperty('--board-max', W + 'px');
}
adoptLayout();

/* brick colour by grid row: back rows (tougher) skew brass, front rows green */
const BRICK_COL = ['#c9a227', '#c9a227', '#3fae8f', '#3fae8f', '#5fc9a4', '#5fc9a4', '#8dbf4a'];
const brickFace = (b) => BRICK_COL[Math.min(b.row, BRICK_COL.length - 1)] || '#3fae8f';

/* ---------- input ---------- */
let keys = {};

function stageX(e) {
  const r = cv.getBoundingClientRect();
  return (e.clientX - r.left) * (W / r.width);
}

/* Two ways to steer, picked by where the finger lands.
   On the board: the paddle jumps to your finger — direct and precise.
   In the side gutters (landscape, where the board can't fill the width): a
   relative drag, so a thumb parked off to the side still steers without any
   part of your hand crossing the play area. */
let drag = null;
const GUTTER_GAIN = 1.6;      // gutter drags are amplified; a thumb travels less

function onDown(e) {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const onBoard = e.clientX >= r.left && e.clientX <= r.right;
  if (onBoard) {
    drag = { mode: 'absolute' };
    E.setPaddle(world, stageX(e));
  } else {
    drag = { mode: 'relative', fromX: e.clientX, fromPaddle: world.paddle.x, scale: W / r.width };
  }
  if (world.running) E.launch(world);        // the press itself serves the ball
}

function onMove(e) {
  if (!drag && e.pointerType !== 'mouse') return;
  if (drag && drag.mode === 'relative') {
    E.setPaddle(world, drag.fromPaddle + (e.clientX - drag.fromX) * drag.scale * GUTTER_GAIN);
    return;
  }
  if (e.pointerType === 'mouse' || e.buttons) E.setPaddle(world, stageX(e));
}

const surface = $('stage');
surface.addEventListener('pointerdown', e => {
  // let the ? button and the banner buttons work normally
  if (e.target.closest('button')) return;
  // capture can legitimately fail (pointer already gone); steering still works
  try { surface.setPointerCapture(e.pointerId); } catch {}
  onDown(e);
});
surface.addEventListener('pointermove', onMove);
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointercancel', () => { drag = null; });
for (const ev of ['selectstart', 'contextmenu', 'dragstart']) {
  surface.addEventListener(ev, e => e.preventDefault());
}

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); if (world.running) E.launch(world); }
});
addEventListener('keyup', e => { keys[e.code] = false; });

const fitStage = makeFit({ canvas: cv, stage: $('stage'), board });

/* Rotating the phone moves the game onto the other board. Nothing is lost:
   both layouts share a brick grid, so damage carries across index-for-index,
   along with level, score and lives. Only the ball is re-racked. */
function applyLayout() {
  const L2 = pickLayout();
  if (L2 === world.L) return;
  const wasRunning = world.running;
  E.relayout(world, L2);
  adoptLayout();
  fitStage();
  sync();
  // Pause rather than drop the player straight back in mid-flight on a board
  // that just changed shape under them.
  if (wasRunning) {
    world.running = false;
    showBanner('Turned', 'Your game is where you left it.', 'Resume');
  }
}
addEventListener('resize', applyLayout);
addEventListener('orientationchange', () => setTimeout(applyLayout, 200));

const pause = makeMenu({
  stage: $('stage'),
  audio,
  onLevels: openLevelSelect,
  title: 'Hull Breach',
  lore: 'You have held them long enough to answer. Their hull is layered, and it does not grow back.',
  rows: [
    ['Steer', 'Slide anywhere. You can also drag in the dim strip either side.'],
    ['Serve', 'Tap.'],
    ['Aim', 'Where the ball hits the paddle sets the angle it leaves.'],
    ['Catch', 'Some bricks drop a capsule. Catch it with the paddle.'],
  ],
  notes: [
    'Back rows take three hits.',
    '3 splits the ball · ↔ widens the paddle · ▼ slows it down · + is a spare ball.',
    'Keyboard: arrows and Space.',
  ],
});

/* ---------- banner ---------- */
function showBanner(h, p, btn) {
  $('banner').classList.remove('hide');
  $('banner').querySelector('h2').textContent = h;
  $('hint').innerHTML = p;
  const b = $('go'); b.textContent = btn; b.style.display = '';
}
function hideBanner() { $('banner').classList.add('hide'); }

/* One handler for every banner state — a game over restarts, a cleared level
   advances, and the opening banner just starts. Rewiring onclick per state
   left the original listener attached too, so both fired on the same click. */
/* Set once the player has actually begun; `saveNow` uses it rather than
   `world.running`, which goes false whenever a banner is up. */
let started = false;

$('go').addEventListener('click', () => {
  if (world.over) E.resetGame(world);
  else if (world.levelClear) { E.nextLevel(world); recordLevel(GAME_ID, world.level); }
  world.running = true;
  started = true;
  gfx.clear();               // don't let a death flash bleed into the next run
  hideBanner();
});

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;

  if (world.running && !world.over && !pause.paused) {
    let kb = 0;
    if (keys.ArrowLeft) kb -= 1;
    if (keys.ArrowRight) kb += 1;
    if (kb) E.nudgePaddle(world, kb * 620 * dt);

    E.step(world, dt);
    pushTrail();

    if (world.over) {
      clearRun(GAME_ID);          // a finished run is not one to come back to
      const r = submit(GAME_ID, world.score, `Level ${world.level}`);
      syncBest();
      showBanner('Game Over',
        r.record
          ? `New best — <b style="color:var(--brass)">${world.score}</b>`
          : `Score <b style="color:var(--brass)">${world.score}</b> · best ${r.best}`,
        'Play again');
    }
    else if (world.levelClear) {
      world.running = false;
      saveNow();                  // a cleared board is the natural place to keep
      openShop();
    }
    sync();
  }

  // cosmetic particles + hit flash decay regardless of pause
  gfx.step(dt, 1.5);

  draw();
  requestAnimationFrame(frame);
}

const GAME_ID = 'hull-breach';

function syncBest() {
  const b = best(GAME_ID);
  $('uiBest').textContent = b ? b.score : '—';
}

function sync() {
  $('uiLevel').textContent = world.level;
  $('uiScore').textContent = world.score;
  $('uiSalvage').textContent = world.salvage;
  $('uiLives').textContent = world.lives;
}

/* ---------- level select ---------- */
function renderLevelGrid() {
  const host = $('levelGrid');
  host.innerHTML = '';
  const top = maxLevel(GAME_ID);
  for (let n = 1; n <= top; n++) {
    const btn = document.createElement('button');
    btn.className = 'levelTile';
    btn.type = 'button';
    btn.textContent = n;
    btn.addEventListener('click', () => startAtLevel(n));
    host.appendChild(btn);
  }
}
function openLevelSelect() {
  // reached from the menu too, which unpauses (closing its own panel) right
  // before calling onLevels — re-pause immediately so a run mid-flight
  // doesn't keep simulating behind the level grid
  pause.pause();
  renderLevelGrid();
  $('levelSelect').classList.add('on');
}
function closeLevelSelect() { $('levelSelect').classList.remove('on'); }

/** Jump straight into a specific level, clearing any resumable run first —
 *  otherwise a stale save lingers and a later background/pagehide event
 *  could write over it with state that doesn't match what was chosen. */
function startAtLevel(n) {
  clearRun(GAME_ID);
  E.resetGame(world);
  world.level = n;
  world.bricks = E.buildBricks(n, world.L);
  world.running = true;
  started = true;
  gfx.clear();
  closeLevelSelect();
  hideBanner();
  sync();
}

$('levelsBtn').addEventListener('click', openLevelSelect);
$('levelSelectClose').addEventListener('click', closeLevelSelect);

/* ---------- shop ---------- */
function renderShop() {
  $('shopSalvage').textContent = 'Salvage ' + world.salvage;
  const host = $('branches');
  host.innerHTML = '';

  for (const b of E.BRANCHES) {
    const U = E.UPGRADES[b];
    const tier = world.upgrades[b];
    const cost = E.upgradeCost(world.upgrades, b);
    const maxed = cost === null;
    const afford = E.canAfford(world, b);

    const el = document.createElement('div');
    el.className = 'branch';

    const pips = Array.from({ length: E.MAX_TIER }, (_, i) =>
      `<i class="${i < tier ? 'on' : ''}"></i>`).join('');

    el.innerHTML =
      `<h3>${U.name}</h3>` +
      `<div class="pips">${pips}</div>` +
      `<p>${U.blurb}</p>`;

    const btn = document.createElement('button');
    btn.className = 'buy' + (!maxed && !afford ? ' poor' : '');
    btn.textContent = maxed ? 'Maxed'
      : afford ? `Buy · ${cost}`
      : `${cost} · need ${cost - world.salvage} more`;
    btn.disabled = maxed || !afford;
    btn.addEventListener('click', () => {
      if (E.buyUpgrade(world, b)) { renderShop(); sync(); }
    });
    el.appendChild(btn);
    host.appendChild(el);
  }
}

function openShop() {
  $('shop').classList.add('on');
  renderShop();
}
$('shopGo').addEventListener('click', () => {
  $('shop').classList.remove('on');
  E.nextLevel(world);
  recordLevel(GAME_ID, world.level);
  sync();
});

/* ---------- draw ---------- */
function draw() {
  const L = world.L;
  ctx.clearRect(0, 0, W, H);

  /* No phosphor fade here, for the same reason as Choke Point: most of this
     board is static plating, and anything static accumulates under a fade until
     it washes out. The ball gets its own trail instead — tracked in the shell,
     so exactly one thing smears and the rest stays crisp. */

  // playfield border — down to the floor, not the canvas bottom, so on a
  // portrait board the thumb band reads as being outside the court
  glowStroke(ctx, c => c.rect(L.WALL, L.WALL, W - 2 * L.WALL, L.FLOOR - L.WALL),
    '#4a6b74', 1, GLOW_PASSES_CHEAP, .7);

  // the open floor, marked so the losing edge is visible
  ctx.save();
  ctx.setLineDash([6, 8]);
  glowStroke(ctx, c => { c.moveTo(L.WALL, L.FLOOR - 1.5); c.lineTo(W - L.WALL, L.FLOOR - 1.5); },
    '#e0503c', 1.2, GLOW_PASSES_CHEAP, .8);
  ctx.restore();

  // a lost-ball flash tints the floor red
  if (gfx.flash > 0) {
    ctx.fillStyle = `rgba(224,80,60,${gfx.flash * 0.4})`;
    ctx.fillRect(0, L.FLOOR - 60, W, 60);
  }

  /* Hull plating: a dark body with a lit rim, so each plate reads as a panel
     bolted to a ship rather than as a painted rectangle. Damage dims the rim
     rather than the body — a half-broken plate should look like its lights are
     going out, not like it is becoming transparent.

     Deliberately NOT `extrudeRect`: at this size, with a full field of them
     tiled edge to edge, the offset back faces overlap their neighbours and the
     grid turns to mush. Extrusion needs space around an object to read. */
  for (const b of world.bricks) {
    if (!b.alive) continue;
    const col = brickFace(b);
    // quantized into bands, not a smooth fade — a hit should look like a
    // light switching off in stages, not like the rim slowly dimming
    const hpFrac = b.hp / b.maxhp;
    const lit = b.hp >= b.maxhp ? 1 : hpFrac > 0.66 ? 0.7 : hpFrac > 0.33 ? 0.45 : 0.25;
    const face = (c) => c.rect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);

    ctx.fillStyle = 'rgba(10,22,27,.96)';
    ctx.beginPath(); face(ctx); ctx.fill();

    if (b.flash > 0) {
      glowStroke(ctx, face, '#ffffff', 2, GLOW_PASSES_CHEAP, Math.min(1, b.flash * 6));
    }
    glowStroke(ctx, face, col, 1.6, GLOW_PASSES_CHEAP, lit);
  }

  // falling powerup capsules, drawn under the paddle layer so a catch reads as
  // the paddle taking them in
  for (const d of world.drops) drawDrop(d);

  // paddle. It glows while `wide` is up, so the effect is visible on the thing
  // it actually changed rather than only in the HUD.
  // The deflector, extruded: it is a solid piece of your own hardware, and the
  // one defender-side object big enough for the thickness to actually read.
  const p = world.paddle;
  const wide = world.effects.wide > 0;
  const pcol = wide ? E.POWERUPS.wide.col : '#c9a227';
  extrudeRect(ctx, p.x - p.w / 2, L.PADDLE_Y, p.w, L.PADDLE_H, pcol,
    { depth: 5, width: 2, body: 'rgba(28,26,12,.97)' });
  // a lit upper face, so the surface the ball bounces off is the bright one
  glowStroke(ctx, c => {
    c.moveTo(p.x - p.w / 2 + 2, L.PADDLE_Y + 1.5);
    c.lineTo(p.x + p.w / 2 - 2, L.PADDLE_Y + 1.5);
  }, '#fff2c8', 1.4, GLOW_PASSES_CHEAP);

  gfx.draw(ctx);

  /* The interceptor is a sphere, and the only thing here that trails. Recent
     positions are kept in the shell rather than smearing the whole frame,
     because the plating behind it must stay crisp. */
  for (let i = 0; i < trail.length; i++) {
    const g = trail[i];
    glowDot(ctx, g.x, g.y, g.r * (0.35 + 0.45 * (i / trail.length)), '#8fd8ff',
      0.28 * (i / trail.length));
  }
  if (world.held) {
    const hp = E.heldBallPos(world);
    ball(hp.x, hp.y, L.BALL_R);
  }
  for (const b of world.balls) ball(b.x, b.y, b.r);

  drawEffects();
}

/* Recent ball positions, oldest first. Capped hard: this is a decorative tail,
   and multiball can put six of them on screen at once. */
const trail = [];
const TRAIL_MAX = 10;
function pushTrail() {
  if (reduce) return;                     // motion trails are exactly what this flag is for
  for (const b of world.balls) trail.push({ x: b.x, y: b.y, r: b.r });
  while (trail.length > TRAIL_MAX * Math.max(1, world.balls.length)) trail.shift();
}

function ball(x, y, r) {
  glowDot(ctx, x, y, r, '#e6e9e2');
  glowDot(ctx, x, y, r * .45, '#ffffff');
}

/* A capsule: a rounded pill in the powerup's colour with a one-letter glyph.
   Letters rather than icons because they stay legible at ~22px on a phone. */
const DROP_GLYPH = { multi: '3', wide: '↔', slow: '▼', life: '+' };

function drawDrop(d) {
  const P = E.POWERUPS[d.kind], r = E.DROP_R;
  // solid body first, glow over it — a capsule you miss is a capsule wasted
  ctx.fillStyle = P.col;
  ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, TAU); ctx.fill();
  glowDot(ctx, d.x, d.y, r, P.col);
  // a heavier, larger glyph than before — the arrow and triangle characters
  // in particular read thin at 13px and were hard to tell apart at a glance
  ctx.font = "900 16px 'Chivo Mono', monospace";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(11,20,24,.9)';
  ctx.strokeText(DROP_GLYPH[d.kind] || '?', d.x, d.y + .5);
  ctx.fillStyle = '#0b1418';
  ctx.fillText(DROP_GLYPH[d.kind] || '?', d.x, d.y + .5);
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
}

/* Remaining time on the timed effects, as slim bars just inside the floor line.
   Bottom-left rather than top-left: the audio toggle and the "?" button already
   own the top corners of the stage, and down here it sits near the paddle where
   the player is already looking. Only drawn when something is running. */
function drawEffects() {
  const L = world.L;
  const active = ['wide', 'slow'].filter(k => world.effects[k] > 0).length;
  let y = L.FLOOR - 10 - (active - 1) * 12;
  for (const kind of ['wide', 'slow']) {
    const left = world.effects[kind];
    if (left <= 0) continue;
    const P = E.POWERUPS[kind];
    ctx.fillStyle = P.col;
    ctx.globalAlpha = .5;
    ctx.fillRect(L.WALL + 8, y, 54, 3);
    ctx.globalAlpha = 1;
    ctx.fillRect(L.WALL + 8, y, 54 * (left / E.EFFECT_SECONDS), 3);
    ctx.font = "700 9px 'Chivo Mono', monospace";
    ctx.fillText(P.name.toUpperCase(), L.WALL + 68, y + 4);
    y += 12;
  }
}

/* ---------- resuming an interrupted run ----------

   Saved on the quiet beats: when a level is cleared (the game is already
   paused behind a banner) and when the page is hidden. Placed down here
   because GAME_ID is a const declared above the loop, not hoisted. */

let resumeOffered = false;

/* Guarded on `started` rather than on `world.running`, because the states most
   worth saving are exactly the ones where the game is paused behind a banner —
   a cleared level sets running=false before this is called, and checking
   `running` there would delete the save instead of writing it. */
function saveNow() {
  if (!started || world.over) { clearRun(GAME_ID); return; }
  saveRun(GAME_ID, E.snapshot(world), `Level ${world.level} · ${world.score}`);
}

// visibilitychange is what actually fires when a phone backgrounds an app
addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
addEventListener('pagehide', saveNow);

(function offerResume() {
  const stored = loadRun(GAME_ID);
  if (!stored) return;
  resumeOffered = true;
  showBanner('Resume run?', `You left off at <b style="color:var(--brass)">${stored.label}</b>.`, 'Continue');

  const fresh = document.createElement('button');
  fresh.type = 'button';
  fresh.textContent = 'New run';
  fresh.style.cssText = 'margin-left:8px;background:#1b3038;color:var(--bone)';
  fresh.addEventListener('click', () => {
    clearRun(GAME_ID);
    fresh.remove();
    resumeOffered = false;
    showBanner('Hull Breach', 'Slide to steer, tap to serve.', 'Begin');
  });
  $('go').after(fresh);

  // capture, so this runs before the main handler decides to reset or advance
  $('go').addEventListener('click', function once() {
    $('go').removeEventListener('click', once, { capture: true });
    if (!resumeOffered) return;
    resumeOffered = false;
    fresh.remove();
    if (!E.hydrate(world, stored.snap)) E.resetGame(world);
    clearRun(GAME_ID);
    sync();
  }, { capture: true });
})();

syncBest();
sync();                      // makeFit already performed the first fit
requestAnimationFrame(frame);
</script>
