<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Feedline</title>
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#0b1418">
<link rel="icon" href="../../shared/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../shared/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="stylesheet" href="../../shared/theme.css">
<script type="module" src="../../shared/pwa.js"></script>
<style>
  /* Wire runs green rather than brass, on an 800x600 board. */
  :root{
    --accent:var(--scale);
    --accent-hot:#5fc9a4;
    --accent-ink:#06201a;
    --board-max:800px;
  }

  /* settings panel: sensitivity slider + input-mode radios, inserted into
     the shared menu via its `extra` slot */
  /* `.menuSettings` itself now lives in shared/theme.css — Flak Battery grew
     a settings block too, and both were styling it identically. */
  .modeRow{display:flex;gap:16px}

  /* on-screen d-pad, shown only in dpad input mode */
  /* In normal flow below the board, not absolutely positioned over it.
     `display:none` when off means makeFit measures it as zero and the swipe
     player keeps a full-size board; when on, it is real furniture and the
     board shrinks to fit above it. */
  #dpad{display:none;justify-content:center;
    grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,40px);
    gap:5px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
  #dpad.on{display:grid}
  #dpad button{padding:0;font-size:16px;background:rgba(15,32,39,.85);color:var(--bone);
    border:1px solid var(--line)}
  @media (hover: hover) { #dpad button:hover{background:rgba(15,32,39,1)} }
  #dpad .up{grid-column:2;grid-row:1}
  #dpad .left{grid-column:1;grid-row:2}
  #dpad .right{grid-column:3;grid-row:2}
  #dpad .down{grid-column:2;grid-row:3}

  /* Progress to the next checkpoint. A bar rather than a number: the exact
     percentage is not actionable, "nearly there" is. */
  #uiBank{display:inline-block;width:34px;height:6px;background:#1b3038;
    border-radius:1px;overflow:hidden;vertical-align:middle}
  #uiBank i{display:block;height:100%;width:0%;background:var(--brass);
    transition:width .2s linear}
</style>

<div id="shell">
  <header>
    <div class="titles">
      <a class="back" href="../../classics.html">&larr; Classics</a>
      <h1>Feed<span>line</span></h1>
    </div>
    <div class="meta">
      <div>Score <b id="uiScore">0</b></div>
      <div>Length <b id="uiLen">4</b></div>
      <!-- Progress toward the next bank. The checkpoints were invisible until
           they fired, which is half of why they read as absent — you cannot
           aim at a milestone you cannot see coming. -->
      <div>Bank <b id="uiBank" class="bank"><i></i></b></div>
      <div>Best <b id="uiBest">—</b></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv" width="800" height="600"></canvas>
    <div id="banner">
      <h2>Feedline</h2>
      <p id="hint">Swipe to steer.</p>
      <button id="go">Begin</button>
    </div>
  </div>

  <!-- A sibling of #stage, not a child: inside it the d-pad floated over the
       playfield and covered a good part of the board. Out here makeFit
       measures it as furniture and shrinks the board to make room, the same
       way Choke Point's controls strip works. -->
  <div id="dpad">
    <button type="button" class="up" data-dx="0" data-dy="-1" aria-label="Up">&uarr;</button>
    <button type="button" class="left" data-dx="-1" data-dy="0" aria-label="Left">&larr;</button>
    <button type="button" class="right" data-dx="1" data-dy="0" aria-label="Right">&rarr;</button>
    <button type="button" class="down" data-dx="0" data-dy="1" aria-label="Down">&darr;</button>
  </div>

  <footer>
    <span>You may cross where your tail is leaving</span>
    <span>Two turns can be buffered</span>
    <span>The gold one expires</span>
  </footer>
</div>

<script type="module">
import * as E from './engine.js';
import { makeFit } from '../../shared/fit.js';
import { makeFx } from '../../shared/fx.js';
import { glowStroke, glowDot, inkDot, fadeFrame, scanlines, GLOW_PASSES_CHEAP } from '../../shared/glow.js';
import { best, submit } from '../../shared/scores.js';
import { recordProgress } from '../../shared/unlocks.js';
import { makeAudio } from '../../shared/audio.js';
import { makeMenu } from '../../shared/menu.js';

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

const gfx = makeFx({ reduce, gravity: 200 });
const audio = makeAudio();

/* Translate grid coordinates to pixels before handing off to the shared
   particle layer, which works in pixels like every other shell's does. */
const cellBurst = (cx, cy, col, n) =>
  gfx.burst((cx + .5) * L.CELL, (cy + .5) * L.CELL, col, n, 120);

/* the engine never sees these — cosmetic particles, plus sound */
const fx = {
  eat(x, y) { cellBurst(x, y, '#c9a227', 10); audio.eat(); },
  bonus(x, y) { cellBurst(x, y, '#e6e9e2', 20); gfx.hit(.5); audio.bonus(); },
  die() { gfx.hit(.8); audio.die(); },
};

/* Portrait phones get a taller, narrower grid at the same cell size.
   Re-picked whenever the phone turns — see applyLayout. */
/* Portrait-only since 2026-07-27: landscape didn't feel right on a real phone.
   Every board uses the tall layout regardless of orientation. The rotation
   machinery below is left intact but inert (applyLayout early-returns because
   the layout never changes) — flip this flag back to false to restore
   landscape without re-deriving anything. */
const PORTRAIT_ONLY = true;
const pickLayout = () =>
  (PORTRAIT_ONLY || matchMedia('(max-aspect-ratio: 4/5)').matches) ? E.LAYOUT_TALL : E.LAYOUT;

const world = E.createWorld({ fx, layout: pickLayout(), seed: Date.now() & 0x7fffffff });

let L = world.L;
const board = { w: L.W, h: L.H };      // makeFit re-reads this on every fit

function adoptLayout() {
  L = world.L;
  board.w = L.W; board.h = L.H;
  cv.width = L.W; cv.height = L.H;
  document.documentElement.style.setProperty('--board-max', L.W + 'px');
}
adoptLayout();

/* ---------- input ---------- */
const KEYS = {
  ArrowLeft: [-1, 0], KeyA: [-1, 0],
  ArrowRight: [1, 0], KeyD: [1, 0],
  ArrowUp: [0, -1], KeyW: [0, -1],
  ArrowDown: [0, 1], KeyS: [0, 1],
};

addEventListener('keydown', e => {
  const d = KEYS[e.code];
  if (!d) return;
  e.preventDefault();
  // an arrow key also serves as "start", so the game begins the moment you steer
  if (!world.running && !world.over) start();
  E.turn(world, d[0], d[1]);
});

/* ---------- settings: swipe sensitivity + input mode ----------
   Both stored in localStorage, guarded the same way shared/scores.js is —
   a setting that fails to persist is not worth crashing a game over. */
/* v2 key: the value's *meaning* changed from a px threshold to a 0-100
   sensitivity, and the two ranges overlap, so a stored old value cannot be told
   from a new one. A new key means an old setting is ignored rather than
   misread — the cost is re-adjusting one slider, which beats a player finding
   their swipe silently recalibrated. */
const SENS_KEY = 'arcade:feedline:sensitivity2';
const MODE_KEY = 'arcade:feedline:inputmode';

/* The slider is a *sensitivity*, 0-100, and it now means what it says.

   It used to store the raw pixel threshold on a 4-40 scale, which made the
   control backwards — the label read "Swipe sensitivity" while sliding right
   made swipes *less* sensitive — and put the default at 10px, only 17% along
   its own travel. Most of the range was in territory too dead to play with.

   Rebased so the default sits in the middle, as asked. Taking "80% sensitivity
   on the old scale" as the target: 40 - 0.8 x (40 - 4) = 11px. The px range is
   now 4-18, so 11 is exactly the midpoint and the slider has equal usable room
   either side of it. Higher = more sensitive, throughout. */
const SWIPE_PX_MIN = 4;          // most sensitive: a 4px flick turns you
const SWIPE_PX_MAX = 18;         // least: a deliberate drag
const SENS_DEFAULT = 50;         // = 11px, the midpoint

/** Sensitivity (0-100) to the pixel threshold the gesture actually uses. */
const sensToPx = (sens) =>
  SWIPE_PX_MAX - (clamp01(sens) / 100) * (SWIPE_PX_MAX - SWIPE_PX_MIN);
function clamp01(v) { return Math.min(100, Math.max(0, v)); }

function readSensitivity() {
  try {
    const raw = localStorage.getItem(SENS_KEY);
    const v = parseInt(raw, 10);
    if (!Number.isFinite(v)) return SENS_DEFAULT;
    return clamp01(v);
  } catch { return SENS_DEFAULT; }
}
function writeSensitivity(v) { try { localStorage.setItem(SENS_KEY, String(v)); } catch {} }
function readInputMode() {
  try { return localStorage.getItem(MODE_KEY) === 'dpad' ? 'dpad' : 'swipe'; } catch { return 'swipe'; }
}
function writeInputMode(m) { try { localStorage.setItem(MODE_KEY, m); } catch {} }

/* Touch: a swipe picks the dominant axis. Wire is unplayable on a phone
   without this, and a grid game makes the gesture unambiguous. */
let swipe = null;
// Lowered from a hardcoded 24 after real-device testing, then made a stored,
// player-adjustable value — what felt right on one phone did not on another.
let swipeSens = readSensitivity();
let SWIPE_MIN = sensToPx(swipeSens);
let inputMode = readInputMode();

// Listen on the stage, not just the canvas, so a swipe that starts in the
// side gutters (landscape, where the board cannot fill the width) still steers.
const surface = $('stage');
surface.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;      // let ? and Begin work
  e.preventDefault();
  try { surface.setPointerCapture(e.pointerId); } catch {}
  swipe = { x: e.clientX, y: e.clientY };
});
surface.addEventListener('pointerup', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
  if (!world.running && !world.over) start();
  if (Math.abs(dx) > Math.abs(dy)) E.turn(world, Math.sign(dx), 0);
  else E.turn(world, 0, Math.sign(dy));
});
surface.addEventListener('pointercancel', () => { swipe = null; });
for (const ev of ['selectstart', 'contextmenu', 'dragstart']) {
  cv.addEventListener(ev, e => e.preventDefault());
}

/* Virtual d-pad — an alternative to swipe, not a replacement: swipe and
   keyboard both keep working regardless of which mode is picked, so this is
   purely an extra input surface shown when the player prefers it. */
const dpad = $('dpad');
let fitStage = null;      // assigned by makeFit further down; see syncInputMode
/* Showing or hiding the d-pad changes how much room is left for the board,
   and makeFit measures it — so the board has to be re-fitted on the toggle
   or it keeps a size computed against the other mode. Choke Point's controls
   strip has the identical requirement. Guarded because this runs once during
   setup, before `fitStage` is assigned (makeFit does the first fit itself). */
function syncInputMode() {
  dpad.classList.toggle('on', inputMode === 'dpad');
  if (fitStage) fitStage();
}
syncInputMode();
for (const btn of dpad.querySelectorAll('button')) {
  const dx = Number(btn.dataset.dx), dy = Number(btn.dataset.dy);
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!world.running && !world.over) start();
    E.turn(world, dx, dy);
  });
}

/* ---------- banner ---------- */
function showBanner(h, p, btn) {
  $('banner').classList.remove('hide');
  $('banner').querySelector('h2').textContent = h;
  $('hint').innerHTML = p;
  $('go').textContent = btn;
}
function start() {
  if (world.over) E.resetGame(world, Date.now() & 0x7fffffff);
  world.running = true;
  gfx.clear();               // don't let the death flash bleed into a fresh run
  hideExtraButtons();
  $('banner').classList.add('hide');
  sync();
}
$('go').addEventListener('click', start);

/* ---------- checkpoints ----------

   Filling this board takes 286 meals and about four and a half minutes of
   flawless play — see the note on CHECKPOINTS in the engine. The length was
   never the problem; losing all of it to one mistake in minute four was. The
   quarter marks are banked, and a lost run can drop back to the last one.

   Stored, so a bank survives closing the tab. Feedline is still deliberately
   outside shared/resume.js — that restores a *run in progress*, which a
   one-life score-attack should not have. This is different: it restores a
   milestone you already earned. */
const BANK_KEY = 'arcade:feedline:checkpoint';

function readBank() {
  try {
    const b = JSON.parse(localStorage.getItem(BANK_KEY) || 'null');
    if (!b || !Number.isFinite(b.eaten) || b.eaten <= 0) return null;
    return { eaten: Math.floor(b.eaten), score: Math.floor(b.score) || 0 };
  } catch { return null; }
}
function writeBank(b) {
  try { localStorage.setItem(BANK_KEY, JSON.stringify(b)); } catch {}
}
function clearBank() { try { localStorage.removeItem(BANK_KEY); } catch {} }

let bank = readBank();

/** Extra banner buttons — resume-from-checkpoint and quit. Built once and
 *  moved in and out, so their listeners are bound a single time. */
function makeBannerButton(id, label, bg) {
  const b = document.createElement('button');
  b.type = 'button'; b.id = id; b.textContent = label;
  b.style.cssText = `margin-left:8px;background:${bg};color:var(--bone)`;
  return b;
}
const resumeBtn = makeBannerButton('cpResume', 'From checkpoint', '#1b3038');
const quitBtn = makeBannerButton('quitBtn', 'Quit', '#2a1a17');

resumeBtn.addEventListener('click', () => {
  if (!E.resumeFromCheckpoint(world, bank)) return;
  world.running = true;
  gfx.clear();
  hideExtraButtons();
  $('banner').classList.add('hide');
  sync();
});
quitBtn.addEventListener('click', () => { location.href = '../../classics.html'; });

function hideExtraButtons() { resumeBtn.remove(); quitBtn.remove(); }

/* A checkpoint is a mini-win and has to feel like one, without stopping play —
   the wire is still moving. A banner would be worse than nothing here. */
let cpFlash = { text: '', life: 0 };
function flashCheckpoint(pct) {
  cpFlash = { text: `${pct}% BANKED`, life: 2.2 };
  audio.bonus();
  gfx.hit(.35);
}

/** Put the loss options on the banner: resume from a bank if there is one,
 *  and always a way out of the game entirely. */
function showLossButtons() {
  hideExtraButtons();
  const go = $('go');
  if (bank) go.after(resumeBtn);
  (bank ? resumeBtn : go).after(quitBtn);
}

/* `let`, and declared before syncInputMode can call it — makeFit performs the
   first fit itself, so the binding only has to exist by the time a *later*
   toggle needs to re-fit. No `extra`: the d-pad is a sibling of #stage inside
   #shell, so makeFit measures it automatically (and passing it here as well
   would double-count it). */
fitStage = makeFit({ canvas: cv, stage: $('stage'), board });

/* Rotating the phone moves the run onto the other grid. Score, meals and
   length come with you; the wire itself is re-laid, because a wire thirty
   columns wide has nowhere to exist on an eighteen-wide board. */
function applyLayout() {
  const L2 = pickLayout();
  if (L2 === world.L) return;
  const wasRunning = world.running;
  E.relayout(world, L2);
  adoptLayout();
  fitStage();
  sync();
  if (wasRunning) {
    world.running = false;
    showBanner('Turned', 'Your wire turned with the board.', 'Resume');
  }
}
addEventListener('resize', applyLayout);
addEventListener('orientationchange', () => setTimeout(applyLayout, 200));

// settings panel content, handed to the shared menu's `extra` slot
const settingsEl = document.createElement('div');
settingsEl.className = 'menuSettings';
settingsEl.innerHTML = `
  <h3>Settings</h3>
  <label>Swipe sensitivity
    <input type="range" id="sensRange" min="0" max="100" step="1" value="${swipeSens}">
  </label>
  <div class="modeRow">
    <label><input type="radio" name="inputMode" value="swipe"> Swipe</label>
    <label><input type="radio" name="inputMode" value="dpad"> D-pad</label>
  </div>
`;
settingsEl.querySelector('#sensRange').addEventListener('input', e => {
  swipeSens = Number(e.target.value);
  SWIPE_MIN = sensToPx(swipeSens);
  writeSensitivity(swipeSens);
});
for (const radio of settingsEl.querySelectorAll('[name=inputMode]')) {
  radio.checked = radio.value === inputMode;
  radio.addEventListener('change', e => {
    if (!e.target.checked) return;
    inputMode = e.target.value;
    writeInputMode(inputMode);
    syncInputMode();
  });
}

const pause = makeMenu({
  stage: $('stage'),
  host: document.querySelector('header'),
  audio,
  extra: settingsEl,
  title: 'Feedline',
  lore: 'Every world it touched became a part of it, and it does not stop.',
  rows: [
    ['Steer', 'Swipe. A short flick is enough.'],
    ['Grow', 'Every meal lengthens you and speeds the board up.'],
    ['Gold', 'Worth five meals, but it leaves.'],
  ],
  notes: [
    'You may cross the square your tail is leaving.',
    'Keyboard: arrows or WASD.',
  ],
});

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;

  const wasOver = world.over;
  if (!pause.paused) E.step(world, dt);
  if (world.over && !wasOver) {
    // finishing a run at all — won or lost — is what opens Flak Battery
    recordProgress(GAME_ID, 1);
    const r = submit(GAME_ID, world.score, `Length ${world.wire.length}`);
    syncBest();
    if (world.won) {
      clearBank(); bank = null;      // nothing left to resume toward
      showBanner('Board Cleared', `You filled the grid. Score <b style="color:var(--brass)">${world.score}</b>.`, 'Play again');
      hideExtraButtons();
      $('go').after(quitBtn);
    } else {
      showBanner('Game Over',
        r.record
          ? `New best — <b style="color:var(--brass)">${world.score}</b>, length ${world.wire.length}`
          : `Score <b style="color:var(--brass)">${world.score}</b> · length ${world.wire.length} · best ${r.best}`,
        'Play again');
      showLossButtons();
    }
  }
  /* Banking a checkpoint. Written the moment it is crossed rather than at the
     end of the run, because the run ends by dying — waiting would mean the
     bank only ever recorded runs that did not need it. */
  if (world.justCheckpoint) {
    world.justCheckpoint = false;
    const b = { eaten: world.eaten, score: world.score };
    if (!bank || b.eaten > bank.eaten) { bank = b; writeBank(b); }
    const pct = Math.round(E.CHECKPOINTS[world.checkpoint] * 100);
    flashCheckpoint(pct);
  }
  if (world.running) sync();

  gfx.step(dt);
  if (cpFlash.life > 0) cpFlash.life = Math.max(0, cpFlash.life - dt);

  draw();
  requestAnimationFrame(frame);
}

const GAME_ID = 'feedline';

function syncBest() {
  const b = best(GAME_ID);
  $('uiBest').textContent = b ? b.score : '—';
}

function sync() {
  $('uiScore').textContent = world.score;
  $('uiLen').textContent = world.wire.length;

  /* How close the next bank is, as a filling bar. `checkpoint` is the last one
     crossed, so the next is the one after it — and once they are all crossed
     the bar sits full rather than disappearing, since the board itself is the
     last milestone. */
  const next = E.CHECKPOINTS[world.checkpoint + 1];
  const bar = $('uiBank').firstElementChild;
  if (!bar) return;
  if (next === undefined) { bar.style.width = '100%'; return; }
  const cells = world.L.COLS * world.L.ROWS;
  const from = world.checkpoint < 0 ? 0 : E.CHECKPOINTS[world.checkpoint];
  const at = E.lengthAt(world.eaten) / cells;
  bar.style.width = Math.round(Math.max(0, Math.min(1, (at - from) / (next - from))) * 100) + '%';
}

/* ---------- draw ---------- */
const C = L.CELL;
const cx = c => c * C, cy = c => c * C;

/* The board is faded rather than cleared, so everything leaves a phosphor
   trail. `reduce` turns that into a hard clear — trails are exactly the kind of
   motion prefers-reduced-motion exists to suppress. */
function draw() {
  fadeFrame(ctx, L.W, L.H, { amount: .34, bg: '#050b0d', reduce });
  drawGrid();

  if (world.food) drawFood(world.food);
  if (world.bonus) drawBonus(world.bonus);
  drawWire();

  gfx.draw(ctx);

  if (gfx.flash > 0) {
    ctx.fillStyle = `rgba(224,80,60,${gfx.flash * .28})`;
    ctx.fillRect(0, 0, L.W, L.H);
  }

  // the checkpoint mark, fading out over the board without interrupting it
  if (cpFlash.life > 0) {
    const a = Math.min(1, cpFlash.life / 0.6);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `700 ${Math.round(L.CELL * 1.1)}px 'Chivo Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#050b0d';
    ctx.strokeText(cpFlash.text, L.W / 2, L.H * 0.28);
    ctx.fillStyle = '#c9a227';
    ctx.fillText(cpFlash.text, L.W / 2, L.H * 0.28);
    ctx.restore();
  }

  // also accumulating (multiply, so it settles darker than written) — hence low
  scanlines(ctx, L.W, L.H, { gap: 3, strength: .10 });
}

/* Anything static is drawn every frame onto a surface that is only faded, not
   cleared, so it accumulates: each frame keeps (1 - fade) of the last and adds
   a full-strength copy, settling at roughly 1/fade times the alpha written
   here. At a 0.34 fade that is about 3x. These alphas are therefore a third of
   what they look like they should be — the grid reads correctly on screen. */
function drawGrid() {
  ctx.strokeStyle = 'rgba(35,56,63,.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 1; x < L.COLS; x++) { ctx.moveTo(cx(x) + .5, 0); ctx.lineTo(cx(x) + .5, L.H); }
  for (let y = 1; y < L.ROWS; y++) { ctx.moveTo(0, cy(y) + .5); ctx.lineTo(L.W, cy(y) + .5); }
  ctx.stroke();
  // the border is the one piece of chrome worth lighting up
  glowStroke(ctx, c => c.rect(1.5, 1.5, L.W - 3, L.H - 3), '#2b5f52', 1, GLOW_PASSES_CHEAP, .35);
}

/** Body cells sit on the grid, but the head slides out of the cell it came
 *  from and the tail retracts into the next one, so motion reads as continuous
 *  rather than a row of jumps. Both come from the engine's tick progress, so
 *  the animation can't drift out of sync with the simulation. */
/* The wire is drawn as ONE continuous glowing polyline rather than a row of
   per-cell shapes. Two reasons: it is what the game is actually called and it
   looks the part, and it costs four stroke passes for the whole body instead of
   eight per cell — which on a 60-cell wire is the difference between a handful
   of draws and several hundred, every frame, on a phone. */
function wirePoints() {
  const s = world.wire, n = s.length;
  const p = world.running && !world.over ? E.tickProgress(world) : 1;
  const mid = (cell) => ({ x: cx(cell.x) + C / 2, y: cy(cell.y) + C / 2 });
  const base = s.map(mid);
  if (n < 2) return base;

  const pts = base.slice();
  // the head slides out of the cell it came from, so motion reads as
  // continuous rather than as a row of jumps
  pts[0] = {
    x: base[1].x + (base[0].x - base[1].x) * p,
    y: base[1].y + (base[0].y - base[1].y) * p,
  };
  // the tail retracts into the next cell — but only when it is actually
  // vacating. Mid-growth the tail stays put, and that cell is still solid.
  if (world.grow === 0) {
    const t = n - 1;
    pts[t] = {
      x: base[t].x + (base[t - 1].x - base[t].x) * p,
      y: base[t].y + (base[t - 1].y - base[t].y) * p,
    };
  }
  return pts;
}

function drawWire() {
  const pts = wirePoints();
  if (!pts.length) return;

  /* You are the invader here, so the body is made of cubes like everything else
     on their side. The continuous tube underneath stays — thinner, and now
     reading as the tether holding the cubes into one body rather than as the
     body itself. Without it a row of separate squares stops looking connected,
     which is the one thing this shape has to communicate. */
  if (pts.length > 1) {
    glowStroke(ctx, c => {
      c.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
    }, '#2f8a72', C * 0.16);
  }

  /* Body cubes, cheaply: a fill plus a two-pass rim each. The full `cube()`
     helper costs eight stroke passes, which on a sixty-cell net is several
     hundred draws a frame on a phone — the same reason the body was a single
     polyline to begin with. Skipping the head, which is drawn hotter below. */
  const sz = C * 0.62, bh = sz / 2;
  for (let i = pts.length - 1; i >= 1; i--) {
    const q = pts[i];
    const face = (c) => c.rect(q.x - bh, q.y - bh, sz, sz);
    ctx.fillStyle = '#12332b';
    ctx.beginPath(); face(ctx); ctx.fill();
    glowStroke(ctx, face, '#3fae8f', 1.6, GLOW_PASSES_CHEAP);
  }

  /* The head is drawn as the brightest point rather than as an extruded solid.
     `extrudeDisc` fills a dark body before rimming it, which is right for a
     discrete object sitting on a dark board — a tower, a brick — but on the tip
     of an already-glowing tube it punches a hole in the end. Volume here comes
     from the tube itself; the head just needs to be hotter than the body. */
  // the leading cube, hotter than the rest so the business end is unmistakable
  const hd = pts[0], hs = C * 0.72, hh = hs / 2;
  const hface = (c) => c.rect(hd.x - hh, hd.y - hh, hs, hs);
  ctx.fillStyle = '#1d6f5b';
  ctx.beginPath(); hface(ctx); ctx.fill();
  glowStroke(ctx, hface, '#9fffe0', 2);

  // eyes, so the direction of travel is readable even standing still. Drawn
  // dark and normally composited: the head is a bright emissive cube, so a
  // light pupil would be invisible against it and additive cannot darken.
  const d = world.dir;
  const ex = hd.x + d.x * 4, ey = hd.y + d.y * 4;
  const ox = d.x === 0 ? 4 : 0, oy = d.y === 0 ? 4 : 0;
  inkDot(ctx, ex - ox, ey - oy, 1.9);
  inkDot(ctx, ex + ox, ey + oy, 1.9);
}

/* The food has to hold its own against a very bright wire. It gets a warm halo,
   a solid gold body, and a near-white center — the hot core is what makes a
   small object read as "there" rather than as a smudge, and this is the one
   thing on the board you are actually looking for. */
/* The food is a world you are about to take, so it is drawn as one: a solid
   sphere with a hot center and an orbital ring.

   The ring is not decoration. Reported twice as "the food is gone" — and both
   times it was provably rendering, at full brightness, in every environment I
   could measure. What a bare disc actually loses is *silhouette*: a small round
   glow on a board that is now full of bright glowing shapes has nothing to make
   the eye stop on it. The ring roughly doubles its footprint and gives it an
   outline nothing else on the board has, which is a far more reliable fix than
   chasing brightness that was never the problem. It also makes it a planet
   rather than a pellet, which is what the fiction says it is. */
function drawFood(f) {
  const t = performance.now() / 400;
  const px = cx(f.x) + C / 2, py = cy(f.y) + C / 2;
  const pulse = reduce ? 0 : Math.sin(t) * 1.2;
  const r = C * .30 + pulse;

  // orbital ring, tilted, drawn behind the body
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(-0.42);
  ctx.scale(1, 0.34);
  glowStroke(ctx, c => c.arc(0, 0, r * 1.85, 0, Math.PI * 2), '#e8c86a', 1.6, GLOW_PASSES_CHEAP);
  ctx.restore();

  /* A normally-composited body under the glow, not glow alone. Everything else
     that survived on device has a source-over fill beneath its additive rim;
     the food was the only thing drawn purely additively, which makes it the
     only thing that would disappear outright if `lighter` misbehaved at small
     sizes on a given GPU. Cheap insurance against a failure I could not
     reproduce, and it costs one fill. */
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#c9a227';
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  glowDot(ctx, px, py, r, '#c9a227');
  glowDot(ctx, px, py, r * .42, '#fff3c4');
}

function drawBonus(b) {
  const t = performance.now() / 200;
  // fades as it runs out of time, so urgency is visible without a timer bar
  const life = b.ttl / E.BONUS_TTL;
  const col = life < .3 ? '#e0503c' : '#e6e9e2';
  const r = C * .34;
  const px = cx(b.x) + C / 2, py = cy(b.y) + C / 2;
  const star = (c) => {
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
      const a2 = a + Math.PI / 5;
      c.lineTo(px + Math.cos(a) * r, py + Math.sin(a) * r);
      c.lineTo(px + Math.cos(a2) * r * .45, py + Math.sin(a2) * r * .45);
    }
    c.closePath();
  };
  // pulsing brightness rather than pulsing alpha: on an additive layer alpha
  // reads as the shape thinning out, where brightness reads as it flaring
  const pulse = reduce ? 1 : .55 + .45 * Math.abs(Math.sin(t));
  glowStroke(ctx, star, col, 1.8, undefined, pulse);
}

syncBest();
sync();                      // makeFit already performed the first fit
requestAnimationFrame(frame);
</script>
